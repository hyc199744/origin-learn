  document.getElementById('hSub').innerHTML = T[LANG].sub;
  document.getElementById('hCount').textContent = T[LANG].count;
  play(1);
}
document.getElementById('langBtn').onclick = function(){
  LANG = (LANG==='zh') ? 'en' : 'zh';
  render();
};
render();
</script>
</body>
</html>
