<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>认识起源 ORIGIN · 新手入门介绍中心 - web3origin.com</title>
<meta name="description" content="从0开始了解 ORIGIN、LGNS、Anubis Chain 与未来数字金融生态。面向 Web3 新人、普通投资者与全球社区用户的第一入口。">
<meta name="keywords" content="认识起源,起源,ORIGIN,LGNS,Anubis Chain,新手入门,Web3入门,DeFi,质押,DAO,web3origin">
<link rel="canonical" href="https://web3origin.com/认识起源/">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="theme-color" content="#050303">
<meta property="og:type" content="website">
<meta property="og:site_name" content="起源学习站">
<meta property="og:title" content="认识起源 ORIGIN · 新手入门介绍中心">
<meta property="og:description" content="从0开始了解 ORIGIN、LGNS、Anubis Chain 与未来数字金融生态。">
<meta property="og:image" content="https://web3origin.com/assets/og-share-v2.png">
<style>
:root{
  --obsidian:#050303; --temple:#210507; --blood:#7A0B12; --blood-lt:#c0272d;
  --gold:#D6A84B; --gold-lt:#f0d48a; --bone:#F1DFC0; --ink:#e8d9be;
  --soft:#b79c74; --muted:#7c6a4f; --line:#3a2313;
  --serif:"STZhongsong","Songti SC","SimSun",Georgia,serif;
  --sans:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --mono:"SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--obsidian);color:var(--ink);font-family:var(--sans);line-height:1.8;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:.04em}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
::selection{background:var(--blood);color:var(--bone)}

/* 背景 */
.bg{position:fixed;inset:0;z-index:-3;overflow:hidden}
.bg img{position:absolute;top:0;left:50%;transform:translateX(-50%) scale(1.08);width:1920px;max-width:none;opacity:.42;animation:bgdrift 60s ease-in-out infinite alternate}
@keyframes bgdrift{from{transform:translateX(-50%) scale(1.08) translateY(0)}to{transform:translateX(-50%) scale(1.14) translateY(-40px)}}
.bg::after{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 80% at 50% 0%, rgba(122,11,18,.30), transparent 55%),
  radial-gradient(140% 100% at 50% 100%, #050303 30%, transparent 70%),
  linear-gradient(180deg, rgba(5,3,3,.60), rgba(5,3,3,.88))}
canvas.embers{position:fixed;inset:0;z-index:-2;pointer-events:none}

/* 顶栏 */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:20px;padding:13px 30px;
  background:linear-gradient(180deg,rgba(10,3,4,.92),rgba(10,3,4,.15) 75%,transparent);backdrop-filter:blur(6px)}
.nav .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:18px;color:var(--bone);white-space:nowrap}
.nav .brand img{width:26px;height:26px}
.nav .brand b{color:var(--gold-lt);font-weight:400}
.nav .links{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav .links::-webkit-scrollbar{display:none}
.nav .links a{font-size:13px;color:var(--soft);padding:7px 11px;border-radius:2px;position:relative;transition:color .2s;white-space:nowrap}
.nav .links a::after{content:"";position:absolute;left:11px;right:11px;bottom:3px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .28s}
.nav .links a:hover,.nav .links a.on{color:var(--bone)}
.nav .links a:hover::after,.nav .links a.on::after{transform:scaleX(1)}
.nav .home{color:var(--gold-lt)!important}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:6px;padding:3px;margin-left:6px;flex:0 0 auto}
.lang button{background:none;border:0;color:var(--soft);font-size:12px;padding:5px 9px;border-radius:4px;cursor:pointer;font-family:var(--sans)}
.lang button.on{background:linear-gradient(180deg,var(--gold-lt),var(--gold));color:var(--obsidian);font-weight:700}
.burger{display:none}

/* 通用 */
.wrap{max-width:1120px;margin:0 auto;padding:0 26px}
section{position:relative;padding:92px 0}
.eyebrow{font-size:12px;letter-spacing:.42em;color:var(--gold);text-transform:uppercase;margin-bottom:14px;text-align:center}
.sec-title{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:10px}
.sec-title img{width:44px;opacity:.85}
.sec-title img.flip{transform:scaleX(-1)}
.sec-title h2{font-size:clamp(25px,4vw,37px);color:var(--gold-lt);text-shadow:0 0 30px rgba(122,11,18,.6);text-align:center}
.sec-sub{text-align:center;color:var(--soft);max-width:680px;margin:0 auto 50px;font-size:15px}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .9s cubic-bezier(.2,.7,.3,1),transform .9s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1;transform:none}
.divider{height:1px;max-width:1120px;margin:0 auto;background:linear-gradient(90deg,transparent,var(--line),transparent)}

/* HERO */
#home{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:90px 20px 40px}
.hero-emblem{position:relative;width:min(40vw,340px);aspect-ratio:1;display:grid;place-items:center;margin-bottom:6px}
.hero-emblem .ring{position:absolute;inset:-6%;border-radius:50%;
  background:conic-gradient(from 0deg,transparent,rgba(214,168,75,.5),transparent 30%,transparent 50%,rgba(214,168,75,.35),transparent 80%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));animation:spin 26s linear infinite}
.hero-emblem .ring.r2{inset:2%;animation-duration:40s;animation-direction:reverse;opacity:.6}
@keyframes spin{to{transform:rotate(1turn)}}
.hero-emblem .glow{position:absolute;inset:-30%;background:radial-gradient(circle,rgba(240,90,50,.26),transparent 62%);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.6;transform:scale(.96)}50%{opacity:1;transform:scale(1.06)}}
.hero-emblem .em{position:relative;width:80%;filter:drop-shadow(0 0 30px rgba(240,80,40,.4))}
.hero-title{display:flex;align-items:center;justify-content:center;gap:20px;margin:20px 0 8px;flex-wrap:wrap}
.hero-title img{width:56px;opacity:.9}
.hero-title h1{font-size:clamp(28px,6vw,54px);color:var(--gold-lt);letter-spacing:.1em;text-shadow:0 0 30px rgba(240,80,40,.5),0 0 70px rgba(122,11,18,.6)}
.hero-lede{color:var(--soft);font-size:16px;max-width:40ch;margin:0 auto 28px}
.hero-lede b{color:var(--bone);font-weight:400}
.cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;gap:10px;font-family:var(--serif);font-size:16px;letter-spacing:.16em;color:var(--obsidian);
  background:linear-gradient(180deg,var(--gold-lt),var(--gold));padding:13px 30px;border-radius:2px;cursor:pointer;border:1px solid var(--gold-lt);
  box-shadow:0 0 0 1px rgba(0,0,0,.3) inset,0 8px 30px rgba(214,168,75,.35);transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(0,0,0,.3) inset,0 12px 42px rgba(240,140,60,.55)}
.cta.ghost{background:transparent;color:var(--gold-lt);box-shadow:none;border-color:var(--line)}
.cta.ghost:hover{border-color:var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.scroll-hint{margin-top:40px;color:var(--muted);font-size:12px;letter-spacing:.3em;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(8px);opacity:1}}

/* 石碑 tablet */
.tablets{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.tablet{position:relative;padding:22px 26px;background:linear-gradient(180deg,rgba(33,5,7,.85),rgba(10,3,3,.85));border:1px solid var(--line);border-left:3px solid var(--blood);border-radius:3px;overflow:hidden;transition:border-color .3s,transform .3s}
.tablet:hover{border-left-color:var(--gold);transform:translateY(-3px)}
.tablet::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 120% at 0% 0%,rgba(214,168,75,.06),transparent 60%);pointer-events:none}
.tablet h3{font-size:20px;color:var(--gold-lt);margin-bottom:8px;display:flex;align-items:center;gap:10px}
.tablet h3 .rune{color:var(--blood-lt);font-size:14px;font-family:var(--sans);border:1px solid rgba(192,39,45,.4);padding:2px 8px;border-radius:2px;flex:0 0 auto}
.tablet .en{font-size:12px;color:var(--muted);letter-spacing:.1em}
.tablet p{color:var(--soft);font-size:14.5px;margin:0}
.tablet p b{color:var(--bone);font-weight:400}

/* 双栏对照 */
.twin{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pane{border-radius:4px;padding:26px 28px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(26,6,7,.8),rgba(8,3,3,.85))}
.pane.web3{border-color:rgba(214,168,75,.35);background:linear-gradient(180deg,rgba(33,5,7,.85),rgba(10,3,3,.85))}
.pane h3{font-size:19px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.pane.bank h3{color:var(--soft)} .pane.web3 h3{color:var(--gold-lt)}
.pane>p{color:var(--soft);font-size:14px;margin:0 0 14px}
.pane ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.pane li{display:flex;gap:11px;font-size:14px;color:var(--soft);align-items:flex-start}
.pane li .d{flex:0 0 auto;margin-top:9px;width:7px;height:7px;border-radius:2px;background:var(--muted)}
.pane.web3 li .d{background:var(--gold);box-shadow:0 0 8px rgba(214,168,75,.6)}
.feat-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:30px}
.feat{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);border:1px solid var(--line);background:rgba(33,5,7,.6);border-radius:2px;padding:9px 16px}
.feat b{color:var(--gold-lt);font-weight:400}

/* 对比信息图 */
.cmp-table{border:1px solid var(--line);border-radius:5px;overflow:hidden;background:rgba(10,3,3,.5)}
.cmp-head{display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(180deg,rgba(33,5,7,.9),rgba(20,4,5,.9))}
.cmp-head>div{padding:16px 22px;font-family:var(--serif);font-size:17px;display:flex;align-items:center;gap:10px}
.cmp-head .b{color:var(--soft);border-right:1px solid var(--line)}
.cmp-head .c{color:var(--gold-lt)}
.cmp-body .row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.cmp-body .row>div{padding:15px 22px;font-size:14px}
.cmp-body .row .b{color:var(--soft);border-right:1px solid var(--line);background:rgba(8,3,3,.3)}
.cmp-body .row .c{color:var(--ink)}
.cmp-body .row .c::before{content:"◆ ";color:var(--gold);font-size:10px}

/* 价值卡 altar-like */
.value-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.vcard{position:relative;background:linear-gradient(180deg,rgba(33,5,7,.75),rgba(8,3,3,.8));border:1px solid var(--line);border-radius:5px;padding:22px 16px;text-align:center;transition:transform .35s,border-color .35s;overflow:hidden}
.vcard::before{content:"";position:absolute;top:0;left:-60%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(240,212,138,.12),transparent);transform:skewX(-18deg);transition:left .6s}
.vcard:hover{transform:translateY(-7px);border-color:rgba(214,168,75,.5)}
.vcard:hover::before{left:130%}
.vcard .ic{font-size:28px;margin-bottom:12px;filter:drop-shadow(0 0 10px rgba(240,90,50,.4))}
.vcard h3{font-size:16px;color:var(--gold-lt);margin-bottom:8px}
.vcard p{font-size:12.5px;color:var(--soft);margin:0}
.value-note{max-width:760px;margin:28px auto 0;text-align:center;color:var(--ink);font-family:var(--serif);font-size:16px;letter-spacing:.03em}

/* 神殿阶梯 stairs */
.stairs{position:relative;max-width:780px;margin:0 auto;padding-left:64px}
.stairs .track{position:absolute;left:26px;top:10px;bottom:10px;width:3px;background:rgba(122,11,18,.25);border-radius:3px;overflow:hidden}
.stairs .track i{position:absolute;left:0;top:0;width:100%;height:0;background:linear-gradient(180deg,var(--gold-lt),var(--blood-lt));box-shadow:0 0 14px rgba(240,120,60,.7);transition:height .1s linear}
.step{position:relative;margin-bottom:26px}
.step .sigil{position:absolute;left:-64px;top:0;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:22px;color:var(--muted);background:radial-gradient(circle,#1a0708,#0a0304);border:2px solid var(--line);transition:all .5s;z-index:1}
.step.lit .sigil{color:var(--obsidian);border-color:var(--gold-lt);background:radial-gradient(circle,var(--gold-lt),var(--gold));box-shadow:0 0 26px rgba(214,168,75,.6)}
.step .card{background:linear-gradient(180deg,rgba(33,5,7,.8),rgba(10,3,3,.82));border:1px solid var(--line);border-radius:4px;padding:20px 24px;transition:border-color .4s,transform .4s}
.step.lit .card{border-color:rgba(214,168,75,.4)}
.step .card:hover{transform:translateX(4px);border-color:rgba(214,168,75,.55)}
.step h3{font-size:20px;color:var(--gold-lt);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.step .goal{color:var(--soft);font-size:14px;margin:8px 0 0}
.step ul{margin:10px 0 0;padding-left:18px;color:var(--soft);font-size:13.5px}
.step li{margin:4px 0}
.step .tip{margin-top:12px;font-size:12.5px;color:var(--gold-lt);background:rgba(214,168,75,.06);border:1px solid rgba(214,168,75,.25);border-radius:3px;padding:8px 13px}

/* 门槛 tiers */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tier{background:linear-gradient(180deg,rgba(33,5,7,.8),rgba(10,3,3,.82));border:1px solid var(--line);border-radius:5px;padding:26px 24px;text-align:center;transition:transform .3s,border-color .3s}
.tier:hover{transform:translateY(-5px);border-color:rgba(214,168,75,.45)}
.tier .lvl{font-size:12px;letter-spacing:.24em;color:var(--blood-lt);text-transform:uppercase;margin-bottom:12px}
.tier h3{font-size:20px;color:var(--gold-lt);margin-bottom:10px}
.tier p{color:var(--soft);font-size:13.5px;margin:0}
.tier .cost{margin-top:14px;font-size:12.5px;color:var(--bone);border-top:1px dashed var(--line);padding-top:12px}

/* 收益机制 */
.mech-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:34px}
.mech{background:rgba(33,5,7,.6);border:1px solid var(--line);border-radius:2px;padding:10px 18px;color:var(--gold-lt);font-size:14px;font-family:var(--serif)}
.mech b{display:block;font-family:var(--sans);font-size:11.5px;color:var(--soft);margin-top:3px;font-weight:400}
/* 计算器 */
.calc{max-width:820px;margin:0 auto;background:linear-gradient(180deg,rgba(26,6,7,.75),rgba(8,3,3,.82));border:1px solid var(--line);border-radius:8px;padding:28px}
.calc-row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:18px}
.calc label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--soft)}
.calc input{background:#160c06;border:1px solid var(--line);border-radius:7px;padding:11px 12px;color:var(--bone);font-size:16px;font-family:var(--mono)}
.calc input:focus{outline:none;border-color:var(--gold-lt);box-shadow:0 0 0 2px rgba(214,168,75,.15)}
.calc-out{display:grid;gap:12px;background:rgba(214,168,75,.06);border:1px solid rgba(214,168,75,.28);border-radius:12px;padding:18px 20px}
.cstat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.cstat>span{color:var(--soft);font-size:13px}
.cstat b{font-family:var(--serif);font-size:21px;color:var(--gold-lt);text-align:right}
.cstat b.up{color:#8fbf78}
.cstat b i{font-size:12px;color:var(--soft);font-style:normal;font-family:var(--sans);font-weight:400}
.calc-note{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.85;border-top:1px solid var(--line);padding-top:12px}
.calc-note b{color:var(--warn,#e0a94a)}

/* KYC / future 卡 */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tcard{background:linear-gradient(180deg,rgba(33,5,7,.78),rgba(8,3,3,.82));border:1px solid var(--line);border-radius:5px;padding:24px;transition:transform .3s,border-color .3s}
.tcard:hover{transform:translateY(-5px);border-color:rgba(214,168,75,.45)}
.tcard .ic{font-size:26px;margin-bottom:12px}
.tcard h3{font-size:17px;color:var(--gold-lt);margin-bottom:8px}
.tcard p{font-size:13.5px;color:var(--soft);margin:0}
.future-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* 流程图 */
.flow{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;align-items:stretch}
.fstep{flex:1 1 180px;max-width:210px;background:linear-gradient(180deg,rgba(33,5,7,.8),rgba(10,3,3,.82));border:1px solid var(--line);border-radius:5px;padding:20px 18px;position:relative;transition:border-color .3s,transform .3s}
.fstep:hover{border-color:rgba(214,168,75,.45);transform:translateY(-4px)}
.fstep .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);color:var(--obsidian);background:linear-gradient(180deg,var(--gold-lt),var(--gold));margin-bottom:12px;font-size:16px}
.fstep h3{font-size:15.5px;color:var(--gold-lt);margin-bottom:6px}
.fstep p{font-size:12.5px;color:var(--soft);margin:0}
.fstep .arw{position:absolute;right:-13px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:18px;z-index:2}
.fstep:last-child .arw{display:none}

/* FAQ 封印石板 */
.slabs{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.slab{border:1px solid var(--line);border-radius:4px;background:linear-gradient(180deg,rgba(26,6,7,.85),rgba(8,3,3,.85));overflow:hidden;transition:border-color .3s}
.slab.open{border-color:rgba(214,168,75,.45)}
.slab .q{padding:18px 22px;cursor:pointer;display:flex;align-items:center;gap:14px;font-family:var(--serif);font-size:16.5px;color:var(--bone);user-select:none}
.slab .q .seal{width:10px;height:10px;flex:0 0 auto;border-radius:50%;background:var(--blood);box-shadow:0 0 0 3px rgba(122,11,18,.25);transition:all .3s}
.slab.open .q .seal{background:var(--gold-lt);box-shadow:0 0 12px var(--gold-lt),0 0 0 3px rgba(214,168,75,.25)}
.slab .q .x{margin-left:auto;color:var(--gold);font-size:20px;transition:transform .3s;font-family:var(--sans)}
.slab.open .q .x{transform:rotate(45deg)}
.slab .a{max-height:0;overflow:hidden;transition:max-height .45s ease}
.slab .a-in{padding:0 22px 20px;color:var(--soft);font-size:14.5px}
.slab .a-in p{margin:8px 0}
.slab .a-in b{color:var(--bone);font-weight:400}

/* CTA 底部 */
.endcta{text-align:center;max-width:640px;margin:0 auto}
.endcta h2{font-size:clamp(24px,4vw,34px);color:var(--gold-lt);margin-bottom:14px;text-shadow:0 0 30px rgba(122,11,18,.6)}
.endcta p{color:var(--soft);margin:0 auto 26px;font-size:15px}

footer{text-align:center;padding:46px 26px 60px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);background:rgba(5,3,3,.6)}
footer .cn{font-family:var(--serif);color:var(--soft);font-size:15px;letter-spacing:.2em;margin-bottom:10px}
.risk{max-width:820px;margin:20px auto 0;font-size:12px;color:var(--soft);background:rgba(122,11,18,.10);border:1px solid rgba(192,39,45,.3);border-radius:6px;padding:15px 20px;line-height:1.85;text-align:left}
.risk b{color:var(--blood-lt)}

@media(max-width:1000px){
  .value-grid{grid-template-columns:repeat(3,1fr)}
  .tablets,.twin,.tiers,.trio,.future-grid{grid-template-columns:1fr}
  .nav .links{display:none}
  .nav .links.open{display:flex;position:fixed;top:56px;left:0;right:0;flex-direction:column;background:rgba(8,3,3,.97);border-bottom:1px solid var(--line);padding:10px 16px;max-height:70vh;overflow:auto}

let lang='zh';

const esc=x=>x;
function render(){

  document.documentElement.lang=lang==='zh'?'zh-CN':lang;
  document.querySelectorAll('[data-t]').forEach(n=>{const v=d[n.getAttribute('data-t')];if(v!=null)n.innerHTML=v;});
  // 石碑
  $('#aboutTablets').innerHTML=d.aboutTablets.map(t=>`<div class="tablet"><h3><span class="rune">${t.r}</span>${t.t}</h3><div class="en">${t.en}</div><p>${t.d}</p></div>`).join('');
  // 特点
  $('#whyFeats').innerHTML=d.whyFeats.map(f=>`<span class="feat">${f}</span>`).join('');
  // 对比表
  $('#cmpBody').innerHTML=d.cmp.map(r=>`<div class="row"><div class="b">${r.b}</div><div class="c">${r.c}</div></div>`).join('');

  // 阶梯
  $('#stairs').innerHTML='<div class="track"><i id="stairFill"></i></div>'+d.steps.map((s,i)=>`<div class="step" data-i="${i+1}"><div class="sigil">${s.sig}</div><div class="card"><h3>${s.t} <span class="time" style="font-family:var(--sans);font-size:11px;color:var(--blood-lt);border:1px solid rgba(192,39,45,.4);padding:2px 9px;border-radius:2px">${s.time}</span></h3><p class="goal">${s.goal}</p><ul>${s.li.map(x=>`<li>${x}</li>`).join('')}</ul><div class="tip">${s.tip}</div></div></div>`).join('');
  bindStairs();
  // 门槛
  $('#tiers').innerHTML=d.tiers.map(t=>`<div class="tier"><div class="lvl">${t.lvl}</div><h3>${t.t}</h3><p>${t.d}</p><div class="cost">${t.cost}</div></div>`).join('');
  // 机制
  $('#mechRow').innerHTML=d.mech.map(m=>`<div class="mech">${m.t}<b>${m.b}</b></div>`).join('');
  // 流程
  $('#flowRow').innerHTML=d.flow.map((f,i)=>`<div class="fstep"><div class="n">${i+1}</div><h3>${f.t}</h3><p>${f.d}</p><div class="arw">➜</div></div>`).join('');

  $('#futureGrid').innerHTML=d.future.map(f=>`<div class="tcard"><div class="ic">${f.i}</div><h3>${f.t}</h3><p>${f.d}</p></div>`).join('');
  // FAQ
  $('#slabs').innerHTML=d.faq.map(f=>`<div class="slab"><div class="q"><span class="seal"></span>${f.q}<span class="x">+</span></div><div class="a"><div class="a-in">${f.a.map(x=>`<p>${x}</p>`).join('')}</div></div></div>`).join('');
  $('#slabs').querySelectorAll('.slab .q').forEach(q=>q.onclick=()=>{const s=q.parentElement,a=s.querySelector('.a');const open=s.classList.toggle('open');a.style.maxHeight=open?a.scrollHeight+'px':0;});
  runCalc();
}

/* 计算器 */
function runCalc(){
  const g=id=>document.getElementById(id);if(!g('cPrin'))return;
  const fmt=(x,dp=2)=>(isFinite(x)?x:0).toLocaleString('en-US',{maximumFractionDigits:dp});
  const d=T[lang];
  function run(){
    const p=Math.max(0,+g('cPrin').value||0),days=Math.max(0,+g('cDays').value||0),apy=Math.max(0,(+g('cApy').value||0)/100),price=Math.max(0,+g('cPrice').value||0);
    const N=4*365.25,periods=days*4,L=periods*Math.log1p(apy)/N,fin=L>700?Infinity:p*Math.exp(L);
    const gain=fin-p,pct=p>0?gain/p*100:0,perDay=(days>0&&isFinite(gain))?gain/days:0;
    const lbl=lang==='zh'?{a:'到期总量',b:'净增数量',c:'日均产出',e:'折合价值（按现价不变）',big:'数字过大，超出可计算范围'}
      :lang==='en'?{a:'Final amount',b:'Net gain',c:'Daily output',e:'Value (at current price)',big:'Number too large to compute'}
      :lang==='ja'?{a:'満期総量',b:'純増加',c:'日平均産出',e:'換算価値（現価固定）',big:'数値が大きすぎて計算不可'}
      :{a:'만기 총량',b:'순증가',c:'일평균 산출',e:'환산 가치(현가 고정)',big:'숫자가 너무 커 계산 불가'};
    if(!isFinite(fin)){g('calcOut').innerHTML=`<div class="cstat"><span>—</span><b>${lbl.big}</b></div>`;return;}
    g('calcOut').innerHTML=
      `<div class="cstat"><span>${lbl.a}</span><b>${fmt(fin)} <i>LGNS</i></b></div>`+
      `<div class="cstat"><span>${lbl.b}</span><b class="up">+${fmt(gain)} <i>LGNS（+${fmt(pct,1)}%）</i></b></div>`+
      `<div class="cstat"><span>${lbl.c}</span><b>≈ ${fmt(perDay,3)} <i>LGNS</i></b></div>`+
      (price>0?`<div class="cstat"><span>${lbl.e}</span><b>≈ ${fmt(fin*price)} <i>DAI</i></b></div>`:'');
  }
  ['cPrin','cDays','cApy','cPrice'].forEach(id=>{g(id).oninput=run;});
  run();
}

/* 阶梯圣火 */
let stairHandler=null;
function bindStairs(){
  const stairs=$('#stairs'),fill=$('#stairFill');const steps=[...document.querySelectorAll('.step')];if(!stairs||!fill)return;
  if(stairHandler)removeEventListener('scroll',stairHandler);
  stairHandler=function(){const r=stairs.getBoundingClientRect(),vh=innerHeight;const prog=Math.max(0,Math.min(1,(vh*.72-r.top)/(r.height*.82)));fill.style.height=(prog*100)+'%';steps.forEach((s,i)=>s.classList.toggle('lit',prog>=(i+.3)/steps.length));};
  addEventListener('scroll',stairHandler,{passive:true});stairHandler();
}

(function(){let l=null;try{l=localStorage.getItem('meetLang');}catch(e){}
  if(!l){const n=(navigator.language||'zh').toLowerCase();l=n.startsWith('zh')?'zh':n.startsWith('ja')?'ja':n.startsWith('ko')?'ko':'en';}
  setLang(l);})();

const secs=[...document.querySelectorAll('section')],navA=[...document.querySelectorAll('#navlinks a')];
const navIo=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)navA.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id));}),{threshold:.4});
secs.forEach(s=>navIo.observe(s));

/* HERO 视差 */
(function(){const em=$('#heroEm');if(!em||matchMedia('(prefers-reduced-motion:reduce)').matches)return;addEventListener('mousemove',e=>{const dx=(e.clientX/innerWidth-.5),dy=(e.clientY/innerHeight-.5);em.style.transform=`translate(${dx*20}px,${dy*16}px)`;});})();

/* 火星粒子 */
(function(){const c=$('#embers'),x=c.getContext('2d');let w,h,parts=[],mouse={x:-999,y:-999};const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function resize(){w=c.width=innerWidth;h=c.height=innerHeight;}resize();addEventListener('resize',resize);
  const N=reduce?0:Math.min(70,Math.floor(w/22));
  function newP(init){return{x:Math.random()*w,y:init?Math.random()*h:h+10,r:Math.random()*1.8+.4,s:Math.random()*.5+.2,d:Math.random()*.6-.3,life:Math.random(),hue:Math.random()<.35?42:8};}
  for(let i=0;i<N;i++)parts.push(newP(true));
  addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
  function tick(){x.clearRect(0,0,w,h);for(const p of parts){const dx=p.x-mouse.x,dy=p.y-mouse.y,dist=Math.hypot(dx,dy);if(dist<90){p.x+=dx/dist*1.6;p.y+=dy/dist*1.6;}p.y-=p.s;p.x+=p.d+Math.sin(p.y*.01)*.3;p.life+=.006;if(p.y<-10||p.x<-10||p.x>w+10)Object.assign(p,newP(false));const a=(.5+Math.sin(p.life*4)*.5)*.7;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=p.hue===42?`rgba(240,212,138,${a})`:`rgba(224,90,50,${a})`;x.shadowBlur=8;x.shadowColor=p.hue===42?'rgba(240,180,80,.8)':'rgba(224,70,40,.8)';x.fill();}requestAnimationFrame(tick);}
  if(!reduce)tick();})();
</script>
