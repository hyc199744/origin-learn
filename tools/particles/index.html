<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEURAL PARTICLES · 神经粒子</title>
<style>
:root{
  --lime:#87DB00; --bg:#050508; --panel:rgba(12,14,18,.78);
  --txt:#fff; --muted:rgba(255,255,255,.55); --border:rgba(255,255,255,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:"Plus Jakarta Sans",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt)}
#c{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
/* HUD */
.hud{position:fixed;z-index:5;pointer-events:none}
.hud.tl{top:18px;left:20px}
.hud.tr{top:18px;right:20px;text-align:right;font-size:11px;color:var(--muted);letter-spacing:1.5px;line-height:1.9}
.hud.tr b{color:var(--lime);font-weight:700}
.title{font-weight:800;font-size:15px;letter-spacing:3px}
.title em{font-style:normal;color:var(--lime)}
.sub{font-size:10px;letter-spacing:2.5px;color:var(--muted);margin-top:5px}
.shape-name{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);z-index:5;pointer-events:none;
  font-size:13px;letter-spacing:6px;color:var(--muted);opacity:0;transition:opacity .5s;white-space:nowrap}
.shape-name.show{opacity:1}
.shape-name b{color:var(--lime)}
/* control panel */
.panel{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:10;width:min(680px,calc(100vw - 20px));
  background:var(--panel);border:1px solid var(--border);border-radius:20px;backdrop-filter:blur(14px);
  padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--txt);border-radius:999px;
  font-size:13px;font-weight:600;padding:10px 18px;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4}
.btn.act{background:var(--lime);border-color:var(--lime);color:#0a0c00}
.btn.energy{background:linear-gradient(135deg,#ff9d00,#ff3d00);border:none;color:#fff;font-weight:800;
  box-shadow:0 0 22px rgba(255,110,0,.45)}
.btn.energy:disabled{opacity:.45;box-shadow:none}
.btn.icon{padding:10px 13px;font-size:14px}
.swatches{display:flex;gap:8px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex:none}
.sw.act{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.35)}
.speedbox{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
input[type=range]{-webkit-appearance:none;width:110px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--lime);cursor:pointer;box-shadow:0 0 10px rgba(135,219,0,.6)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;background:var(--lime);cursor:pointer}
.lbl{font-size:11px;letter-spacing:1.5px;color:var(--muted)}
.hidden-ui .panel,.hidden-ui .hud,.hidden-ui .shape-name{display:none}
#uiToggle{position:fixed;right:14px;bottom:14px;z-index:11;width:42px;height:42px;border-radius:50%;
  background:var(--panel);border:1px solid var(--border);color:var(--muted);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
.hidden-ui #uiToggle{bottom:14px}
.tip{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;background:rgba(0,0,0,.8);
  border:1px solid var(--border);border-radius:14px;padding:14px 22px;font-size:13px;color:var(--muted);
  pointer-events:none;opacity:0;transition:opacity .4s;text-align:center;line-height:2}
.tip.show{opacity:1}
@media (max-width:520px){
  .title{font-size:12px}.hud.tr{display:none}
  .btn{font-size:12px;padding:9px 14px}
  .shape-name{bottom:158px}
}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>

<div class="hud tl">
  <div class="title">NEURAL <em>PARTICLES</em></div>
  <div class="sub">神经粒子 · 讲课投屏版</div>
</div>
<div class="hud tr">
  <div><b id="fps">60</b> FPS</div>
  <div><b>9000</b> PARTICLES</div>
</div>
<div class="shape-name" id="shapeName"></div>

<div class="panel" id="panel">
  <div class="row">
    <button class="btn act" data-shape="0">🌐 星球 PLANET</button>
    <button class="btn" data-shape="1">🧬 双螺旋 DNA</button>
    <button class="btn" data-shape="2">🪐 圆环 RING</button>
    <button class="btn energy" id="energyBtn">⚡ 释放能量</button>
  </div>
  <div class="row">
    <span class="lbl">颜色</span>
    <div class="swatches" id="swatches"></div>
    <span class="lbl" style="margin-left:6px">速度</span>
    <div class="speedbox"><input type="range" id="speed" min="20" max="300" value="100"><span id="speedVal" style="min-width:38px">1.0x</span></div>
    <button class="btn icon" id="pauseBtn" title="暂停/继续">⏸</button>
  </div>
</div>
<button id="uiToggle" title="隐藏/显示界面">👁</button>
<div class="tip" id="tip"></div>

<script type="module">
import * as THREE from 'three';

/* ================= 基础 ================= */
const COUNT = 9000;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x050508, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 2.5, 23);

const group = new THREE.Group();
scene.add(group);

/* 背景星尘 */
{
  const n = 700, p = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const r = 40+Math.random()*40, th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    p[i*3]=r*Math.sin(ph)*Math.cos(th); p[i*3+1]=r*Math.cos(ph)*0.6; p[i*3+2]=r*Math.sin(ph)*Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p,3));
  group.add(new THREE.Points(g, new THREE.PointsMaterial({color:0x334455,size:0.35,transparent:true,opacity:.55})));
}
/* 极坐标网格（科技感） */
{
  const pts=[];
  for(let r=4;r<=16;r+=4){ for(let i=0;i<=90;i++){ const a=i/90*Math.PI*2; pts.push(Math.cos(a)*r,0,Math.sin(a)*r); } }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  const grid=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x87DB00,transparent:true,opacity:0.05}));
  grid.position.y=-9; group.add(grid);
}

/* ================= 粒子 ================= */
const pos = new Float32Array(COUNT*3);
const aSize = new Float32Array(COUNT);
const aHue = new Float32Array(COUNT);
const aRand = new Float32Array(COUNT);
for(let i=0;i<COUNT;i++){ aSize[i]=0.7+Math.random()*1.3; aHue[i]=Math.random(); aRand[i]=Math.random(); }

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
geo.setAttribute('aSize', new THREE.BufferAttribute(aSize,1));
geo.setAttribute('aHue', new THREE.BufferAttribute(aHue,1));
geo.setAttribute('aRand', new THREE.BufferAttribute(aRand,1));

const uniforms = {
  uColor:{value:new THREE.Color('#87DB00')},
  uRainbow:{value:0},
  uTime:{value:0}
};
const mat = new THREE.ShaderMaterial({
  uniforms, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    attribute float aSize; attribute float aHue; attribute float aRand;
    varying float vHue; varying float vRand; varying float vFog;
    void main(){
      vHue=aHue; vRand=aRand;
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=aSize*(340.0/-mv.z);
      vFog=smoothstep(45.0,12.0,-mv.z);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    uniform vec3 uColor; uniform float uRainbow; uniform float uTime;
    varying float vHue; varying float vRand; varying float vFog;
    vec3 hsv(float h,float s,float v){
      vec3 k=clamp(abs(mod(h*6.0+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.);
      return v*mix(vec3(1.),k,s);
    }
    void main(){
      vec2 uv=gl_PointCoord-0.5;
      float d=length(uv);
      float core=smoothstep(0.5,0.0,d);
      float glow=pow(core,2.4);
      vec3 col = uRainbow>0.5 ? hsv(fract(vHue+uTime*0.03),0.85,1.0) : uColor;
      float tw=0.75+0.25*sin(uTime*3.0+vRand*40.0);
      vec3 c=col*(0.55+0.65*vRand)*tw;
      float a=glow*(0.35+0.65*vFog);
      gl_FragColor=vec4(c*a,a);
    }`
});
const points = new THREE.Points(geo, mat);
group.add(points);

/* ================= 三种形态 ================= */
function buildPlanet(){
  const t=new Float32Array(COUNT*3); let i=0;
  const shell=5600, inner=2400, hubs=1000;
  const ga=Math.PI*(3-Math.sqrt(5));
  for(let k=0;k<shell;k++,i++){
    const y=1-(k/(shell-1))*2, r=Math.sqrt(1-y*y), th=ga*k;
    t[i*3]=Math.cos(th)*r*7; t[i*3+1]=y*7; t[i*3+2]=Math.sin(th)*r*7;
  }
  for(let k=0;k<inner;k++,i++){
    const r=5.2*Math.cbrt(Math.random()), th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    t[i*3]=r*Math.sin(ph)*Math.cos(th); t[i*3+1]=r*Math.cos(ph); t[i*3+2]=r*Math.sin(ph)*Math.sin(th);
  }
  const centers=[];
  for(let c=0;c<40;c++){ const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    centers.push([Math.sin(ph)*Math.cos(th)*7, Math.cos(ph)*7, Math.sin(ph)*Math.sin(th)*7]); }
  for(let k=0;k<hubs;k++,i++){
    const c=centers[k%40], s=0.9;
    t[i*3]=c[0]+(Math.random()-0.5)*2*s; t[i*3+1]=c[1]+(Math.random()-0.5)*2*s; t[i*3+2]=c[2]+(Math.random()-0.5)*2*s;
  }
  return t;
}
function buildDNA(){
  const t=new Float32Array(COUNT*3); let i=0;
  const per=3200, H=17, R=3.4, TURNS=3;
  const strand=(off)=>{
    for(let k=0;k<per;k++,i++){
      const f=k/(per-1), a=f*TURNS*Math.PI*2+off, y=(f-0.5)*H;
      t[i*3]=Math.cos(a)*R; t[i*3+1]=y; t[i*3+2]=Math.sin(a)*R;
    }
  };
  strand(0); strand(Math.PI);
  const rungs=COUNT-i;
  for(let k=0;k<rungs;k++,i++){
    const f=Math.random(), a=Math.random()*Math.PI*2, y=(f-0.5)*H, m=Math.random();
    const x1=Math.cos(a)*R, z1=Math.sin(a)*R, x2=-x1, z2=-z1;
    t[i*3]=x1+(x2-x1)*m+(Math.random()-0.5)*0.5;
    t[i*3+1]=y+(Math.random()-0.5)*0.5;
    t[i*3+2]=z1+(z2-z1)*m+(Math.random()-0.5)*0.5;
  }
  return t;
}
function buildRing(){
  const t=new Float32Array(COUNT*3); let i=0;
  const tor=6800, R=6.2, r=1.7;
  for(let k=0;k<tor;k++,i++){
    const u=Math.random()*Math.PI*2, v=Math.random()*Math.PI*2;
    t[i*3]=(R+r*Math.cos(v))*Math.cos(u);
    t[i*3+1]=r*Math.sin(v)*0.9;
    t[i*3+2]=(R+r*Math.cos(v))*Math.sin(u);
  }
  const rest=COUNT-i;
  for(let k=0;k<rest;k++,i++){
    const a=Math.random()*Math.PI*2, rr=8.6+Math.random()*2.6;
    t[i*3]=Math.cos(a)*rr; t[i*3+1]=(Math.random()-0.5)*0.35; t[i*3+2]=Math.sin(a)*rr;
  }
  return t;
}
const shapes=[buildPlanet(), buildDNA(), buildRing()];
const shapeNames=['<b>神经星球</b> NEURAL PLANET','<b>双螺旋</b> DOUBLE HELIX','<b>星环</b> STELLAR RING'];

/* 初始位置 = 星球 */
pos.set(shapes[0]);
geo.attributes.position.needsUpdate=true;

/* ================= 形态切换 ================= */
let curShape=0, morphT=1, morphDur=2.4;
const morphFrom=new Float32Array(COUNT*3);
const morphDelay=new Float32Array(COUNT);
const shapeNameEl=document.getElementById('shapeName');
let nameTimer=null;
function showName(i){
  shapeNameEl.innerHTML=shapeNames[i];
  shapeNameEl.classList.add('show');
  clearTimeout(nameTimer); nameTimer=setTimeout(()=>shapeNameEl.classList.remove('show'),2200);
}
function goShape(i){
  if(i===curShape||energy.active) return;
  morphFrom.set(pos);
  for(let k=0;k<COUNT;k++) morphDelay[k]=Math.random()*0.55;
  curShape=i; morphT=0;
  document.querySelectorAll('[data-shape]').forEach(b=>b.classList.toggle('act',+b.dataset.shape===i));
  showName(i);
}
document.querySelectorAll('[data-shape]').forEach(b=>b.addEventListener('click',()=>goShape(+b.dataset.shape)));
const easeIO=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOut=x=>1-Math.pow(1-x,3);

/* ================= 能量释放 ================= */
const energy={active:false,t:0,dur:2.8};
const eFrom=new Float32Array(COUNT*3), eOut=new Float32Array(COUNT*3);
const energyBtn=document.getElementById('energyBtn');
function setEnergyLock(lock){
  energyBtn.disabled=lock;
  document.querySelectorAll('[data-shape]').forEach(b=>b.disabled=lock);
}
energyBtn.addEventListener('click',()=>{
  if(energy.active||paused) return;
  energy.active=true; energy.t=0;
  eFrom.set(pos);
  for(let k=0;k<COUNT;k++){
    let dx=eFrom[k*3]+(Math.random()-0.5)*3,
        dy=eFrom[k*3+1]+(Math.random()-0.5)*3,
        dz=eFrom[k*3+2]+(Math.random()-0.5)*3;
    const l=Math.hypot(dx,dy,dz)||1, s=6+Math.random()*7;
    eOut[k*3]=eFrom[k*3]+dx/l*s; eOut[k*3+1]=eFrom[k*3+1]+dy/l*s; eOut[k*3+2]=eFrom[k*3+2]+dz/l*s;
  }
  energyBtn.disabled=true;
  setEnergyLock(true);
  tip('⚡ 能量释放！');
});

/* ================= 颜色 ================= */
const COLORS=[
  {n:'荧光绿',c:'#87DB00'},{n:'青',c:'#00E5FF'},{n:'品红',c:'#FF2FB3'},
  {n:'金',c:'#FFB800'},{n:'蓝',c:'#4D7CFE'},{n:'彩虹',c:'rainbow'}
];
const swBox=document.getElementById('swatches');
COLORS.forEach((o,idx)=>{
  const d=document.createElement('div');
  d.className='sw'+(idx===0?' act':'');
  d.title=o.n;
  d.style.background=o.c==='rainbow'
    ?'conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)'
    :o.c;
  d.addEventListener('click',()=>{
    document.querySelectorAll('.sw').forEach(x=>x.classList.remove('act'));
    d.classList.add('act');
    if(o.c==='rainbow'){ uniforms.uRainbow.value=1; }
    else{ uniforms.uRainbow.value=0; uniforms.uColor.value.set(o.c); }
  });
  swBox.appendChild(d);
});

/* ================= 速度 / 暂停 ================= */
let speedMul=1, paused=false;
const speedEl=document.getElementById('speed'), speedVal=document.getElementById('speedVal');
speedEl.addEventListener('input',()=>{ speedMul=speedEl.value/100; speedVal.textContent=speedMul.toFixed(1)+'x'; });
const pauseBtn=document.getElementById('pauseBtn');
pauseBtn.addEventListener('click',()=>{
  paused=!paused;
  pauseBtn.textContent=paused?'▶':'⏸';
  energyBtn.disabled=paused||energy.active;
  tip(paused?'⏸ 已暂停': '▶ 继续');
});

/* ================= 旋转 / 缩放 ================= */
let rotVX=0, rotVY=0, dragging=false, lastX=0, lastY=0, autoRot=0.12;
const ptrs=new Map(); let pinchD=0;
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1){ dragging=true; lastX=e.clientX; lastY=e.clientY; rotVX=rotVY=0; }
  else if(ptrs.size===2){ const p=[...ptrs.values()]; pinchD=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]); dragging=false; }
});
canvas.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){
    const p=[...ptrs.values()], d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
    camera.position.z=THREE.MathUtils.clamp(camera.position.z-(d-pinchD)*0.03,10,40);
    pinchD=d; return;
  }
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  rotVY=dx*0.0045; rotVX=dy*0.0045;
  group.rotation.y+=rotVY; group.rotation.x=THREE.MathUtils.clamp(group.rotation.x+rotVX,-1.2,1.2);
});
const endPtr=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinchD=0; if(ptrs.size===0) dragging=false; };
canvas.addEventListener('pointerup',endPtr);
canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  camera.position.z=THREE.MathUtils.clamp(camera.position.z+e.deltaY*0.02,10,40);
},{passive:false});

/* ================= UI 显隐 / 提示 ================= */
const tipEl=document.getElementById('tip'); let tipT=null;
function tip(s){ tipEl.textContent=s; tipEl.classList.add('show'); clearTimeout(tipT); tipT=setTimeout(()=>tipEl.classList.remove('show'),1400); }
document.getElementById('uiToggle').addEventListener('click',()=>{
  document.body.classList.toggle('hidden-ui');
  if(document.body.classList.contains('hidden-ui')) tip('双击画面可恢复界面');
});
let lastTap=0;
canvas.addEventListener('dblclick',()=>document.body.classList.remove('hidden-ui'));
canvas.addEventListener('pointerup',()=>{
  const n=Date.now(); if(n-lastTap<320) document.body.classList.remove('hidden-ui'); lastTap=n;
});

/* ================= 主循环 ================= */
const clock=new THREE.Clock();
let fpsE=60;
const fpsEl=document.getElementById('fps');
function animate(){
  requestAnimationFrame(animate);
  const rawDt=Math.min(clock.getDelta(),0.05);
  fpsE=fpsE*0.95+(1/Math.max(rawDt,1e-4))*0.05;
  fpsEl.textContent=Math.round(fpsE);

  if(!paused){
    uniforms.uTime.value+=rawDt;
    const dt=rawDt;
    /* 旋转：惯性 + 自动 */
    if(!dragging){
      group.rotation.y+=rotVY+autoRot*speedMul*dt;
      group.rotation.x=THREE.MathUtils.clamp(group.rotation.x+rotVX,-1.2,1.2);
      rotVX*=0.94; rotVY*=0.94;
    }
    /* 形态过渡 */
    if(morphT<1&&!energy.active){
      morphT=Math.min(1,morphT+dt*speedMul/morphDur);
      const tgt=shapes[curShape];
      for(let k=0;k<COUNT;k++){
        const l=Math.min(1,Math.max(0,(morphT-morphDelay[k])/(1-0.55)));
        const e=easeIO(l), j=k*3;
        pos[j]  =morphFrom[j]  +(tgt[j]  -morphFrom[j])*e;
        pos[j+1]=morphFrom[j+1]+(tgt[j+1]-morphFrom[j+1])*e;
        pos[j+2]=morphFrom[j+2]+(tgt[j+2]-morphFrom[j+2])*e;
      }
      geo.attributes.position.needsUpdate=true;
    }
    /* 能量释放 */
    if(energy.active){
      energy.t+=dt/energy.dur;
      const tgt=shapes[curShape];
      if(energy.t<0.42){
        const e=easeOut(energy.t/0.42);
        for(let k=0;k<COUNT;k++){ const j=k*3;
          pos[j]=eFrom[j]+(eOut[j]-eFrom[j])*e;
          pos[j+1]=eFrom[j+1]+(eOut[j+1]-eFrom[j+1])*e;
          pos[j+2]=eFrom[j+2]+(eOut[j+2]-eFrom[j+2])*e;
        }
      }else{
        const e=easeIO((energy.t-0.42)/0.58);
        for(let k=0;k<COUNT;k++){ const j=k*3;
          pos[j]=eOut[j]+(tgt[j]-eOut[j])*e;
          pos[j+1]=eOut[j+1]+(tgt[j+1]-eOut[j+1])*e;
          pos[j+2]=eOut[j+2]+(tgt[j+2]-eOut[j+2])*e;
        }
      }
      geo.attributes.position.needsUpdate=true;
      if(energy.t>=1){ energy.active=false; setEnergyLock(false); energyBtn.disabled=paused; morphT=1; }
    }
  }
  renderer.render(scene,camera);
}
animate();
showName(0);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
