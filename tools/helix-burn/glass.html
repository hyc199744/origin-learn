async function getOpenSec(){ // 最近一个抢满(或有成交)的协议日,从当天 0 点算起第几秒开放;读不到按 11:59:00
  if(Date.now()-openSecCache.at<120e3&&openSecCache.v!==null) return openSecCache.v;
  let v=43140, src='';
  /* 11-04:闸门合约 10-29 升级后有 0xa4b5c200 = 每天开放秒数(现 43140=11:59:00),官方改时间页面立刻跟上;读不到再用 burners.json */
  try{ const x=Number(big(await call(A.GATE,'0xa4b5c200'))); if(x>0&&x<86400){ v=x; src='chain'; } }catch(e){}
  if(!src){ try{ const j=await (await fetch('https://zjgame.web3origin.com/helix/burners.json',{cache:'no-store'})).json(); const ds=(j.days||[]).filter(d=>d.full||d.count>=50); if(ds.length) v=ds[ds.length-1].openSec; }catch(e){} }
  if(openSecCache.v!==null&&openSecCache.v!==v) log(L('⚠ 官方开放时间变了：现在每天 ','⚠ Official open time changed: now daily at ')+String(Math.floor(v/3600)).padStart(2,'0')+':'+String(Math.floor(v%3600/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0'),'bad');
  openSecCache={at:Date.now(),v}; return v; }

function allProviders(){
  const w=window; const cands=[];
  if(w.ethereum){ if(Array.isArray(w.ethereum.providers)) cands.push(...w.ethereum.providers); cands.push(w.ethereum); }
  if(w.bitkeep&&w.bitkeep.ethereum) cands.push(w.bitkeep.ethereum);
  if(w.okxwallet) cands.push(w.okxwallet);
  if(w.tokenpocket&&w.tokenpocket.ethereum) cands.push(w.tokenpocket.ethereum);
  const uniq=[...new Set(cands.filter(p=>p&&typeof p.request==='function'))];
  // 多个注入时优先用真正的钱包 App 自己的 provider
  const best=uniq.find(p=>p.isBitKeep||p.isOkxWallet||p.isOKExWallet||p.isTokenPocket||p.isImToken);
  return best?[best,...uniq.filter(p=>p!==best)]:uniq;
}
function pickProvider(){ return allProviders()[0]||null; }

const withTO=(pr,ms,tag)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error(tag+L('：钱包 '+Math.round(ms/1000)+' 秒没回应',': wallet did not respond in '+Math.round(ms/1000)+' s')),{code:'TIMEOUT'})),ms))]);
async function askAccounts(){ // 钱包没回应就换下一个注入接口再试,最后试 eth_accounts

      else if(tr.gas>=GAS_MIN) log(L('✓ 预演通过：钱包给的 Gas 上限 '+tr.gas+'，价格 '+tr.gwei+' gwei。抢的时候弹出来直接点确认就行（这次节点没发，不扣钱；钱包刚才提示「RPC 节点数据异常」就是这个，正常）','✓ Rehearsal passed: wallet gas limit '+tr.gas+', price '+tr.gwei+' gwei. When it pops for real, just confirm (nothing was sent this time and no fee; the wallet error you saw is expected)'),'ok');
      else { buzz([300,80,300]); log(L('✗ 预演发现钱包 Gas 上限只有 '+tr.gas+'，这样抢一定失败。抢的时候要点「网络费用 → 自定义」把上限改成 450000（这次节点没发，不扣钱）','✗ Rehearsal found the wallet gas limit is only '+tr.gas+'; that will fail. When grabbing, set Network fee → Custom → Gas limit 450000 (nothing was sent, no fee)'),'bad'); } }
    else if(h){ log(L('⚠ 这笔被发出去了，没经过托管节点（'+h+'）。请重新点「一键检测」','⚠ This was sent without the relay ('+h+'). Please run "One-tap check" again'),'bad'); relayDel(me); markBypass(); relayRender(); }
    else log(L('预演没拿到结果：','Rehearsal got no result: ')+trR(err).slice(0,150),'warn');
  }finally{ $('btnRehearse').disabled=false; }
}
$('btnRehearse').onclick=rehearse;
let oneBusy=false; async function oneClick(){ if(oneBusy) return; if(!me){ log(L('先连接钱包','Connect wallet first'),'warn'); return; } oneBusy=true; try{ if(!relayOn()){ log(L('一键检测第 1 步：检测托管节点。钱包会弹一笔「给自己授权 0 枚 LGNS」，不动资产，直接确认','One-tap check step 1: relay. The wallet pops an approve-0 to yourself; it moves nothing, just confirm'),'warn'); await relayDetect(); if(!relayOn()) return; await new Promise(r=>setTimeout(r,900)); log(L('一键检测第 2 步：预演。钱包会弹一笔「烧 500 LGNS」，节点不发、不扣钱，直接确认','Step 2: rehearsal. The wallet pops a burn 500 LGNS; the node will not send it, no fee, just confirm'),'warn'); } await rehearse(); } finally{ oneBusy=false; } }
$('toolOne').onclick=()=>{ oneClick(); };
$('toast').onclick=()=>{ $('toast').className='toast hidden'; };
setInterval(()=>{ try{ $('toolOne').disabled=oneBusy||$('btnRelay').disabled||$('btnRehearse').disabled; $('toolOne').textContent=$('toolOne').disabled?L('检测中…（按钱包提示确认）','Checking… (confirm in wallet)'):L('重新检测','Check again'); $('toolOne').parentNode.classList.toggle('hidden',!me||!!document.querySelector('[data-act="one"]')); }catch(e){} },500);
const ICO={wallet:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2M3 9h15a3 3 0 0 0-3-3H6"/>',shield:'<path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',key:'<circle cx="8" cy="14" r="4"/><path d="M11 11l8-8M16 6l2 2"/>',node:'<circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="12" cy="20" r="2"/><path d="M6.5 6.5l3.5 3.5M17.5 6.5L14 10M12 15v3"/>',gas:'<path d="M5 20V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v15M4 20h12M8 8h4"/><path d="M15 9l3 2v6a1.5 1.5 0 0 0 3 0V8l-3-3"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
const ico=(n,c)=>'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="'+(c||'currentColor')+'" stroke-width="'+(c?2.6:1.8)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICO[n]+'</svg>';
function tilesRender(){ const el=$('tiles'); if(!el) return;
  const has=!!me&&st.G!==undefined, g=gasRes(), gk=gasKind(g), busy={relay:$('btnRelay').disabled,rehearse:$('btnRehearse').disabled,one:$('btnRelay').disabled||$('btnRehearse').disabled};
  const later=L('连接钱包后自动检查','Checked after connecting');
  const eligBad=!has?later:[st.okStake?'':L('长期质押只有 '+f9(st.S)+'，要 ≥ '+f9(st.minStake),'Stake is only '+f9(st.S)+', need ≥ '+f9(st.minStake)), st.okEp?'':L('本周期已烧过，下次 '+(st.nextEp?bjS(st.nextEp):'下个周期'),'Already burned this epoch, next '+(st.nextEp?bjS(st.nextEp):'next epoch')), st.okBal?'':L('LGNS 只有 '+f9(st.B)+'，要 500','Only '+f9(st.B)+' LGNS, need 500')].filter(Boolean).join(L('；','; '));
  const T=[
    {k:L('钱包','Wallet'),i:'wallet',ok:!!me&&st.chainOk!==false,v:me?me.slice(0,6)+'…'+me.slice(-5):'',bad:me?L('连的不是 Anubis 链：请在钱包里切到 Anubis（6714）再刷新页面','Not on Anubis: switch the wallet to Anubis (6714) and reload'):L('还没连接钱包','Wallet not connected'),act:me?'':'connect',al:L('连接钱包','Connect wallet'),wide:1},
    {k:L('资格','Eligibility'),i:'shield',ok:has&&st.okStake&&st.okEp&&st.okBal,v:has?L('质押 ','Stake ')+f9(st.S)+L(' · 本周期可抢',' · open'):'',bad:eligBad},
    {k:L('授权','Approval'),i:'key',ok:has&&st.okAlw,v:has?(st.W>(1n<<200n)?L('无限','Unlimited'):f9(st.W)+' LGNS'):'',bad:has?L('还没授权','Not approved'):later,act:has&&!st.okAlw?'approve':'',al:L('授权 500 LGNS','Approve 500 LGNS')},
    {k:L('托管节点','Relay'),i:'node',ok:!!me&&relayOn(),v:L('已接通','Connected'),bad:!me?later:(relayDown?L('连不上，换条网络再检测','Unreachable, switch network and check again'):L('没接通，基本抢不到。① 复制下面的地址 ② 去钱包把 Anubis 网络的 RPC 换成它 ③ 回来点「一键检测」','Not connected, you will almost surely miss. 1) Copy the address below 2) set it as the Anubis RPC in your wallet 3) come back and tap One-tap check')),rpc:!!me&&!relayOn()&&!relayDown,act:me?'one':'',al:L('一键检测','One-tap check')},
    {k:L('钱包 Gas','Wallet gas'),i:'gas',ok:!!me&&(gk==='ok'||gk==='est'),v:gk==='ok'?L('上限 ','Limit ')+g.toLocaleString():L('钱包自己估，弹窗时看一眼上限','Wallet estimates; check the limit in the popup'),bad:!me?later:(gk==='low'?L('上限只有 '+g.toLocaleString()+'，一定失败。预演时把上限改成 450000','Limit only '+g.toLocaleString()+', will fail. Set it to 450000'):(relayOn()?L('没测过：点「一键检测」，节点不发、不扣钱','Not tested: tap One-tap check (not sent, free)'):L('节点接通后点「一键检测」顺带测好','Tested together with the relay by One-tap check'))),act:me&&relayOn()?'one':'',al:L('一键检测','One-tap check')},
    {k:'DAI',i:'drop',ok:has&&st.okGas,v:has?f18(st.G)+' DAI':'',bad:has?L('只有 '+f18(st.G)+' DAI，至少留 '+DAI_MIN+'，现在就补','Only '+f18(st.G)+' DAI, keep at least '+DAI_MIN+', top up now'):later,wide:1}];
  const n=T.filter(t=>t.ok).length;
  const html=T.map(t=>'<div class="tile glass'+(t.ok?'':' no')+(t.wide||!t.ok?' wide':'')+'"><div class="h"><span class="k">'+ico(t.i)+t.k+'</span><span class="st" style="background:'+(t.ok?'#34d399':'#fb7185')+'">'+ico(t.ok?'check':'x','#0a0a1f')+'</span></div>'+(t.ok?'<div class="v num">'+t.v+'</div>':'<div class="why">'+t.bad+'</div>'+(t.rpc?'<div class="rpcin"><code>'+RELAY+'</code><button data-act="copy">'+L('复制','Copy')+'</button></div>':'')+(t.act?'<button class="act" data-act="'+t.act+'"'+(busy[t.act]?' disabled':'')+'>'+(busy[t.act]?L('进行中…','Working…'):t.al)+'</button>':''))+'</div>').join('');
  if(el.dataset.h!==html){ el.innerHTML=html; el.dataset.h=html; }
  $('tilesN').textContent=n+' / 6';
}
setInterval(()=>{ try{ tilesRender(); }catch(e){} },1000);
$('tiles').addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; const a=b.dataset.act;
  if(a==='connect') connect(); else if(a==='approve') doApprove(); else if(a==='relay') relayDetect(); else if(a==='rehearse') rehearse(); else if(a==='one') oneClick(); else if(a==='copy') copyRpc(b); });
function copyRpc(btn){ const t=RELAY; const done=()=>{ if(btn){ btn.textContent=L('已复制','Copied'); setTimeout(()=>{ btn.textContent=L('复制','Copy'); },1500); } log(L('✓ 已复制托管节点地址，去钱包把 Anubis 网络的 RPC 换成它，再回来点「检测」','✓ Relay address copied. Set it as the Anubis RPC in your wallet, then come back and tap Check'),'ok'); };
  try{ navigator.clipboard.writeText(t).then(done,()=>{ prompt(L('长按复制','Copy this'),t); }); }catch(e){ try{ prompt(L('长按复制','Copy this'),t); }catch(x){} } }

$('chkList').addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; const a=b.dataset.act;
  if(a==='connect') connect(); else if(a==='approve') doApprove(); else if(a==='relay') relayDetect(); else if(a==='rehearse') rehearse(); });
$('btnRelay').onclick=relayDetect; $('btnConnect').onclick=connect; $('btnApprove').onclick=doApprove; $('btnArm').onclick=arm; $('btnStop').onclick=stop;
$('btnNow').onclick=()=>{ if(racing)return; log(L('手动：立刻发一笔','Manual: sending one now')); racing=true; attempt().finally(()=>{racing=false;loadState();}); };
setInterval(tick,250); setInterval(relayRender,3000); setInterval(()=>{ syncClock().catch(()=>{}); },30000); setInterval(()=>{ if(!racing) loadState(); },60000);
loadState().then(()=>{ const pv=pickProvider(); if(pv&&pv.selectedAddress) connect(); });
$('langBtn').onclick=()=>setLang(!EN()); applyLang();
log(L('页面就绪。先连接钱包，资格检查全绿后再开启自动抢。','Page ready. Connect your wallet, and arm auto-grab once the checklist is all green.'));
})();
</script>
