<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07080a">
<title>Helix 抢烧助手</title>
<style>
*{box-sizing:border-box}html,body{margin:0}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
#log{font:12px/1.55 ui-monospace,Consolas,monospace;border-radius:12px;padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all}
#log div{padding:3px 0;border-bottom:1px dashed var(--line)}
select{border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:14px;max-width:58vw;min-width:0;background:var(--field);color:var(--text)}
.btn{border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;min-height:50px}
.btn:disabled{opacity:.4}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:5}
.dock .btn{flex:1}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border:0}.row>span:first-child{color:var(--muted);flex:0 0 auto}.row>span:last-child{text-align:right;word-break:break-all}
.note{font-size:12px;color:var(--muted);line-height:1.65}
details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
:root{--bg:#07080a;--text:#f2f4f7;--muted:#7d8590;--line:#ffffff14;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--acc:#a78bfa;--field:#111318}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 18px calc(100px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.top b{color:var(--text);font-size:15px;letter-spacing:.5px}
.hero{text-align:center;padding:34px 0 18px}
.hero .lbl{font-size:13px;color:var(--muted);letter-spacing:2px}
#countdown{font-size:68px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1.1;margin:8px 0}
#nextOpen{font-size:13px;color:var(--muted)}
.state{margin:14px auto 0;display:inline-block;padding:8px 16px;border-radius:999px;background:#ffffff0d;font-size:14px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:22px 0 8px}
.chip{background:#ffffff08;border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;color:var(--muted)}
.chip span{display:block;font-size:12px;margin-top:3px;word-break:break-all;line-height:1.3}
.verdict{text-align:center;font-size:15px;margin:10px 0 4px}
.quota{text-align:center;font-size:13px;color:var(--muted)}
.sec{margin-top:22px}
#log{background:#0d0f13;color:#c9d1d9}
.btn{background:var(--acc);color:#120d24}.btn.ghost{background:#1a1d24;color:var(--text)}.btn.red{background:#3a1717;color:#fca5a5;flex:.6}
.dock{background:linear-gradient(transparent,#07080a 30%)}
#btnApprove{width:100%;margin-top:8px}
.hidden{display:none!important}
#chk{margin:14px 0 4px;background:#101319;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
#chk h3{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:600}
#chk .ck{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14px;line-height:1.5}#chk .ck i{font-style:normal;flex:0 0 20px}
#chk .fill{margin-top:8px;padding:9px 10px;border-radius:10px;background:rgba(224,178,90,.12);color:#f3d9a4;font-size:13.5px;line-height:1.6}#chk .fill b{color:#fff}
#fillTip{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:9999;background:#3a2a06;border:2px solid #e0b25a;color:#ffe7b0;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.65;box-shadow:0 8px 30px rgba(0,0,0,.6)}#fillTip b{color:#fff;font-size:20px}

</style>
</head>
<body>
<div class="top"><b>HELIX 抢烧</b><span id="addr">未连接</span></div>
<div class="hero">
  <div class="lbl" id="heroLbl">距 离 开 放</div>
  <div id="countdown">--:--:--</div>
  <div id="nextOpen">—</div>
  <div class="state" id="armState">未开启</div>
</div>
<div class="quota"><span id="quota">—</span></div>
<div class="chips">
  <div class="chip">质押<span id="stake">—</span></div>
  <div class="chip">本周期<span id="epoch">—</span></div>
  <div class="chip">余额<span id="bal">—</span></div>
  <div class="chip">授权<span id="alw">—</span></div>
  <div class="chip">Gas<span id="gas">—</span></div>
</div>
<div class="verdict" id="verdict">—</div>
<div id="chk"><h3>开抢前检查</h3><div id="chkList"></div><div class="fill" id="fillLine"></div></div>
<div id="fillTip" class="hidden"></div>
<button class="btn ghost" id="btnApprove" disabled>授权 600 LGNS</button>
<div class="sec">
  <div class="row"><span>托管节点</span><span id="relayState">先连接钱包</span></div>
  <div class="row" style="border:0;flex-wrap:wrap;gap:8px"><span style="font-size:12.5px;flex:1 1 160px;min-width:0;word-break:break-all">钱包 RPC 要改成 https://zjgame.web3origin.com/bondrpc</span><button class="btn ghost" id="btnRelay" style="flex:0 0 auto;width:auto;padding:8px 14px;margin:0">检测节点和 Gas</button></div>
  <div class="row"><span>钱包 Gas 上限</span><span id="gasTest">没测过</span></div>
  <div class="row"><span>没托管时弹窗时机</span><span><select id="lead"><option value="-500">开放后 0.5 秒</option><option value="-1500" selected>开放后 1.5 秒（推荐）</option><option value="-3000">开放后 3 秒</option><option value="1000">提前 1 秒（高级，可能被拒一次）</option></select></span></div>
  <details><summary>更多信息</summary>
    <div class="row"><span>链</span><span id="chain">—</span></div>
    <div class="row"><span>屏幕常亮</span><span id="wake">—</span></div>
    <div class="row"><span>本机-链时钟偏差</span><span id="skew">—</span></div>
    <div class="note">烧 500 LGNS 换 1000 算力，每个钱包每周期（7 天）一次，需长期质押合计 ≥ 2 万。每天北京 11:59:00 开放，约 2 秒抢光。版本 11-04 20:00</div>
  </details>
</div>
<div class="sec"><div id="log"></div></div>
<div class="dock">
  <button class="btn ghost" id="btnConnect">连接钱包</button>
  <button class="btn" id="btnArm" disabled>开启自动抢</button>
  <button class="btn red" id="btnStop">停</button>
</div>
<div style="display:none"><button id="btnNow"></button></div>
<script>
(function(){
'use strict';
const RPC='https://rpc.anubispace.org', CHAIN_ID=6714, CHAIN_HEX='0x1a3a';
const A={LGNS:'0x4D1D808a081FdAc440703b3765FC61f8028C06B8',LEDGER:'0x9E68F61E2615cc1D2C4a2D0026bFc1EBFdf68C1b',GATE:'0xb975Fd9B03fF440d6a43a52A7F072154CB520a4B',LENS:'0xa69a60b8d97D43031C00F16742Eb6989553796fc',CLOCK:'0x6C5352E15A8327C3F44898FE220100Edc2989C58'};
const SEL={burnForPower:'0xffa6b88a',maximumLgns:'0x7300b78e',minimumStake:'0xec5ffac2',dailyMaximumLgns:'0x020bb577',burnedLgnsToday:'0xcb9ebaf2',stakeOf:'0x42623360',burnEpochOf:'0x99e02c2d',currentDay:'0x5c9302c9',dayStart:'0x65b09d2d',currentEpoch:'0x76671808',remaining:'0xf77c6cce',balanceOf:'0x70a08231',allowance:'0xdd62ed3e',approve:'0x095ea7b3'};
const AMOUNT=500n*10n**9n; const APPROVE_AMT=600n*10n**9n; /* 老板定:每次授权600,烧仍是合约规定的500 */
const $=id=>document.getElementById(id);
const log=(m,cls)=>{const d=new Date();const t=d.toTimeString().slice(0,8)+'.'+String(d.getMilliseconds()).padStart(3,'0');const el=$('log');const line=document.createElement('div');if(cls)line.className=cls;line.textContent=t+'  '+m;el.prepend(line);try{ if(/^✓ 已交给|^已广播|^你取消了|^🎉|今天的名额已经抢光|连续两次取消/.test(String(m))) showFill(false); }catch(e){}};
const FILL_GWEI=3000, FILL_LIMIT=450000; /* 抢 AI:准点落第 1 块就够,3000 留余量;实际用 ~30 万 gas,上限 45 万 */
const FILL_TX={type:'0x0',gas:'0x'+FILL_LIMIT.toString(16),gasPrice:'0x'+(BigInt(FILL_GWEI)*10n**9n).toString(16)};
const GAS_MIN=350000, DAI_MIN=8; /* 11-04 11:59 教训:58aE 钱包默认上限 20 万 → out of gas;EdE4 开抢才补 DAI → 晚了 */
/* 钱包实际用的 Gas 上限:检测交易按抢 AI 同样参数发出,再从链上读回(OKX 会无视页面、用自己存的默认值) */
const gasKey=()=>'hx_gas_'+String(me).toLowerCase();
const gasRes=()=>{ if(!me) return null; const v=Number(LSg(gasKey())||0); return v>0?v:null; };
const gasKind=g=>g===null?'none':g>=GAS_MIN?'ok':g<100000?'est':'low';
function gasRender(){ const el=$('gasTest'); if(!el) return; const g=gasRes(), k=gasKind(g);
  el.innerHTML=k==='none'?'<span class="bad">没测过 ✗ 点上面「检测节点和 Gas」</span>':k==='ok'?'<span class="ok">'+g.toLocaleString()+' ✓ 够用</span>':k==='est'?'<span class="warn">钱包自己估（'+g.toLocaleString()+'）⚠ 弹窗时看一眼上限 ≥ 45 万</span>':'<b class="bad">只有 '+g.toLocaleString()+' ✗ 一定失败！到钱包把默认网络费删掉，或上限改成 450000</b>'; }
async function gasCheck(h){
  let t=null; for(let i=0;i<20&&!t;i++){ await new Promise(r=>setTimeout(r,500)); try{ t=await rpc('eth_getTransactionByHash',[h]); }catch(e){} }
  if(!t){ log('读不到检测交易，Gas 上限没测出来，稍后再点一次检测','warn'); return; }
  const g=parseInt(t.gas,16), gw=Math.round(parseInt(t.gasPrice||t.maxFeePerGas||'0x0',16)/1e9); LSs(gasKey(),String(g)); gasRender();
  const k=gasKind(g);
  if(k==='ok') log('✓ 钱包 Gas 上限 '+g+'（价格 '+gw+' gwei），抢 AI 够用','ok');
  else if(k==='est') log('⚠ 钱包没用页面给的上限，自己估成 '+g+'。抢的时候弹窗请看「网络费用」里的 Gas 上限，不到 450000 就点自定义改','warn');
  else { buzz([300,80,300]); log('✗ 钱包把 Gas 上限定死成 '+g+'（价格 '+gw+' gwei），抢 AI 要约 30 万，这样一定失败（11-04 就有人这样白扣 3 DAI）。请到钱包「网络费用」把保存的默认值删掉，或上限改成 450000，再点一次检测','bad'); }
}
let fillTimer=null;
function showFill(on){ const el=$('fillTip'); if(!el) return; clearTimeout(fillTimer); if(!on){ el.classList.add('hidden'); return; }
  el.innerHTML='👉 <b style="font-size:17px">钱包弹出来了</b><br>点「网络费用 → 自定义」<br>Gas 价格填 <b>'+FILL_GWEI+'</b>　Gas 上限填 <b>'+FILL_LIMIT+'</b><br>填好马上点确认（开放前点完都算数）';
  el.classList.remove('hidden'); fillTimer=setTimeout(()=>el.classList.add('hidden'),60000); }
const u256=n=>BigInt(n).toString(16).padStart(64,'0'); const addr32=a=>a.toLowerCase().replace(/^0x/,'').padStart(64,'0');
const f9=v=>(Number(v)/1e9).toLocaleString('en-US',{maximumFractionDigits:2}); const f18=v=>(Number(v)/1e18).toFixed(3);
const bjS=ts=>new Date(ts*1000+8*3600e3).toISOString().slice(5,16).replace('T',' ');
const bj=ts=>{const d=new Date(ts*1000+8*3600e3);return d.toISOString().replace('T',' ').slice(0,19)+' 北京';};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p||[200,100,200]);}catch(e){}};

const RELAY='https://zjgame.web3origin.com/bondrpc', RELAY_POP=45; let relayDown=false;
const LSg=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } }, LSs=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
const relayList=()=>String(LSg('bc_relay2')||'').toLowerCase().split(',').filter(Boolean), relayHas=a=>!!a&&relayList().includes(String(a).toLowerCase()), relayDel=a=>LSs('bc_relay2',relayList().filter(x=>x!==String(a).toLowerCase()).join(','));
const relayAdd=a=>{ const l=relayList(); const x=String(a).toLowerCase(); if(!l.includes(x)) l.push(x); LSs('bc_relay2',l.join(',')); };
const relayOn=()=>!!me&&relayHas(me)&&!relayDown;
const markBypass=()=>{ if(me) LSs('bc_bypass_'+me.toLowerCase(),String(Date.now())); };
let routedAt=0; /* 11-04:检测结果服务器也记一份(换浏览器/清缓存不丢),本地没有就去服务器问 */
async function routedSync(){ if(!me||relayHas(me)||Date.now()-routedAt<30000) return; routedAt=Date.now(); const r=await relayGet('/routed?a='+me,3000); if(r&&r.routed&&r.ago!==null){ const t=Date.now()-r.ago*1000, by=Number(LSg('bc_bypass_'+me.toLowerCase())||0); if(t>by){ relayAdd(me); relayRender(); log('✓ 服务器记录这个钱包接通过托管节点，已自动恢复「已接通」','ok'); } } }
setInterval(()=>{ routedSync().catch(()=>{}); },4000); /* 检测记录与销毁债券抢领页共用(同站点 localStorage) */
async function relayGet(path,ms){ const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),ms||4000); try{ const r=await fetch(RELAY+path,{signal:ac.signal,cache:'no-store'}); return await r.json(); }catch(e){ return null; } finally{ clearTimeout(t); } }
function relayRender(){ gasRender(); const el=$('relayState'); if(!el) return; if(!me){ el.innerHTML='先连接钱包'; return; } el.innerHTML=relayOn()?'<span class="ok">已接通 ✓ 开放前 45 秒弹钱包，直接点确认</span>':(relayDown?'<span class="bad">连不上，本次改用开放后弹窗（基本抢不到）</span>':'<b class="bad">未接通 ✗ 这样基本抢不到，先点下面「检测节点和 Gas」</b>'); }
async function relayDetect(){
  if(!eth||!me){ log('先连接钱包','warn'); return; } if(racing){ log('正在抢，稍后再检测','warn'); return; } $('btnRelay').disabled=true;
  try{
    log('检测托管节点和钱包 Gas：钱包会弹一笔「给自己授权 0 枚 LGNS」，不动任何资产。这次别改网络费，直接点确认（手续费约 0.1~0.7 DAI），看看钱包默认会用多少 Gas 上限','warn');
    const tx={from:me,to:A.LGNS,value:'0x0',data:'0x095ea7b3'+addr32(me)+u256(0)};
    let h=null, sendErr=''; try{ h=await eth.request({method:'eth_sendTransaction',params:[Object.assign({},tx,FILL_TX)]}); }catch(e){ if(isReject(e)){ log('你取消了检测','warn'); return; } try{ h=await eth.request({method:'eth_sendTransaction',params:[tx]}); }catch(e2){ if(isReject(e2)){ log('你取消了检测','warn'); return; } sendErr=String(e2.message||e2).slice(0,120); } }
    if(h) gasCheck(h).catch(()=>{});
    let sv=null, ok=false; for(let i=0;i<8&&!ok;i++){ await new Promise(r=>setTimeout(r,i?800:300)); sv=await relayGet('/seen?a='+me); ok=!!(sv&&sv.sendAgo!==null&&sv.sendAgo<90&&(!sv.sendHash||!h||String(sv.sendHash).toLowerCase()===String(h).toLowerCase())); }
    if(ok){ relayAdd(me); relayDown=false; log('✓ 托管节点接通了：开启自动抢后，开放前 45 秒弹钱包，点确认就行','ok'); }
    else if(!sv){ log('✗ 连不上托管节点（网络问题？开着 VPN 就换条线路，没开就打开试试）','bad'); }
    else { relayDel(me); markBypass(); if(sendErr) log('检测交易出错：'+sendErr,'bad'); log('✗ 这笔交易没经过托管节点：请把钱包里 Anubis 网络的 RPC 改成 '+RELAY+'，并切到这个网络，再点检测（OKX：网络 → Anubis → 编辑）','bad'); }
  }catch(e){ log('检测出错：'+(e.message||e),'bad'); } finally{ $('btnRelay').disabled=false; relayRender(); }
}
let me=null, eth=null, skew=0, nextStart=0, st={}, armed=false, racing=false, armTimer=null, attempts=0, won=false, wakeLock=null;

async function rpc(method,params){const r=await fetch(RPC,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});const j=await r.json();if(j.error){const e=new Error(j.error.message||'rpc');e.data=j.error.data;throw e;}return j.result;}
const call=(to,data)=>rpc('eth_call',[{to,data},'latest']);
const big=h=>BigInt(h&&h!=='0x'?h:'0x0');
function reason(e){try{let h=(e&&(e.data&&(e.data.data||e.data)))||'';h=String(h).replace(/^0x/,'');if(h.startsWith('08c379a0')){const len=parseInt(h.slice(72,136),16);const hex=h.slice(136,136+len*2);let s='';for(let i=0;i<hex.length;i+=2)s+=String.fromCharCode(parseInt(hex.slice(i,i+2),16));return s;}}catch(x){}return (e&&e.message)||String(e);}

async function keepAwake(){ try{ if('wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); $('wake').innerHTML='<span class="ok">已开启 ✓</span>'; wakeLock.addEventListener('release',()=>{$('wake').innerHTML='<span class="warn">已释放（切回本页会重新申请）</span>';}); } else { $('wake').innerHTML='<span class="warn">浏览器不支持，请手动把自动锁屏调长</span>'; } }catch(e){ $('wake').innerHTML='<span class="warn">未能开启：'+(e.message||e)+'</span>'; } }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ if(armed||me) keepAwake(); syncClock().catch(()=>{}); } });

async function syncClock(){const b=await rpc('eth_getBlockByNumber',['latest',false]);const ts=parseInt(b.timestamp,16);skew=Math.floor(Date.now()/1000)-ts;$('skew').textContent=skew+' 秒';return ts;}
const chainNow=()=>Date.now()/1000-skew;

let openSecCache={at:0,v:null};
async function getOpenSec(){ // 最近一个抢满(或有成交)的协议日,从当天 0 点算起第几秒开放;读不到按 11:59:00
  if(Date.now()-openSecCache.at<120e3&&openSecCache.v!==null) return openSecCache.v;
  let v=43140, src='';
  /* 11-04:闸门合约 10-29 升级后有 0xa4b5c200 = 每天开放秒数(现 43140=11:59:00),官方改时间页面立刻跟上;读不到再用 burners.json */
  try{ const x=Number(big(await call(A.GATE,'0xa4b5c200'))); if(x>0&&x<86400){ v=x; src='chain'; } }catch(e){}
  if(!src){ try{ const j=await (await fetch('https://zjgame.web3origin.com/helix/burners.json',{cache:'no-store'})).json(); const ds=(j.days||[]).filter(d=>d.full||d.count>=50); if(ds.length) v=ds[ds.length-1].openSec; }catch(e){} }
  if(openSecCache.v!==null&&openSecCache.v!==v) log('⚠ 官方开放时间变了：现在每天 '+String(Math.floor(v/3600)).padStart(2,'0')+':'+String(Math.floor(v%3600/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')+' 开','bad');
  openSecCache={at:Date.now(),v}; return v; }
async function loadState(){
  try{
    const [day,epoch,maxL,minStake,dailyMax,burned]=await Promise.all([call(A.CLOCK,SEL.currentDay),call(A.CLOCK,SEL.currentEpoch),call(A.GATE,SEL.maximumLgns),call(A.GATE,SEL.minimumStake),call(A.GATE,SEL.dailyMaximumLgns),call(A.GATE,SEL.burnedLgnsToday)]);
    const ns=await call(A.CLOCK,SEL.dayStart+u256(big(day)+1n));
    let remain=null;try{remain=big(await call(A.LENS,SEL.remaining));}catch(e){}
    st={day:Number(big(day)),epoch:Number(big(epoch)),maxL:big(maxL),minStake:big(minStake),dailyMax:big(dailyMax),burned:big(burned),remain};
    const openSec=await getOpenSec(); const todayStart=Number(big(await call(A.CLOCK,SEL.dayStart+u256(big(day)))));
    const todayOpen=todayStart+openSec, tomorrowOpen=Number(big(ns))+openSec; const full=st.dailyMax>0n&&st.burned>=st.dailyMax;

function allProviders(){

  if(me&&st.G!==undefined&&!st.epDone&&left<=600&&left>60&&chkWarned!==nextStart&&rows.slice(1,LAST).some(r=>!r[0])){ chkWarned=nextStart; buzz([400,100,400,100,400]); log('⚠ 还有 '+Math.ceil(left/60)+' 分钟开抢，这几项还没好：'+rows.slice(1,LAST).filter(r=>!r[0]).map(r=>r[2]).join('；'),'bad'); }
}
setInterval(()=>{ try{ chkRender(); }catch(e){} },1000);
function stop(){armed=false;clearInterval(armTimer);$('armState').textContent='已停止';log('已停止自动抢');}
function tick(){ if(!nextStart)return; const ep=!!(me&&st.epDone&&st.nextEp); const tgt=ep?st.nextEp:nextStart; /* 本周期已烧过:倒数到这个钱包下次可抢,别让人以为明天还能抢 */
  $('heroLbl').textContent=ep?'本周期已烧过 · 距下次可抢':'距 离 开 放'; if(ep) $('nextOpen').textContent=bj(st.nextEp)+'（这个钱包下次可抢）';
  const left=Math.max(0,Math.floor(tgt-chainNow())); const dd=Math.floor(left/86400),h=String(Math.floor(left%86400/3600)).padStart(2,'0'),m=String(Math.floor(left%3600/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0'); $('countdown').textContent=(dd?dd+'天 ':'')+h+':'+m+':'+s; $('countdown').style.fontSize=dd?'50px':''; $('countdown').style.color=left<=60?'#f0c060':'#e9eef3'; }

$('btnRelay').onclick=relayDetect; $('btnConnect').onclick=connect; $('btnApprove').onclick=doApprove; $('btnArm').onclick=arm; $('btnStop').onclick=stop;
$('btnNow').onclick=()=>{ if(racing)return; log('手动：立刻发一笔'); racing=true; attempt().finally(()=>{racing=false;loadState();}); };
setInterval(tick,250); setInterval(relayRender,3000); setInterval(()=>{ syncClock().catch(()=>{}); },30000); setInterval(()=>{ if(!racing) loadState(); },60000);
loadState().then(()=>{ const pv=pickProvider(); if(pv&&pv.selectedAddress) connect(); });
log('页面就绪。先连接钱包，资格检查全绿后再开启自动抢。');
})();
</script>
