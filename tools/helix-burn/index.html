<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07080a">
<title>Helix 抢烧助手</title>
<style>
*{box-sizing:border-box}html,body{margin:0}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
#log{font:12px/1.55 ui-monospace,Consolas,monospace;border-radius:12px;padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all}
#log div{padding:3px 0;border-bottom:1px dashed var(--line)}
select{border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:14px;max-width:58vw;min-width:0;background:var(--field);color:var(--text)}
.btn{border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;min-height:50px}
.btn:disabled{opacity:.4}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:5}
.dock .btn{flex:1}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border:0}.row>span:first-child{color:var(--muted);flex:0 0 auto}.row>span:last-child{text-align:right;word-break:break-all}
.note{font-size:12px;color:var(--muted);line-height:1.65}
details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
:root{--bg:#07080a;--text:#f2f4f7;--muted:#7d8590;--line:#ffffff14;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--acc:#a78bfa;--field:#111318}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 18px calc(100px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.top b{color:var(--text);font-size:15px;letter-spacing:.5px}
.hero{text-align:center;padding:34px 0 18px}
.hero .lbl{font-size:13px;color:var(--muted);letter-spacing:2px}
#countdown{font-size:68px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1.1;margin:8px 0}
#nextOpen{font-size:13px;color:var(--muted)}
.state{margin:14px auto 0;display:inline-block;padding:8px 16px;border-radius:999px;background:#ffffff0d;font-size:14px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:22px 0 8px}
.chip{background:#ffffff08;border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;color:var(--muted)}
.chip span{display:block;font-size:12px;margin-top:3px;word-break:break-all;line-height:1.3}
.verdict{text-align:center;font-size:15px;margin:10px 0 4px}
.quota{text-align:center;font-size:13px;color:var(--muted)}
.sec{margin-top:22px}
#log{background:#0d0f13;color:#c9d1d9}
.btn{background:var(--acc);color:#120d24}.btn.ghost{background:#1a1d24;color:var(--text)}.btn.red{background:#3a1717;color:#fca5a5;flex:.6}
.dock{background:linear-gradient(transparent,#07080a 30%)}
#btnApprove{width:100%;margin-top:8px}

</style>
</head>
<body>
<div class="top"><b>HELIX 抢烧</b><span id="addr">未连接</span></div>
<div class="hero">
  <div class="lbl">距 离 开 放</div>
  <div id="countdown">--:--:--</div>
  <div id="nextOpen">—</div>
  <div class="state" id="armState">未开启</div>
</div>
<div class="quota">今日已烧 <span id="quota">—</span></div>
<div class="chips">
  <div class="chip">质押<span id="stake">—</span></div>
  <div class="chip">本周期<span id="epoch">—</span></div>
  <div class="chip">余额<span id="bal">—</span></div>
  <div class="chip">授权<span id="alw">—</span></div>
  <div class="chip">Gas<span id="gas">—</span></div>
</div>
<div class="verdict" id="verdict">—</div>
<button class="btn ghost" id="btnApprove" disabled>授权 600 LGNS</button>
<div class="sec">
  <div class="row"><span>托管节点</span><span id="relayState">先连接钱包</span></div>
  <div class="row"><span>没托管时弹窗时机</span><span><select id="lead"><option value="-500">开放后 0.5 秒</option><option value="-1500" selected>开放后 1.5 秒（推荐）</option><option value="-3000">开放后 3 秒</option><option value="1000">提前 1 秒（高级，可能被拒一次）</option></select></span></div>
  <details><summary>更多信息</summary>
    <div class="row"><span>链</span><span id="chain">—</span></div>
    <div class="row"><span>屏幕常亮</span><span id="wake">—</span></div>
    <div class="row"><span>本机-链时钟偏差</span><span id="skew">—</span></div>
    <div class="note">烧 500 LGNS 换 1000 算力，每个钱包每周期（7 天）一次，需长期质押合计 ≥ 2 万。每天北京 11:59:00 开放，约 5 秒抢光。版本 11-02 12:30</div>
  </details>
</div>
<div class="sec"><div id="log"></div></div>
<div class="dock">
  <button class="btn ghost" id="btnConnect">连接钱包</button>
  <button class="btn" id="btnArm" disabled>开启自动抢</button>
  <button class="btn red" id="btnStop">停</button>
</div>
<div style="display:none"><button id="btnNow"></button></div>
<script>
(function(){
'use strict';
const RPC='https://rpc.anubispace.org', CHAIN_ID=6714, CHAIN_HEX='0x1a3a';
const A={LGNS:'0x4D1D808a081FdAc440703b3765FC61f8028C06B8',LEDGER:'0x9E68F61E2615cc1D2C4a2D0026bFc1EBFdf68C1b',GATE:'0xb975Fd9B03fF440d6a43a52A7F072154CB520a4B',LENS:'0xa69a60b8d97D43031C00F16742Eb6989553796fc',CLOCK:'0x6C5352E15A8327C3F44898FE220100Edc2989C58'};
const SEL={burnForPower:'0xffa6b88a',maximumLgns:'0x7300b78e',minimumStake:'0xec5ffac2',dailyMaximumLgns:'0x020bb577',burnedLgnsToday:'0xcb9ebaf2',stakeOf:'0x42623360',burnEpochOf:'0x99e02c2d',currentDay:'0x5c9302c9',dayStart:'0x65b09d2d',currentEpoch:'0x76671808',remaining:'0xf77c6cce',balanceOf:'0x70a08231',allowance:'0xdd62ed3e',approve:'0x095ea7b3'};
const AMOUNT=500n*10n**9n; const APPROVE_AMT=600n*10n**9n; /* 老板定:每次授权600,烧仍是合约规定的500 */
const $=id=>document.getElementById(id);
const log=(m,cls)=>{const d=new Date();const t=d.toTimeString().slice(0,8)+'.'+String(d.getMilliseconds()).padStart(3,'0');const el=$('log');const line=document.createElement('div');if(cls)line.className=cls;line.textContent=t+'  '+m;el.prepend(line);};
const u256=n=>BigInt(n).toString(16).padStart(64,'0'); const addr32=a=>a.toLowerCase().replace(/^0x/,'').padStart(64,'0');
const f9=v=>(Number(v)/1e9).toLocaleString('en-US',{maximumFractionDigits:2}); const f18=v=>(Number(v)/1e18).toFixed(3);
const bj=ts=>{const d=new Date(ts*1000+8*3600e3);return d.toISOString().replace('T',' ').slice(0,19)+' 北京';};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p||[200,100,200]);}catch(e){}};

const RELAY='https://zjgame.web3origin.com/bondrpc', RELAY_POP=45; let relayDown=false;
const LSg=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } }, LSs=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
const relayList=()=>String(LSg('bc_relay2')||'').toLowerCase().split(',').filter(Boolean), relayHas=a=>!!a&&relayList().includes(String(a).toLowerCase()), relayDel=a=>LSs('bc_relay2',relayList().filter(x=>x!==String(a).toLowerCase()).join(','));
const relayOn=()=>!!me&&relayHas(me)&&!relayDown; /* 检测记录与销毁债券抢领页共用(同站点 localStorage) */
async function relayGet(path,ms){ const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),ms||4000); try{ const r=await fetch(RELAY+path,{signal:ac.signal,cache:'no-store'}); return await r.json(); }catch(e){ return null; } finally{ clearTimeout(t); } }
function relayRender(){ const el=$('relayState'); if(!el) return; if(!me){ el.innerHTML='先连接钱包'; return; } el.innerHTML=relayOn()?'<span class="ok">已接通 ✓ 开放前 45 秒弹钱包，直接点确认</span>':(relayDown?'<span class="bad">连不上，本次改用开放后弹窗</span>':'<span class="warn">未接通（到「销毁债券抢领」页按说明改节点并检测，这里自动生效）</span>'); }
let me=null, eth=null, skew=0, nextStart=0, st={}, armed=false, racing=false, armTimer=null, attempts=0, won=false, wakeLock=null;

async function rpc(method,params){const r=await fetch(RPC,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});const j=await r.json();if(j.error){const e=new Error(j.error.message||'rpc');e.data=j.error.data;throw e;}return j.result;}
const call=(to,data)=>rpc('eth_call',[{to,data},'latest']);
const big=h=>BigInt(h&&h!=='0x'?h:'0x0');
function reason(e){try{let h=(e&&(e.data&&(e.data.data||e.data)))||'';h=String(h).replace(/^0x/,'');if(h.startsWith('08c379a0')){const len=parseInt(h.slice(72,136),16);const hex=h.slice(136,136+len*2);let s='';for(let i=0;i<hex.length;i+=2)s+=String.fromCharCode(parseInt(hex.slice(i,i+2),16));return s;}}catch(x){}return (e&&e.message)||String(e);}

async function keepAwake(){ try{ if('wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); $('wake').innerHTML='<span class="ok">已开启 ✓</span>'; wakeLock.addEventListener('release',()=>{$('wake').innerHTML='<span class="warn">已释放（切回本页会重新申请）</span>';}); } else { $('wake').innerHTML='<span class="warn">浏览器不支持，请手动把自动锁屏调长</span>'; } }catch(e){ $('wake').innerHTML='<span class="warn">未能开启：'+(e.message||e)+'</span>'; } }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ if(armed||me) keepAwake(); syncClock().catch(()=>{}); } });

async function syncClock(){const b=await rpc('eth_getBlockByNumber',['latest',false]);const ts=parseInt(b.timestamp,16);skew=Math.floor(Date.now()/1000)-ts;$('skew').textContent=skew+' 秒';return ts;}
const chainNow=()=>Date.now()/1000-skew;

let openSecCache={at:0,v:null};
async function getOpenSec(){ // 最近一个抢满(或有成交)的协议日,从当天 0 点算起第几秒开放;读不到按 11:59:00
  if(Date.now()-openSecCache.at<600e3&&openSecCache.v!==null) return openSecCache.v;
  let v=43140; try{ const j=await (await fetch('https://zjgame.web3origin.com/helix/burners.json',{cache:'no-store'})).json(); const ds=(j.days||[]).filter(d=>d.full||d.count>=50); if(ds.length) v=ds[ds.length-1].openSec; }catch(e){}
  openSecCache={at:Date.now(),v}; return v; }
async function loadState(){
  try{
    const [day,epoch,maxL,minStake,dailyMax,burned]=await Promise.all([call(A.CLOCK,SEL.currentDay),call(A.CLOCK,SEL.currentEpoch),call(A.GATE,SEL.maximumLgns),call(A.GATE,SEL.minimumStake),call(A.GATE,SEL.dailyMaximumLgns),call(A.GATE,SEL.burnedLgnsToday)]);
    const ns=await call(A.CLOCK,SEL.dayStart+u256(big(day)+1n));
    let remain=null;try{remain=big(await call(A.LENS,SEL.remaining));}catch(e){}
    st={day:Number(big(day)),epoch:Number(big(epoch)),maxL:big(maxL),minStake:big(minStake),dailyMax:big(dailyMax),burned:big(burned),remain};
    const openSec=await getOpenSec(); const todayStart=Number(big(await call(A.CLOCK,SEL.dayStart+u256(big(day)))));
    const todayOpen=todayStart+openSec, tomorrowOpen=Number(big(ns))+openSec; const full=st.dailyMax>0n&&st.burned>=st.dailyMax;
    nextStart=(!full&&chainNow()<todayOpen+120)?todayOpen:tomorrowOpen; // 今天还没开(或刚开没满)→今天的开放时刻;今天已满→明天
    const hh=String(Math.floor(openSec/3600)).padStart(2,'0'),mm=String(Math.floor(openSec%3600/60)).padStart(2,'0'),ss=String(openSec%60).padStart(2,'0');
    $('nextOpen').textContent=bj(nextStart)+'（每天 '+hh+':'+mm+':'+ss+' 开）';
    $('quota').innerHTML=f9(st.burned)+' / '+f9(st.dailyMax)+(st.remain!==null?('，剩余 <b class="'+(st.remain>0n?'ok':'bad')+'">'+f9(st.remain)+'</b>'):'');
    await syncClock();
    if(me) await loadWallet();
  }catch(e){log('读链失败：'+reason(e),'bad');}
}
async function loadWallet(){
  const [stake,bEp,bal,alw,gas]=await Promise.all([call(A.GATE,SEL.stakeOf+addr32(me)),call(A.GATE,SEL.burnEpochOf+addr32(me)),call(A.LGNS,SEL.balanceOf+addr32(me)),call(A.LGNS,SEL.allowance+addr32(me)+addr32(A.LEDGER)),rpc('eth_getBalance',[me,'latest'])]);
  const S=big(stake),E=Number(big(bEp)),B=big(bal),W=big(alw),G=big(gas);
  const okStake=S>=st.minStake, okEp=!(E!==0&&E>=st.epoch), okBal=B>=AMOUNT, okAlw=W>=AMOUNT, okGas=G>=10n**17n;
  $('stake').innerHTML='<span class="'+(okStake?'ok':'bad')+'">'+f9(S)+' LGNS'+(okStake?' ✓':' ✗ 不够')+'</span>';
  $('epoch').innerHTML='<span class="'+(okEp?'ok':'bad')+'">'+(okEp?'没烧过 ✓（Epoch '+st.epoch+'）':'已烧过 ✗（记录 Epoch '+E+'）')+'</span>';
  $('bal').innerHTML='<span class="'+(okBal?'ok':'bad')+'">'+f9(B)+(okBal?' ✓':' ✗')+'</span>';
  $('alw').innerHTML='<span class="'+(okAlw?'ok':'warn')+'">'+(W>(1n<<200n)?'无限（建议改为按次授权）✓':f9(W)+' LGNS'+(okAlw?' ✓':' ✗ 需授权'))+'</span>';
  const lowGas=okGas&&G<8n*10n**18n; /* OKX 用自己存的默认价(老板设 15000):要先预留 价×上限(约 35~45 万) ≈ 5.3~6.8 DAI */
  $('gas').innerHTML='<span class="'+(okGas?(lowGas?'warn':'ok'):'bad')+'">'+f18(G)+(okGas?(lowGas?' ⚠ OKX 网络费若是 15000，要先预留约 7 DAI，不够会发不出去：补到 8 DAI 以上，或把 OKX 网络费改成 1000':' ✓'):' ✗ 太少')+'</span>';
  const eligible=okStake&&okEp&&okBal&&okAlw&&okGas;
  $('verdict').innerHTML=eligible?'<b class="ok">有资格，可以抢</b>':'<b class="bad">暂不满足，合约会拒绝</b>';
  $('btnApprove').disabled=okAlw; $('btnArm').disabled=!eligible; $('btnNow').disabled=!eligible;
  return eligible;
}

function pickProvider(){
  const w=window; const cands=[];
  if(w.ethereum){ if(Array.isArray(w.ethereum.providers)) cands.push(...w.ethereum.providers); cands.push(w.ethereum); }
  if(w.bitkeep&&w.bitkeep.ethereum) cands.push(w.bitkeep.ethereum);
  if(w.okxwallet) cands.push(w.okxwallet);
  if(w.tokenpocket&&w.tokenpocket.ethereum) cands.push(w.tokenpocket.ethereum);
  const uniq=[...new Set(cands.filter(p=>p&&typeof p.request==='function'))];
  return uniq.find(p=>p.isBitKeep||p.isOkxWallet||p.isOKExWallet||p.isTokenPocket||p.isImToken)||uniq[0]||null;
}
async function connect(){
  eth=pickProvider(); if(!eth){log('没检测到钱包：请用 OKX / Bitget / TokenPocket / imToken 等钱包 App 的内置浏览器打开本页','bad');return;}
  try{
    const accs=await eth.request({method:'eth_requestAccounts'}); me=accs[0]; $('addr').textContent=me.slice(0,8)+'…'+me.slice(-6);
    let cid=parseInt(await eth.request({method:'eth_chainId'}),16);
    if(cid!==CHAIN_ID){ const chainParam={chainId:CHAIN_HEX,chainName:'Anubis',rpcUrls:[RPC],nativeCurrency:{name:'DAI',symbol:'DAI',decimals:18},blockExplorerUrls:['https://browser.anubispace.org']}; try{ await eth.request({method:'wallet_switchEthereumChain',params:[{chainId:CHAIN_HEX}]}); }catch(e1){ if(isReject(e1)) throw e1; log('切链被钱包拒绝（'+(e1&&e1.code)+' '+String(e1&&e1.message||e1).slice(0,80)+'），改为请求添加 Anubis 链','warn'); try{ await eth.request({method:'wallet_addEthereumChain',params:[chainParam]}); }catch(e2){ if(isReject(e2)) throw e2; log('添加链也失败（'+(e2&&e2.code)+' '+String(e2&&e2.message||e2).slice(0,80)+'）。请在钱包里手动添加网络：名称 Anubis，Chain ID 6714，RPC '+RPC+'，代币符号 DAI，浏览器 https://browser.anubispace.org，然后切到该网络再回来','bad'); } } try{ cid=parseInt(await eth.request({method:'eth_chainId'}),16); }catch(e){} }
    $('chain').innerHTML=cid===CHAIN_ID?'<span class="ok">Anubis (6714) ✓</span>':'<span class="bad">链不对：'+cid+'，请在钱包切到 Anubis</span>';
    eth.on&&eth.on('accountsChanged',()=>location.reload()); eth.on&&eth.on('chainChanged',()=>location.reload());
    log('已连接 '+me); keepAwake(); relayRender(); await loadState();
  }catch(e){log('连接失败：'+(e.message||e),'bad');}
}
const isReject=e=>!!(e&&(e.code===4001||e.code==='ACTION_REJECTED'||/reject|denied|cancel|取消|拒绝/i.test(e.message||'')));
async function sendTx(to,data,gasMult){
  let gp=null; try{ gp=BigInt(await rpc('eth_gasPrice',[]))*BigInt(Math.round((gasMult||1)*10))/10n; }catch(e){}
  const full={from:me,to,data}; if(gp){ full.gasPrice='0x'+gp.toString(16); full.type='0x0'; full.gas='0x'+(450000).toString(16); }
  try{ return await eth.request({method:'eth_sendTransaction',params:[full]}); }
  catch(e){ if(isReject(e)) throw e; log('钱包不接受带 gas 参数的交易（'+(e.message||e).slice(0,60)+'），改用钱包默认参数重发','warn'); return await eth.request({method:'eth_sendTransaction',params:[{from:me,to,data}]}); } // 个别钱包对 type/gas 字段挑剔:退回最简参数再试一次
}
async function waitTx(hash,timeout){const t0=Date.now();while(Date.now()-t0<(timeout||120000)){try{const r=await rpc('eth_getTransactionReceipt',[hash]);if(r&&r.blockNumber)return r;}catch(e){}await new Promise(r=>setTimeout(r,350));}return null;} // 单次 RPC 失败不中断等待
async function burnedThisEpoch(){ try{ const e=Number(big(await call(A.GATE,SEL.burnEpochOf+addr32(me)))); return e!==0&&e>=st.epoch; }catch(e){ return false; } } // 链上直接问"本 Epoch 烧过没"=最可靠的成功判定
async function simulate(){ try{ await rpc('eth_call',[{from:me,to:A.LEDGER,data:SEL.burnForPower+u256(AMOUNT)},'latest']); return ''; }catch(e){ return reason(e)||'unknown'; } }

async function doApprove(){
  try{log('请在钱包确认授权 LGNS → PowerLedger');const h=await sendTx(A.LGNS,SEL.approve+addr32(A.LEDGER)+u256(APPROVE_AMT),1);log('授权已广播 '+h);const r=await waitTx(h);log(r&&r.status==='0x1'?'授权成功 ✓':'授权失败 ✗',r&&r.status==='0x1'?'ok':'bad');await loadWallet();}catch(e){log('授权：'+(e.message||e),'bad');}
}

async function attempt(){
  attempts++;
  try{
    buzz(); log('第 '+attempts+' 笔：请在钱包点确认（烧 500 LGNS）','warn');
    const RL=relayOn()&&chainNow()<nextStart-0.3;
    const h=await sendTx(A.LEDGER,SEL.burnForPower+u256(AMOUNT),2);
    if(RL){ let got=false; for(let i=0;i<4&&!got;i++){ const sv=await relayGet('/seen?a='+me,2500); got=!!(sv&&sv.sendHash&&String(sv.sendHash).toLowerCase()===String(h).toLowerCase()); if(!got) await new Promise(r=>setTimeout(r,400)); }
      if(got) log('✓ 已交给东京定时节点，'+bj(nextStart)+' 开放那一刻准点发出，你不用再动 '+h,'ok');
      else { relayDel(me); relayRender(); log('✗ 这笔没经过托管节点，已直接上链（开放前会被拒）。托管已关闭，被拒后页面会马上再弹一次，请再点确认','bad'); } }
    else log('已广播 '+h);
    const r=await waitTx(h,RL?120000:60000);
    if(r&&r.status==='0x1'){won=true;buzz([100,50,100,50,400]);log('🎉 抢到了！区块 '+parseInt(r.blockNumber,16)+'  https://browser.anubispace.org/tx/'+h,'ok');return 'win';}
    if(await burnedThisEpoch()){won=true;buzz([100,50,100,50,400]);log('🎉 链上确认本 Epoch 已烧过 → 成功','ok');return 'win';} // 回执丢了/超时也不怕,直接问链
    if(!r){log('60 秒没拿到回执，链上也没显示成功，可能网络卡了','bad');return 'fail';}
    const why=await simulate(); log('这笔被拒（'+(why||'未知原因')+'）','bad');
    return 'fail';
  }catch(e){ if(isReject(e)){log('你取消了签名','warn');return 'rejected';} log('发送出错：'+(e.message||e),'bad'); if(await burnedThisEpoch()){won=true;return 'win';} return 'fail'; }
}
// 开放后先模拟:刚过零点那几秒链上最新块可能还是"昨天",会误报额度已满,所以给 8 秒宽限反复模拟;过了宽限还说满才算真满
async function waitUntilOpenOrFull(){
  const until=Math.max(chainNow(),nextStart)+180; let lastWhy='';
  while(chainNow()<until){ const why=await simulate(); if(!why) return 'open'; lastWhy=why; if(!/daily maximum|not open/i.test(why)) return why; if(/not open/i.test(why)&&chainNow()<nextStart) { await new Promise(r=>setTimeout(r,1000)); continue; } await new Promise(r=>setTimeout(r,250)); }
  return /not open/i.test(lastWhy)?'notopen':'full';
}
async function race(){
  if(racing)return; racing=true; won=false; attempts=0; let rejects=0; $('armState').textContent='抢烧中…';
  try{
    if(await burnedThisEpoch()){ won=true; log('这个钱包本 Epoch 已经烧过了，不用再抢','ok'); return; }
    if(chainNow()>=nextStart-0.2){ // 开放后触发:先确认链上真开了、资格真没问题,再弹钱包(避免钱包里出现"交易可能失败"的红字)
      const s=await waitUntilOpenOrFull();
      if(s==='full'){ log('今天额度已经满了，下次再来','bad'); return; }
      if(s==='notopen'){ log('过了开放时刻 3 分钟合约还说没开（not open today），官方可能改了开放时间。页面会按最近一天的实际开放时刻重新算，请稍后刷新再开启','bad'); return; }
      if(s!=='open'){ log('合约拒绝：'+s+'（不弹钱包了，先把这个问题解决）','bad'); return; }
      log('链上已开放且模拟通过，弹钱包…','ok');
    } else log(relayOn()?'托管节点模式：现在弹钱包，点确认后交易在节点里等到开放那一刻':'提前触发：第一笔可能落在开放前被拒，被拒会立刻再弹一次','warn');
    while(!won && attempts<8 && chainNow()<nextStart+75){
      const r=await attempt();
      if(r==='win')break;
      if(r==='rejected'){ rejects++; if(rejects>=2){log('连续两次取消，停止。想继续点"立刻发"','warn');break;} log('再弹一次，这次请点确认','warn'); continue; }
      if(chainNow()>nextStart+45){ const why=await simulate(); if(/daily maximum/i.test(why)){log('今天额度已经满了，下次再来','bad');break;} }
    }
  } finally { racing=false; armed=false; $('armState').textContent=won?'成功 🎉':'已结束'; await loadState(); }
}
async function arm(){
  if(armed)return;
  const ok=await loadWallet().catch(()=>false); if(!ok){ log('资格检查没通过，不能开启','bad'); return; }
  armed=true; keepAwake();
  if(relayOn()){ const ping=await relayGet('/status',3000); if(!ping){ relayDown=true; relayRender(); log('托管节点连不上，本次改用"开放后弹窗"','bad'); } }
  const lead=Number($('lead').value); const leadS=relayOn()?RELAY_POP:(isNaN(lead)?-1.5:lead/1000);
  $('armState').innerHTML='<span class="ok">已开启</span>，'+(relayOn()?'托管：开放前 45 秒弹钱包，直接点确认':leadS>=0?('到点前 '+leadS+' 秒弹签名'):('开放后 '+(-leadS)+' 秒弹签名'));
  log('自动抢已开启：'+bj(nextStart)+(leadS>=0?' 前 '+leadS:' 后 '+(-leadS))+' 秒弹出钱包签名。保持本页在前台、钱包已解锁、别锁屏。');
  clearInterval(armTimer); let warned=false;
  armTimer=setInterval(()=>{ if(!armed){clearInterval(armTimer);return;} const left=nextStart-chainNow();
    if(!warned&&left<=(relayOn()?RELAY_POP+15:30)){ warned=true; buzz([80,60,80]); log(relayOn()?'还有一分钟，钱包马上弹出，弹出后直接点确认':'还有 30 秒，准备好点确认','warn'); loadWallet().then(ok=>{ if(!ok) log('⚠ 资格检查刚才变红了，请立刻看上面红字','bad'); }).catch(()=>{}); }
    if(left<=leadS){ clearInterval(armTimer); race(); } },100);
}
function stop(){armed=false;clearInterval(armTimer);$('armState').textContent='已停止';log('已停止自动抢');}
function tick(){ if(!nextStart)return; const left=Math.max(0,Math.floor(nextStart-chainNow())); const h=String(Math.floor(left/3600)).padStart(2,'0'),m=String(Math.floor(left%3600/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0'); $('countdown').textContent=h+':'+m+':'+s; $('countdown').style.color=left<=60?'#f0c060':'#e9eef3'; }

$('btnConnect').onclick=connect; $('btnApprove').onclick=doApprove; $('btnArm').onclick=arm; $('btnStop').onclick=stop;
$('btnNow').onclick=()=>{ if(racing)return; log('手动：立刻发一笔'); racing=true; attempt().finally(()=>{racing=false;loadState();}); };
setInterval(tick,250); setInterval(relayRender,3000); setInterval(()=>{ syncClock().catch(()=>{}); },30000); setInterval(()=>{ if(!racing) loadState(); },60000);
loadState().then(()=>{ const pv=pickProvider(); if(pv&&pv.selectedAddress) connect(); });
log('页面就绪。先连接钱包，资格检查全绿后再开启自动抢。');
})();
</script>
