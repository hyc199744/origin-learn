<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AiLGNS × LGNS 双链金融数据终端</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
a{color:inherit}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* ============ THEME A : ORIGIN TERMINAL ============ */
body[data-theme="a"]{--bg:#050807;--bg2:#090d0a;--panel:#0a100c;--panel2:#0d140f;--line:#1d2b21;--txt:#d7e2da;--dim:#7d8f83;--acc:#22ff88;--acc2:#e8c15a;--blue:#4db2ff;--red:#ff5d5d;--chip:#12241a;--radius:4px;--shadow:none;background:var(--bg);color:var(--txt)}
/* ============ THEME B : HELIX NEXUS ============ */
body[data-theme="b"]{--bg:#04061a;--bg2:#070b26;--panel:rgba(20,28,64,.55);--panel2:rgba(28,38,84,.5);--line:rgba(96,140,255,.25);--txt:#e6ecff;--dim:#8fa3d9;--acc:#38e1ff;--acc2:#a06bff;--blue:#5f8dff;--red:#ff6b8a;--chip:rgba(56,225,255,.12);--radius:16px;--shadow:0 8px 32px rgba(0,0,0,.45);background:radial-gradient(1100px 500px at 80% -10%,#16235e 0%,transparent 60%),radial-gradient(900px 480px at -10% 110%,#241257 0%,transparent 55%),var(--bg);color:var(--txt);min-height:100vh}
/* ============ THEME C : AiLGNS WEALTH ============ */
body[data-theme="c"]{--bg:#f5f2ea;--bg2:#efe9db;--panel:#ffffff;--panel2:#faf7f0;--line:#e3ddcd;--txt:#16233c;--dim:#6d7690;--acc:#0e9f6e;--acc2:#b8862e;--blue:#2456a6;--red:#d64545;--chip:#eef4ee;--radius:18px;--shadow:0 6px 24px rgba(22,35,60,.08);background:var(--bg);color:var(--txt)}

#app{min-height:100vh;display:flex;flex-direction:column}
/* top bar */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.logo{font-weight:800;font-size:17px;letter-spacing:.5px;white-space:nowrap}
.logo small{display:block;font-size:10px;color:var(--dim);font-weight:500;letter-spacing:1.5px}
body[data-theme="a"] .logo{color:var(--acc)}
body[data-theme="b"] .logo{background:linear-gradient(90deg,#38e1ff,#a06bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar .sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:calc(var(--radius) + 4px);overflow:hidden}
.seg button{background:transparent;border:0;color:var(--dim);padding:7px 10px;font-size:12px}
.seg button.on{background:var(--acc);color:#04120a;font-weight:700}
body[data-theme="c"] .seg button.on{color:#fff}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:calc(var(--radius) + 4px);padding:7px 11px;font-size:12px}
/* ticker */
.ticker{display:flex;gap:18px;overflow-x:auto;padding:7px 14px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px;white-space:nowrap;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.ticker b{color:var(--acc)}
.ticker .neg{color:var(--red)}
/* layout */
.shell{flex:1;display:flex;min-height:0}
.sidenav{display:none}
.main{flex:1;padding:14px;max-width:1460px;margin:0 auto;width:100%;padding-bottom:92px}
body[data-theme="a"] .sidenav{display:none}
@media(min-width:1024px){
  body[data-theme="a"] .sidenav{display:flex;flex-direction:column;gap:2px;width:216px;flex:none;padding:14px 10px;border-right:1px solid var(--line);background:var(--bg2);position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto}
  body[data-theme="c"] .sidenav{display:flex;flex-direction:column;gap:2px;width:200px;flex:none;padding:14px 10px;position:sticky;top:57px;height:calc(100vh - 57px)}
  body[data-theme="b"] .topnav{display:flex}
}
.sidenav button,.topnav button{background:transparent;border:0;color:var(--dim);text-align:left;padding:9px 12px;font-size:13.5px;border-radius:var(--radius);display:flex;gap:8px;align-items:center}
.sidenav button.on,.topnav button.on{background:var(--chip);color:var(--acc);font-weight:700}
.topnav{display:none;gap:2px;overflow-x:auto;padding:8px 14px 0;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav button{white-space:nowrap;padding:8px 13px;border:1px solid transparent}
.topnav button.on{border-color:var(--line);background:var(--panel)}
/* bottom nav (mobile) */
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.botnav button{flex:1;background:transparent;border:0;color:var(--dim);padding:8px 2px 7px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
.botnav button .ic{font-size:17px}
.botnav button.on{color:var(--acc);font-weight:700}
@media(min-width:1024px){.botnav{display:none}.main{padding-bottom:26px}}
/* cards & grids */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:768px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1200px){.g4{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
body[data-theme="b"] .card{backdrop-filter:blur(10px)}
.card h3{font-size:13px;color:var(--dim);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.big{font-size:24px;font-weight:800;letter-spacing:.2px}
body[data-theme="c"] .big{font-size:29px}
body[data-theme="a"] .big{font-size:21px}
.sub{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.55}
.pos{color:var(--acc)} .neg{color:var(--red)}
.chip{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--chip);color:var(--acc);border:1px solid var(--line);white-space:nowrap}
.chip.warn{color:var(--acc2)} .chip.bad{color:var(--red)} .chip.gray{color:var(--dim)}
.clickable{cursor:pointer}
.clickable:active{transform:scale(.99)}
.sec-title{font-size:16px;font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:4px;height:16px;background:var(--acc);border-radius:2px}
body[data-theme="a"] .sec-title{font-size:14px;letter-spacing:1px}
/* table */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:600;background:var(--panel2);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* forms */
label.f{display:block;font-size:12px;color:var(--dim);margin:10px 0 5px}
input[type=text],input[type=number],select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:var(--radius);padding:11px 12px;font-size:14px;outline:none}
input:focus{border-color:var(--acc)}
.btn{background:var(--acc);color:#04120a;border:0;border-radius:var(--radius);padding:11px 18px;font-size:14px;font-weight:700}
body[data-theme="c"] .btn{color:#fff}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addr{word-break:break-all;font-size:12px}
.copy{font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--acc)}
/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal .box{background:var(--panel);color:var(--txt);width:100%;max-width:560px;max-height:86vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px;border:1px solid var(--line)}
@media(min-width:768px){.modal{align-items:center}.modal .box{border-radius:18px}}
.modal h3{font-size:16px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv span:first-child{color:var(--dim);flex:none}
/* chart */
.chartwrap{position:relative}
canvas.chart{width:100%;height:230px;display:block;touch-action:pan-y}
.rangebar{display:flex;gap:6px;margin:8px 0}
.rangebar button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:5px 12px;font-size:12px}
.rangebar button.on{background:var(--acc);color:#04120a;font-weight:700}
body[data-theme="c"] .rangebar button.on{color:#fff}
.tip{position:absolute;pointer-events:none;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11.5px;display:none;z-index:5;color:var(--txt)}
.banner{border:1px solid var(--acc2);color:var(--acc2);border-radius:var(--radius);padding:9px 12px;font-size:12.5px;margin-bottom:12px;background:var(--panel);line-height:1.6}
.hero{padding:20px}
.hero .big{font-size:34px}
body[data-theme="a"] .hero .big{font-size:26px}
.netviz{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.progress{height:8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--acc)}
.mutelist{font-size:12.5px;color:var(--dim);line-height:1.9}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--bg2);color:var(--txt);border:1px solid var(--acc);padding:9px 16px;border-radius:99px;font-size:13px;z-index:99;display:none;box-shadow:var(--shadow)}
@media(max-width:380px){.big{font-size:20px}.logo{font-size:15px}}
</style>
</head>

/* ================= chart ================= */
function drawChart(cv, series, color){
  const dpr = window.devicePixelRatio||1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr; const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  const vals = series.map(r=>r[1]); let min=Math.min(...vals), max=Math.max(...vals);
  const pad=(max-min)*0.08||1; min-=pad; max+=pad;
  const X=i=> i/(series.length-1)*(W-8)+4, Y=v=> H-18-((v-min)/(max-min))*(H-36);
  const cs=getComputedStyle(document.body);
  ctx.strokeStyle=cs.getPropertyValue("--line"); ctx.fillStyle=cs.getPropertyValue("--dim"); ctx.font="10px sans-serif";
  ctx.beginPath(); ctx.moveTo(0,Y(max-pad)); ctx.lineTo(W,Y(max-pad)); ctx.moveTo(0,Y(min+pad)); ctx.lineTo(W,Y(min+pad)); ctx.stroke();
  ctx.fillText(max.toPrecision(3),6,12); ctx.fillText(min.toPrecision(3),6,H-6);
  ctx.beginPath(); series.forEach((r,i)=> i?ctx.lineTo(X(i),Y(r[1])):ctx.moveTo(X(0),Y(r[1])));
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();
  ctx.lineTo(X(series.length-1),H-14); ctx.lineTo(X(0),H-14); ctx.closePath();
  ctx.globalAlpha=.14; ctx.fillStyle=color; ctx.fill(); ctx.globalAlpha=1;
  cv._series=series; cv._X=X; cv._Y=Y;
}
function bindTip(cv, tipEl, unit){
  const move = e=>{ const s=cv._series; if(!s) return;
    const r=cv.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    let i=Math.round((x-4)/(r.width-8)*(s.length-1)); i=Math.max(0,Math.min(s.length-1,i));
    tipEl.style.display="block"; tipEl.style.left=Math.min(r.width-118,x+8)+"px"; tipEl.style.top="8px";
    tipEl.innerHTML = s[i][0]+"<br><b>"+unit+s[i][1].toPrecision(4)+"</b>"; };
  cv.addEventListener("mousemove",move); cv.addEventListener("touchstart",move,{passive:true}); cv.addEventListener("touchmove",move,{passive:true});
  cv.addEventListener("mouseleave",()=>tipEl.style.display="none");
}
function sliceRange(hist, days){ if(days>=9999) return hist; return hist.slice(-days); }

function pctChg(hist, days){ if(!hist||hist.length<2) return null;
  const last=hist[hist.length-1][1], prev=hist[Math.max(0,hist.length-1-days)][1];
  return prev? (last-prev)/prev*100 : null; }
function epochInfo(){ const start=new Date("2026-09-28T00:00:00+08:00").getTime();
  const now=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Shanghai"})).getTime();
  const dayIdx=Math.floor((now-start)/86400000)+1, epoch=Math.max(1,Math.ceil(dayIdx/7));
  const es=new Date(start+(epoch-1)*7*86400000), ee=new Date(es.getTime()+6*86400000);
  const f=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return {dayIdx, epoch, start:f(es), end:f(ee)}; }

function lpCalc(){
  const side=$("#lpSide").value, amt=parseFloat($("#lpAmt").value)||0, fee=(parseFloat($("#lpFee").value)||0)/100;
  state.calc.lpSide=side; state.calc.lpAmt=amt; state.calc.lpFee=fee*100; saveState();
  const x=A.pool_lgns||0, y=A.pool_dai||0, k=x*y, spot=y/x;
  let out, avg, impact, nx, ny;
  if(side==="buy"){ const eff=amt*(1-fee); ny=y+eff; nx=k/ny; out=x-nx; avg=amt/Math.max(out,1e-9); impact=(avg-spot)/spot*100; }
  else { const eff=amt*(1-fee); nx=x+eff; ny=k/nx; out=y-ny; avg=out/Math.max(amt,1e-9); impact=(spot-avg)/spot*100; }
  $("#lpOut").innerHTML = '<div class="grid g4">'+
   '<div><div class="sub">'+(LANG==="zh"?"预计获得":"Est. Receive")+'</div><div class="big">'+fmt(out)+' '+(side==="buy"?"LGNS":"DAI")+'</div></div>'+
   '<div><div class="sub">'+(LANG==="zh"?"平均成交价":"Avg Price")+'</div><div class="big">'+avg.toFixed(5)+'</div></div>'+
   '<div><div class="sub">'+(LANG==="zh"?"价格冲击":"Price Impact")+'</div><div class="big '+(impact>5?"neg":"pos")+'">'+impact.toFixed(2)+'%</div></div>'+
   '<div><div class="sub">'+(LANG==="zh"?"交易后池价":"Post-trade Price")+'</div><div class="big">'+(ny/nx).toFixed(5)+'</div></div></div>';
}

  const share=my/Math.max(tot,1), per=issue*share;

   '<div class="kv"><span>'+(LANG==="zh"?"每周期预估产出":"Per Epoch")+'</span><b>'+fmt(per)+' AiLGNS</b></div>'+
   '<div class="kv"><span>'+(LANG==="zh"?"每日预估（÷7）":"Per Day")+'</span><b>'+fmt(per/7)+' AiLGNS</b></div>'+
   '<div class="kv"><span>30 '+(LANG==="zh"?"天预估":"days")+'</span><b>'+fmt(per/7*30)+' AiLGNS</b></div>';
  const tot2=tot+pow, per2=issue*(pow/Math.max(tot2,1)), totOut=per2*ep;
  $("#cOut2").innerHTML='<div class="kv"><span>'+(LANG==="zh"?"投入后算力占比":"Share After")+'</span><b>'+(pow/Math.max(tot2,1)*100).toFixed(4)+'%</b></div>'+
   '<div class="kv"><span>'+(LANG==="zh"?"每周期预估产出":"Per Epoch")+'</span><b>'+fmt(per2)+' AiLGNS</b></div>'+
   '<div class="kv"><span>'+ep+' '+(LANG==="zh"?"周期累计":"epochs total")+'</span><b>'+fmt(totOut)+' AiLGNS</b></div>'+
   '<div class="kv"><span>'+(LANG==="zh"?"按参考价折合":"Value @ ref price")+'</span><b>'+fmt(totOut*px)+' DAI</b></div>'+
   '<div class="kv"><span>'+(LANG==="zh"?"情景收益率":"Scenario ROI")+'</span><b>'+(dai?((totOut*px-dai)/dai*100).toFixed(1):"—")+'%</b></div>';
  const rows=[[(LANG==="zh"?"保守":"Conservative"),0.5,2],[(LANG==="zh"?"基准":"Base"),1,1.5],[(LANG==="zh"?"乐观":"Optimistic"),2,1.2]].map(s=>{
    const o=issue*(pow/Math.max(tot*s[2]+pow,1))*ep*s[1]; return '<tr><td>'+s[0]+'</td><td class="num">'+fmt(o)+' AiLGNS</td><td class="num">'+fmt(o*px)+' DAI</td><td class="num">'+(dai?((o*px-dai)/dai*100).toFixed(1):"—")+'%</td></tr>'; }).join("");
  $("#cOut3").innerHTML='<div class="tscroll" style="border:0"><table style="min-width:0"><tr><th>'+(LANG==="zh"?"情景":"Scenario")+'</th><th class="num">'+(LANG==="zh"?"累计产出":"Output")+'</th><th class="num">'+(LANG==="zh"?"折合":"Value")+'</th><th class="num">ROI</th></tr>'+rows+'</table></div><div class="sub">'+(LANG==="zh"?"情景参数：价格倍数 ×0.5/×1/×2、全网算力增长 ×2/×1.5/×1.2。估算不等于承诺。":"Price ×0.5/×1/×2, network growth ×2/×1.5/×1.2. Estimates are not promises.")+'</div>';
}
AFTER.calc = function(){ ["cMy","cTot","cIssue","cDai","cPow","cPx","cEp"].forEach(id=>{ const e=document.getElementById(id); if(e) e.addEventListener("input",calcRun); }); calcRun(); };
VIEWS.monitor = function(){
  const rows=CONTRACTS.map(c=>'<tr><td>'+c[0]+'</td><td class="mono" style="font-size:11px">'+(c[1]==="—"?"—":short(c[1])+' <button class="copy" onclick="copyTxt(\''+c[1]+'\')">'+t("copy")+'</button>')+'</td><td>'+chip(c[2])+'</td><td style="white-space:normal;min-width:200px">'+c[3]+'</td></tr>').join("");
  return '<div class="sec-title">🛡 '+(LANG==="zh"?"链上监控与数据证据中心":"Monitor & Proof")+'</div>'+
  '<div class="card" style="margin-bottom:12px"><h3>'+(LANG==="zh"?"合约与地址核验登记表":"Contract Registry")+'</h3><div class="tscroll" style="border:0"><table><tr><th>'+(LANG==="zh"?"名称":"Name")+'</th><th>'+(LANG==="zh"?"地址":"Address")+'</th><th>'+(LANG==="zh"?"状态":"Status")+'</th><th>'+(LANG==="zh"?"说明":"Note")+'</th></tr>'+rows+'</table></div></div>'+
  '<div class="grid g2"><div class="card"><h3>'+(LANG==="zh"?"已记录的合约风险事件":"Recorded Risk Events")+'</h3><div class="mutelist">'+
  (LANG==="zh"?"· 2026-10-27 02:21 LGNS 代理升级新实现<br>· 2026-10-27 02:23 部署者 setRestricted 限制 fLGNS/LGNS 池，池内 LGNS 冻结至今<br>· LGNS 实现可升级、可暂停（已实查）<br>· AiLGNS 实现合约未验证、约 93% 供应由代理合约集中持有（2026-10-09）":"· 2026-10-27 LGNS proxy upgraded; fLGNS pool restricted & frozen<br>· LGNS implementation upgradeable & pausable (verified)<br>· AiLGNS implementation unverified, ~93% in proxies (2026-10-09)")+'</div></div>'+
  '<div class="card"><h3>'+(LANG==="zh"?"大额与异常监控":"Whale & Anomaly")+'</h3><div class="mutelist">'+(LANG==="zh"?"· LGNS 看板每 6 小时扫描大额转账与国库异动（运行中）<br>· 巨鲸买卖排行、自定义阈值提醒：待事件索引接入<br>· 本站不生成无依据的「安全分数」":"· Dashboard scans large transfers every 6h (live)<br>· Whale rankings & alerts: pending indexing<br>· No baseless safety scores here")+'</div></div></div>';
};
VIEWS.dict = function(){
  const rows=Object.values(METRICS).map(m=>'<tr><td style="white-space:normal;min-width:160px">'+m.name+'</td><td>'+m.chain+'</td><td style="white-space:normal;min-width:220px">'+m.formula+'</td><td style="white-space:normal;min-width:200px">'+m.src+'</td></tr>').join("");
  return '<div class="sec-title">📖 '+(LANG==="zh"?"指标字典":"Metric Dictionary")+'</div><div class="card"><div class="tscroll" style="border:0"><table><tr><th>'+(LANG==="zh"?"指标":"Metric")+'</th><th>'+t("chain")+'</th><th>'+t("formula")+'</th><th>'+t("src")+'</th></tr>'+rows+'</table></div>'+
  '<div class="sub" style="margin-top:10px">'+(LANG==="zh"?"通用口径：净买入 = 买入额 − 卖出额（交易统计 ≠ 协议外部净流入）；换手率 = 周期成交量 ÷ 平均流通量；质押率 = 有效质押 ÷ 可质押供应；净供应变化 = 新增发行 − 永久销毁；DAI 未经汇率验证不直接等同 USD。":"Net buy = buys − sells (not protocol inflow); Turnover = volume ÷ avg float; Net supply change = minted − burned; DAI ≠ USD without rate check.")+'</div></div>';
};
