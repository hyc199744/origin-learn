var esc=function(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");};
var flat=[]; DATA.forEach(function(g){ g.items.forEach(function(it,i){ flat.push({c:g.c,q:it[0],a:it[1]}); }); });
var total=flat.length;
var curCat="全部", kw="";

function cats(){
  var box=document.getElementById("cats"); var list=["全部"].concat(DATA.map(function(g){return g.c;}));
  box.innerHTML=list.map(function(c){return '<span class="cat'+(c===curCat?" on":"")+'" data-c="'+esc(c)+'">'+esc(c)+(c==="全部"?" "+total:"")+'</span>';}).join("");
  box.querySelectorAll(".cat").forEach(function(el){ el.onclick=function(){ curCat=el.getAttribute("data-c"); cats(); render(); }; });
}
function hl(t){ if(!kw)return esc(t); var i=t.toLowerCase().indexOf(kw.toLowerCase()); if(i<0)return esc(t); return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+kw.length))+"</mark>"+esc(t.slice(i+kw.length)); }
function render(){
  var wrap=document.getElementById("list"), cnt=document.getElementById("count"); wrap.innerHTML="";
  var groups=DATA.filter(function(g){return curCat==="全部"||g.c===curCat;});
  var shown=0, num=0;
  groups.forEach(function(g){
    var items=g.items.filter(function(it){ return !kw || (it[0]+it[1]).toLowerCase().indexOf(kw.toLowerCase())>=0; });
    if(!items.length)return;
    var gd=document.createElement("div"); gd.className="grp";
    gd.innerHTML='<h2>'+esc(g.c)+' <span class="n">'+items.length+' 题</span></h2>'+items.map(function(it){
      num++; shown++;
      return '<details class="faq"><summary><span class="qn">Q'+num+'</span><span>'+hl(it[0])+'</span></summary><div class="a">'+it[1].replace(/__KW__/g,"")+'</div></details>';
    }).join("");
    wrap.appendChild(gd);
  });
  if(!shown){ wrap.innerHTML='<div class="empty">没有匹配"'+esc(kw)+'"的问题，换个关键词试试。</div>'; }
  cnt.textContent="共 "+total+" 题"+(kw?("，匹配 "+shown+" 题"):(curCat!=="全部"?("，当前分类 "+shown+" 题"):""));
}
document.getElementById("q").addEventListener("input",function(e){ kw=e.target.value.trim(); render(); });
cats(); render();
</script>
