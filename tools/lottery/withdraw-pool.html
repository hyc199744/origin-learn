<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>提取刮刮乐奖池</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#FAF7F0;color:#3a2a22;min-height:100vh}
.wrap{max-width:440px;margin:0 auto;padding:24px 16px}
h2{color:#5C1A27;margin-bottom:6px}
.sub{font-size:13px;color:#a08c6a;margin-bottom:16px;word-break:break-all}
.card{background:#fff;border:1px solid #e8dcc0;border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
.row b{color:#b8912f}
button{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px}
#connectBtn{background:#fff;border:1px solid #C9A86A;color:#5C1A27}
#skimBtn{background:linear-gradient(135deg,#C9A86A,#a8823f);color:#fff;letter-spacing:1px}
#skimBtn:disabled{opacity:.4;cursor:default}
#msg{font-size:13px;color:#a08c6a;margin-top:10px;word-break:break-all;min-height:20px}
#msg.ok{color:#2e7d32}#msg.err{color:#c0392b}
.note{font-size:12px;color:#a08c6a;margin-top:14px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h2>🎰 提取刮刮乐奖池</h2>
  <div class="sub">InstantLottery v2<br>0xEAD5eA0A5B3EcB718CC69821A4EA389927F1c123</div>
  <div class="card">
    <div class="row"><span>奖池余额</span><b><span id="pool">-</span> LGNS</b></div>
    <div class="row"><span>保留线</span><b><span id="reserve">-</span> LGNS</b></div>
    <div class="row"><span>可提金额</span><b><span id="canSkim">-</span> LGNS</b></div>
  </div>
  <button id="connectBtn">连接钱包</button>
  <button id="skimBtn" disabled>提取到 owner 钱包</button>
  <div id="msg"></div>
  <div class="note">一次性工具页，用完即删。提币走 owner 权限的 skim，只能 owner 钱包操作。交易为 Anubis legacy type-0。</div>
</div>
<script>
const CONTRACT='0xEAD5eA0A5B3EcB718CC69821A4EA389927F1c123';
const CHAIN_HEX='0x1A3A';
const SEL={pool:'16f0115b',owner:'8da5cb5b',minReserve:'1b4a2001',skim:'6939aaf5'};
let myAddr=null, POOL=0n, OWNER='', RESERVE=0n;
const $=id=>document.getElementById(id);
const req=(m,p)=>window.ethereum.request({method:m,params:p||[]});
const msg=(s,cls)=>{const e=$('msg');e.textContent=s;e.className=cls||'';};
const decUint=h=>BigInt('0x'+(h||'0').replace(/^0x/,''));
const fmt=v=>{const s=v.toString().padStart(10,'0');return s.slice(0,-9)+'.'+s.slice(-9).replace(/0+$/,'')||'0';};
const fmtC=v=>{const s=fmt(v);return s.endsWith('.')?s.slice(0,-1):s;};
async function call(d){const r=await req('eth_call',[{to:CONTRACT,data:'0x'+d},'latest']);return r;}
async function connect(){
  if(!window.ethereum)return msg('请在钱包浏览器中打开','err');
  try{
    const accs=await req('eth_requestAccounts',[]);
    if(!accs||!accs.length)throw new Error('未获取到地址');
    myAddr=accs[0];
    const cid=await req('eth_chainId',[]);
    if(cid.toLowerCase()!==CHAIN_HEX){
      try{await req('wallet_switchEthereumChain',[{chainId:CHAIN_HEX}]);}
      catch(e){throw new Error('请先切换到 Anubis 链');}
    }
    $('connectBtn').textContent='已连接 '+myAddr.slice(0,6)+'…'+myAddr.slice(-4);
    await refresh();
  }catch(e){msg('连接失败: '+e.message,'err');}
}
async function refresh(){
  try{
    POOL=decUint(await call(SEL.pool));
    OWNER='0x'+(await call(SEL.owner)).slice(26);
    RESERVE=decUint(await call(SEL.minReserve));
    $('pool').textContent=fmtC(POOL);
    $('reserve').textContent=fmtC(RESERVE);
    const can=POOL>RESERVE?POOL-RESERVE:0n;
    $('canSkim').textContent=fmtC(can);
    const isOwner=myAddr&&myAddr.toLowerCase()===OWNER.toLowerCase();
    $('skimBtn').disabled=!(isOwner&&can>0n);
    if(myAddr&&!isOwner)msg('当前钱包不是 owner，无法提币','err');
    else if(can>0n&&isOwner)msg('');
  }catch(e){msg('读取失败: '+e.message,'err');}
}
async function doSkim(){
  const can=POOL>RESERVE?POOL-RESERVE:0n;
  if(can<=0n)return;
  if(!confirm('从奖池提取 '+fmtC(can)+' LGNS 到 owner 钱包？'))return;
  $('skimBtn').disabled=true;
  try{
    msg('交易发送中…');
    const data='0x'+SEL.skim+can.toString(16).padStart(64,'0');
    const gp=await req('eth_gasPrice',[]);
    const hash=await req('eth_sendTransaction',[{from:myAddr,to:CONTRACT,data,type:'0x0',gasPrice:gp}]);
    msg('已发送: '+hash+'，等待确认…');
    for(let i=0;i<120;i++){
      await new Promise(r=>setTimeout(r,2000));
      const rc=await req('eth_getTransactionReceipt',[hash]);
      if(rc&&rc.blockNumber&&rc.blockNumber!=='0x0'){
        if(rc.status==='0x1'){msg('✅ 提币成功','ok');await refresh();}
        else msg('交易失败(reverted)','err');
        $('skimBtn').disabled=false;
        return;
      }
    }
    msg('超时，请在浏览器查看交易状态: '+hash,'err');
  }catch(e){msg('失败: '+(e.message||e),'err');}
  $('skimBtn').disabled=false;
}
$('connectBtn').onclick=connect;
$('skimBtn').onclick=doSkim;
</script>
</body>
</html>
