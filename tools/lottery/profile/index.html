<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的记录 · ANUBIS PLAY</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
.hero{padding:130px 0 26px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.filter-bar button{background:var(--card);border:1px solid var(--line-soft);color:var(--muted);
  border-radius:999px;padding:8px 18px;font-size:13.5px;cursor:pointer;font-weight:600}
.filter-bar button.on{border-color:var(--gold);color:var(--gold-hi);background:rgba(212,175,55,.08)}
.rec-sec{margin-bottom:26px}
.rec-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:13px 18px;border:1px solid var(--line-soft);border-radius:14px;margin-bottom:10px;background:var(--card)}
.rec-row .t{font-weight:700}
.rec-row .m{color:var(--muted);font-size:13px;margin-top:3px}
.rec-row .amt{font-weight:800;color:var(--gold-hi)}
.rec-empty{color:var(--faint);font-size:14px;padding:20px;text-align:center;border:1px dashed var(--line-soft);border-radius:14px}
.addr-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<script>window.SITE_ROOT='../';</script>
<script>
window.PAGE_I18N = {
zh:{
  nav_home:'首页', nav_games:'游戏大厅', nav_profile:'我的记录', nav_help:'新手指南', nav_news:'平台公告',
  nav_lottery:'链上彩票', connect:'连接钱包', foot_data:'链上数据以浏览器为准',
  kicker:'ANUBIS CHAIN · 链上游戏平台',
  h_title:'我的记录', h_sub:'钱包地址名下的链上参与与中奖记录',
  not_conn:'连接钱包后查看你的链上记录',
  f_all:'全部', sec_buy:'参与记录', sec_win:'中奖记录',
  buy_t:'第 {r} 期 · 购买 {n} 张', win_t:'第 {r} 期 · 中奖',
  loading:'正在读取链上记录…', load_fail:'读取失败，', retry:'重试',
  empty_buy:'该条件下暂无购票记录', empty_win:'该条件下暂无中奖记录',
  tx:'交易 →', addr:'地址'
},
en:{
  nav_home:'Home', nav_games:'Games', nav_profile:'Records', nav_help:'Guide', nav_news:'News',
  nav_lottery:'Lottery', connect:'Connect Wallet', foot_data:'On-chain data as shown in explorer',
  kicker:'ANUBIS CHAIN · On-chain Gaming Hub',
  h_title:'My Records', h_sub:'On-chain participation and winnings under your wallet',
  not_conn:'Connect your wallet to view on-chain records',
  f_all:'All', sec_buy:'Ticket Purchases', sec_win:'Winnings',
  buy_t:'Round {r} · {n} tickets', win_t:'Round {r} · Won',
  loading:'Loading on-chain records…', load_fail:'Load failed. ', retry:'Retry',
  empty_buy:'No purchase records', empty_win:'No winnings yet',
  tx:'Tx →', addr:'Address'
}};
</script>
<script src="../shared/site.js"></script>

<header class="hero">
  <div class="wrap" style="position:relative">
    <div class="hero-kicker"><span class="pulse"></span><span data-i18n="kicker">ANUBIS CHAIN · 链上游戏平台</span></div>
    <h1 class="page-title" data-i18n="h_title">我的记录</h1>
    <p class="page-sub" data-i18n="h_sub"></p>
    <div class="addr-line">
      <button class="btn btn-gold" id="connBtn" data-i18n="connect">连接钱包</button>
      <span class="muted small" id="addrShow"></span>
    </div>
  </div>
</header>

<section class="sec" style="padding-top:0">
  <div class="wrap">
    <div id="needConn"><div class="panel center muted" data-i18n="not_conn">连接钱包后查看你的链上记录</div></div>
    <div id="recWrap" style="display:none">
      <div class="filter-bar" id="poolFilter"></div>
      <div class="rec-sec">
        <div class="sec-head"><span class="sec-num">01</span>
          <div><div class="sec-title" data-i18n="sec_buy">参与记录</div></div></div>
        <div id="buyList"><div class="muted" data-i18n="loading">正在读取链上记录…</div></div>
      </div>
      <div class="rec-sec">
        <div class="sec-head"><span class="sec-num">02</span>
          <div><div class="sec-title" data-i18n="sec_win">中奖记录</div></div></div>
        <div id="winList"><div class="muted" data-i18n="loading">正在读取链上记录…</div></div>
      </div>
    </div>
  </div>
</section>

<script>
SiteNav.render('nav_profile');
renderFooter();
I18n.apply();

var myAddr=null, poolF='ALL', cache={buy:[],win:[]}, EX='https://browser.anubispace.org';
function hex(n){ return '0x'+BigInt(n).toString(16); }
function addrTopic(a){ return '0x'+a.toLowerCase().replace(/^0x/,'').padStart(64,'0'); }
function decAddr(h){ return '0x'+h.slice(-40); }

async function scanPool(P, topics, from){
  var latest=parseInt(await apRpc('eth_blockNumber',[]),16), out=[];
  for(var f=from; f<=latest; f+=4000){
    var to=Math.min(f+3999, latest);
    var part=await apRpc('eth_getLogs',[{address:P.contract,topics:topics,fromBlock:hex(f),toBlock:hex(to)}]);
    if(part&&part.length) out=out.concat(part.map(function(l){ l._pool=P; return l; }));
  }
  return out;
}
function blockTime(bn){
  return apRpc('eth_getBlockByNumber',[hex(bn),false]).then(function(b){
    var ts=parseInt(b.timestamp,16)*1000, d=new Date(ts);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '
      +String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }).catch(function(){ return ''; });
}
async function loadRecords(){
  var bl=document.getElementById('buyList'), wl=document.getElementById('winList');
  bl.innerHTML='<div class="muted">'+t('loading')+'</div>';
  wl.innerHTML='<div class="muted">'+t('loading')+'</div>';
  try{
    var me=addrTopic(myAddr), buys=[], wins=[];
    for(var i=0;i<window.LOTTERY_POOLS.length;i++){
      var P=window.LOTTERY_POOLS[i];
      var tl=await scanPool(P,[window.EV_TICKETS,null,me],P.deploy);
      tl.forEach(function(l){
        var d=(l.data||'0x').slice(2);
        buys.push({pool:P, round:parseInt(l.topics[1],16), count:parseInt(d.slice(0,64),16),
          tx:l.transactionHash, bn:parseInt(l.blockNumber,16)});
      });
      var wl2=await scanPool(P,[window.EV_WINNERS],P.deploy);
      wl2.forEach(function(l){
        var d=(l.data||'0x').slice(2);
        var offW=parseInt(d.slice(0,64),16)*2, offA=parseInt(d.slice(64,128),16)*2;
        var nW=parseInt(d.slice(offW,offW+64),16);
        for(var k=0;k<nW;k++){
          var w=decAddr(d.slice(offW+64*(k+1),offW+64*(k+2)));
          if(w.toLowerCase()===myAddr.toLowerCase()){
            var amt=BigInt('0x'+d.slice(offA+64*(k+1),offA+64*(k+2)));
            wins.push({pool:P, round:parseInt(l.topics[1],16), amt:amt, tx:l.transactionHash, bn:parseInt(l.blockNumber,16)});
          }
        }
      });
    }
    buys.sort(function(a,b){return b.bn-a.bn;}); wins.sort(function(a,b){return b.bn-a.bn;});
    cache={buy:buys,win:wins};
    var bns={}; buys.concat(wins).forEach(function(r){ bns[r.bn]=1; });
    var keys=Object.keys(bns);
    await Promise.all(keys.map(function(k){ return blockTime(Number(k)).then(function(ts){ bns[k]=ts; }); }));
    cache.buy.forEach(function(r){ r.ts=bns[r.bn]; }); cache.win.forEach(function(r){ r.ts=bns[r.bn]; });
    paintLists();
  }catch(e){
    var html='<div class="muted">'+t('load_fail')+'<a href="javascript:loadRecords()" class="neon">'+t('retry')+'</a></div>';
    bl.innerHTML=html; wl.innerHTML=html;
  }
}
function paintLists(){
  var bl=document.getElementById('buyList'), wl=document.getElementById('winList');
  var buys=cache.buy.filter(function(r){return poolF==='ALL'||r.pool.sym===poolF;});
  var wins=cache.win.filter(function(r){return poolF==='ALL'||r.pool.sym===poolF;});
  bl.innerHTML = buys.length ? buys.map(function(r){
    return '<div class="rec-row"><div><div class="t">'+r.pool.sym+' · '+t('buy_t').replace('{r}',r.round).replace('{n}',r.count)+'</div>'
      +'<div class="m">'+(r.ts||'')+'</div></div>'
      +'<div><a class="neon small" target="_blank" rel="noopener" href="'+EX+'/tx/'+r.tx+'">'+t('tx')+'</a></div></div>';
  }).join('') : '<div class="rec-empty">'+t('empty_buy')+'</div>';
  wl.innerHTML = wins.length ? wins.map(function(r){
    return '<div class="rec-row"><div><div class="t">'+r.pool.sym+' · '+t('win_t').replace('{r}',r.round)+'</div>'
      +'<div class="m">'+(r.ts||'')+'</div></div>'
      +'<div><span class="amt">'+apFmt(r.amt,r.pool.dec)+' '+r.pool.sym+'</span> '
      +'<a class="neon small" target="_blank" rel="noopener" href="'+EX+'/tx/'+r.tx+'">'+t('tx')+'</a></div></div>';
  }).join('') : '<div class="rec-empty">'+t('empty_win')+'</div>';
}
function paintFilter(){
  var el=document.getElementById('poolFilter'); if(!el) return;
  var opts=['ALL'].concat(window.LOTTERY_POOLS.map(function(p){return p.sym;}));
  el.innerHTML=opts.map(function(s){
    return '<button class="'+(s===poolF?'on':'')+'" data-p="'+s+'">'+(s==='ALL'?t('f_all'):s)+'</button>';
  }).join('');
  el.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){ poolF=b.getAttribute('data-p'); paintFilter(); paintLists(); };
  });
}
async function onConnect(){
  var btn=document.getElementById('connBtn');
  try{
    var acc=await Wallet.connect();
    if(!acc) return;
    myAddr=acc;
    document.getElementById('addrShow').textContent=t('addr')+': '+Wallet.short(acc);
    btn.style.display='none';
    document.getElementById('needConn').style.display='none';
    document.getElementById('recWrap').style.display='block';
    paintFilter(); loadRecords();
  }catch(e){}
}
document.getElementById('connBtn').onclick=onConnect;
if(Wallet.addr){ myAddr=Wallet.addr;
  document.getElementById('connBtn').style.display='none';
  document.getElementById('needConn').style.display='none';
  document.getElementById('recWrap').style.display='block';
  document.getElementById('addrShow').textContent=t('addr')+': '+Wallet.short(myAddr);
  paintFilter(); loadRecords();
}
window.onLangChange=function(){
  paintFilter(); paintLists();
  var f=document.querySelector('footer'); if(f) f.remove(); renderFooter();
};
</script>
</body>
</html>
