<style>
:root{--bg:#0d1114;--card:#181e23;--card2:#20292e;--text:#eff6f3;--muted:#96a4ab;
  --accent:#c8f665;--accent-ink:#17200b;--line:#ffffff14;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"Roboto Mono",ui-monospace,monospace;color-scheme:dark;}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--mono)}
.top{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:center;gap:10px;
  height:42px;padding:0 16px;background:#0d1114;border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);font-weight:600}.back .ic{width:18px;height:18px}
.brand{display:flex;align-items:center;gap:8px}.brand img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 0 7px #0009)}
.brand b{font-size:9px;font-weight:700;letter-spacing:.8px;line-height:1}.brand small{display:block;font-size:6px;letter-spacing:1.8px;color:var(--muted);margin-top:4px}
.wallet-btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:11px;padding:10px 13px;border-radius:9px;box-shadow:0 6px 18px #c8f66522}
.wallet-btn.connected{background:#1f2a1f;color:var(--accent);box-shadow:none;border:1px solid #c8f66555}
.wallet-btn .ic{width:15px;height:15px}
.lang-menu[hidden]{display:none!important}
.lang-menu{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));right:14px;background:#20292e;border:1px solid var(--line);border-radius:12px;padding:6px;min-width:150px;z-index:200;box-shadow:0 14px 34px #0009;display:flex;flex-direction:column;gap:2px;max-height:min(70vh,440px);overflow-y:auto}
.lang-menu .lmi{padding:10px 14px;border-radius:8px;font-size:13px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:10px}
.lang-menu .lmi:hover{background:#ffffff0d}.lang-menu .lmi.on{color:var(--accent);background:#bfee6612}
.lang-menu .lmi.soon{opacity:.45;cursor:default}.lang-menu .lmi.soon em{margin-left:auto;font-size:9px;font-style:normal;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.flag{display:inline-block;width:20px;height:13px;border-radius:3px;overflow:hidden;flex:none;line-height:0;box-shadow:0 0 0 1px #0004}.flag svg{width:100%;height:100%;display:block}
.wrap{max-width:720px;margin:0 auto;padding:46px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.h1{font-size:22px;font-weight:600;margin:0 0 6px}.lead{color:var(--muted);font-size:12px;margin:0 0 20px;line-height:1.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:600;margin:0 0 14px}
.eyebrow{color:var(--muted);font-size:9px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;margin-bottom:8px}
.link-row{display:flex;gap:8px}
.link-row input{flex:1;min-width:0;padding:12px 14px;background:#0d1215;border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:12.5px;font-family:var(--mono)}
.btn-copy{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;padding:0 18px;border-radius:10px;white-space:nowrap}
.inv-tools{display:flex;gap:10px;margin-top:12px}
.tool-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#0f1519;color:var(--accent);border:1px solid #c8f66540;border-radius:10px;padding:11px;font-size:12px;font-weight:600}
.tool-btn .ic{width:15px;height:15px}
#qrbox{display:none;margin-top:16px;text-align:center}#qrbox img{margin:0 auto;border-radius:10px;width:168px;height:168px;background:#fff;padding:8px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
.kv .k{color:var(--muted)}.kv .v{font-family:var(--mono);font-weight:600;text-align:right}
.rstat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.rs{background:#0d1215;border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:center}
.rs .n{font-family:var(--mono);font-size:24px;font-weight:600}.rs .l{font-size:10px;color:var(--muted);margin-top:4px}
.claim-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.claim-row:last-child{border-bottom:none}
.claim-row .pl{display:flex;align-items:center;gap:9px;font-weight:600}
.claim-row .dot{width:10px;height:10px;border-radius:50%;flex:none}
.claim-row .amt{font-family:var(--mono);color:var(--accent);margin-left:auto}
.btn-claim{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;padding:8px 14px;border-radius:9px}
.btn-claim:disabled{opacity:.4}
.rdrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:11px 0;border-bottom:1px dashed var(--line);font-size:12px}
.rdrow:last-child{border-bottom:none}
.rdrow .tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;margin-right:6px}
.rdrow .dl{font-family:var(--mono);color:var(--muted)}
.rdrow .tx{font-family:var(--mono);color:var(--accent);font-size:11px}
.rdrow .a{font-family:var(--mono);font-weight:600;color:var(--accent);margin-left:auto}
.note{font-size:11px;color:var(--muted);line-height:1.7}
.pager{display:flex;justify-content:center;gap:14px;margin-top:14px}
.pager button{background:#0d1215;border:1px solid var(--line);border-radius:9px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--text)}
.pager button:disabled{opacity:.4}
.foot{display:flex;justify-content:center;gap:16px;margin-top:22px;font-size:10px;color:var(--muted)}
.foot span{display:inline-flex;align-items:center;gap:5px}.foot .ic{width:13px;height:13px;color:var(--accent)}
#vtoast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#20292e;color:#eff6f3;border:1px solid #ffffff22;padding:11px 18px;border-radius:10px;font-size:13px;z-index:999;max-width:88%;text-align:center;box-shadow:0 10px 30px #0008;opacity:0;transition:opacity .2s;pointer-events:none}
@media(max-width:400px){.rstat{grid-template-columns:1fr}.rs{text-align:left;display:flex;justify-content:space-between;align-items:center}.rs .l{margin-top:0}}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="../"><svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>游戏大厅</a>
  <div style="display:none">
    <button class="wallet-btn" id="langBtn" onclick="toggleLangMenu(event)" aria-label="Language" style="gap:0;justify-content:center;padding:9px 11px;background:#131a1e;color:var(--accent);border:1px solid var(--line);box-shadow:none"><svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span id="langCode"></span></button>
    <div id="langMenu" class="lang-menu" hidden></div>
    <button class="wallet-btn" id="walletBtn" onclick="connectWallet()"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M16 12h.01"/></svg><span id="walletTxt">连接钱包</span></button>
  </div>

<main class="wrap">
  <h1 class="h1">发现</h1>
  <p class="lead">每日签到领 LGNS，活动公告、收益排行榜，更多玩法持续上新。</p>

  <section class="card">
    <h2>每日签到 <span id="ciStreak" style="font-size:11px;color:var(--muted);font-weight:400"></span></h2>
    <div id="ciDays" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px"><div class="note" style="padding:4px 0;text-align:left">连接钱包查看每日签到奖励</div></div>
    <button id="ciBtn" class="btn-copy" style="width:100%;padding:13px">连接钱包签到</button>
    <div class="note" style="text-align:left;padding:8px 0 0">连续签到奖励递增、第 7 天最高，断签归零。奖励以 LGNS 记入「我的」可领返佣，去那里一键领取。</div>
  </section>

  <section class="card">
    <h2>活动公告</h2>
    <div id="annList"><div class="note">加载中…</div></div>
  </section>

  <section class="card">
    <h2>收益排行榜</h2>
    <div id="lbList"><div class="note">加载中…</div></div>
  </section>

  <section class="card">
    <h2>即将上线</h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <span style="background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:12px;font-weight:600">龙虎斗 <span class="mono" style="color:var(--muted);margin-left:4px">开发中</span></span>
      <span style="background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:12px;font-weight:600">幸运转盘 <span class="mono" style="color:var(--muted);margin-left:4px">开发中</span></span>
      <span style="background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:12px;font-weight:600">竞技场 <span class="mono" style="color:var(--muted);margin-left:4px">开发中</span></span>
    </div>
  </section>

  <div class="foot">
    <span><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4Z"/></svg>链上可查</span>
    <span><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M7 11V8a5 5 0 0110 0v3"/></svg>钱包签名</span>
    <span><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>理性参与</span>
  </div>
</main>

<script>
(function(){
  var API='https://zjgame.web3origin.com/ref';
  var TOK={ '0x4d1d808a081fdac440703b3765fc61f8028c06b8':{sym:'LGNS',dec:9}, '0x83fd06f0846d9d90b3016bf670efe2e0b11cde14':{sym:'DAI',dec:18}, '0x2e045e1380f5f5b6e7550328910a7377c9fce59d':{sym:'RM',dec:9}, '0xdfb6a28bc6dc51fed17c27c880f2c66cdd040a3e':{sym:'USDT',dec:6} };
  function $(id){return document.getElementById(id);}
  function short(a){return a?a.slice(0,6)+'…'+a.slice(-4):'';}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fmt(s,dec){try{var v=BigInt(s||'0');var str=v.toString().padStart(dec+1,'0');var i=str.slice(0,str.length-dec),f=str.slice(str.length-dec).slice(0,2).replace(/0+$/,'');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,',');return f?i+'.'+f:i;}catch(e){return '0';}}
  function EN(){try{var s=localStorage.getItem('aplang');if(s==='en')return true;if(s==='zh')return false;}catch(e){}return (navigator.language||'').toLowerCase().indexOf('zh')!==0;}
  function L(zh,en){return EN()?en:zh;}
  function amt(m){var out=[];for(var tk in (m||{})){var info=TOK[tk]||TOK[String(tk).toLowerCase()]||{sym:'',dec:18};try{if(BigInt(m[tk])>0n)out.push(fmt(m[tk],info.dec)+' '+info.sym);}catch(e){}}return out.length?out.join(' · '):'0';}
  // 活动公告
  fetch('../announce.json?cb='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    var items=((j&&j.items)||[]).filter(function(x){return x&&x.on;});var box=$('annList');if(!box)return;
    if(!items.length){box.innerHTML='<div class="note">'+L('暂无公告','No announcements')+'</div>';return;}
    box.innerHTML=items.map(function(it){var t=EN()?(it.en&&it.en.t):(it.zh&&it.zh.t);var b=EN()?(it.en&&it.en.b):(it.zh&&it.zh.b);return '<div style="padding:12px 0;border-bottom:1px dashed var(--line)"><div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:5px"><b style="font-size:13.5px">'+esc(t)+'</b><span style="font-size:11px;color:var(--muted);white-space:nowrap">'+esc(it.date)+'</span></div><div style="font-size:12.5px;color:var(--muted);line-height:1.7">'+esc(b)+'</div></div>';}).join('');
  }).catch(function(){var box=$('annList');if(box)box.innerHTML='<div class="note">'+L('公告加载失败','Failed to load')+'</div>';});
  // 收益排行榜
  fetch(API+'/leaderboard?limit=20',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    var lb=(j&&j.list)||[];var box=$('lbList');if(!box)return;
    if(!lb.length){box.innerHTML='<div class="note">'+L('暂无数据','No data yet')+'</div>';return;}
    box.innerHTML=lb.map(function(r){var medal=r.rank<=3?['🥇','🥈','🥉'][r.rank-1]:'#'+r.rank;return '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px"><span style="width:28px;color:'+(r.rank<=3?'#e0bd68':'#7e9583')+';font-weight:800">'+medal+'</span><span style="flex:1;font-family:var(--mono)">'+short(r.addr)+'</span><span style="color:var(--muted)">'+L('直推 ','dir ')+(r.directCount||0)+'</span><span style="color:var(--accent);font-weight:700;min-width:70px;text-align:right">'+amt(r.earned)+'</span></div>';}).join('');
  }).catch(function(){var box=$('lbList');if(box)box.innerHTML='<div class="note">'+L('排行榜加载失败','Failed to load')+'</div>';});
  // ---- 钱包 + 每日签到/抽奖 ----
  var myAddr=null;
  function toast(m){var t=$('vtoast');if(!t){t=document.createElement('div');t.id='vtoast';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(window._tt);window._tt=setTimeout(function(){t.style.opacity='0';},3800);}
  function fmtL(b){return fmt(b,9);}
  function renderDaily(d){ d=d||{};
    var cd=$('ciDays'); if(cd){ var rw=d.rewards||[]; cd.innerHTML=rw.length?rw.map(function(x,i){var day=i+1;var nx=(!d.checkedToday&&day===d.nextDay);return '<div style="flex:1;min-width:38px;text-align:center;padding:8px 3px;border-radius:10px;border:1px solid '+(nx?'#c8f665':'var(--line)')+';background:'+(nx?'#c8f66514':'#0d1215')+'"><div style="font-size:9px;color:var(--muted)">'+L('第','D')+day+(EN()?'':'天')+'</div><div style="font-size:11px;font-weight:700;color:var(--accent);font-family:var(--mono)">'+fmtL(x)+'</div></div>';}).join(''):'<div class="note" style="padding:4px 0;text-align:left">'+L('连接钱包查看每日签到奖励','Connect wallet to view')+'</div>'; }
    var cb=$('ciBtn'); if(cb){ cb.disabled=false; if(!myAddr)cb.textContent=L('连接钱包签到','Connect to check in'); else if(d.eligible===false){cb.textContent=L('先玩一局再来签到','Play a game first');cb.disabled=true;} else if(d.checkedToday){cb.textContent=L('今日已签到 ✓','Checked in ✓');cb.disabled=true;} else cb.textContent=L('签到领 ','Check in · ')+fmtL(d.nextReward||'0')+' LGNS'; }
    var cs=$('ciStreak'); if(cs)cs.textContent=(d.streak>0)?(L('已连续 ','streak ')+d.streak+L(' 天','d')):'';
  }
  function loadDaily(){ if(!myAddr){ renderDaily({}); return; } fetch(API+'/daily?addr='+myAddr,{cache:'no-store'}).then(function(r){return r.json();}).then(renderDaily).catch(function(){ renderDaily({}); }); }
  async function ensure(){ var eth=window.ethereum; if(!eth){ toast(L('请在 OKX / MetaMask 内置浏览器打开','Open in OKX / MetaMask browser')); return false; } if(!myAddr){ try{ var a=await eth.request({method:'eth_requestAccounts'}); myAddr=(a&&a[0])||null; }catch(e){ return false; } } return !!myAddr; }
  function sign(msg){ return window.ethereum.request({method:'personal_sign',params:[msg,myAddr]}); }
  async function postJ(p,o){ return fetch(API+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(function(r){return r.json();}); }
  var _busy=false;
  if($('ciBtn'))$('ciBtn').onclick=async function(){ if(_busy)return; if(!await ensure())return; _busy=true; try{ var sig=await sign('ANUBIS PLAY daily checkin: '+myAddr.toLowerCase()); var r=await postJ('/checkin',{addr:myAddr,sig:sig}); if(r.ok)toast(L('签到成功 +','Checked in +')+fmtL(r.reward)+L(' LGNS，去「我的」领取',' LGNS — claim in Me')); else if(r.already)toast(L('今天已经签过了','Already checked in today')); else if(r.capped)toast(L('今日奖励已发完，明天再来','Rewards used up, back tomorrow')); else if(r.error==='not_eligible')toast(L('先玩一局或用邀请进入才能签到','Play a game or enter via invite first')); else toast(L('签到失败','Check-in failed')); loadDaily(); }catch(e){} finally{ _busy=false; } };
  if(window.ethereum&&window.ethereum.request){ window.ethereum.request({method:'eth_accounts'}).then(function(a){ if(a&&a[0])myAddr=a[0]; loadDaily(); }).catch(function(){ loadDaily(); }); } else { loadDaily(); }
})();
</script>

  function uiWallet(){var x=$('walletTxt');if(x)x.textContent=myAddr?short(myAddr):(window.tr?window.tr('连接钱包'):'连接钱包');var b=$('walletBtn');if(b)b.classList.toggle('connected',!!myAddr);loadLink();loadAll();}
  window.__uiWallet=uiWallet;
  window.connectWallet=async function(){var eth=window.ethereum;if(!eth){toast(TR('未检测到钱包，请在 OKX / MetaMask 内置浏览器打开'));return;}
    try{var accs=await eth.request({method:'eth_requestAccounts'});if(!accs||!accs.length)return;myAddr=accs[0];
      var cid=await eth.request({method:'eth_chainId'});
      if(parseInt(cid,16)!==ANUBIS.id){try{await eth.request({method:'wallet_switchEthereumChain',params:[{chainId:ANUBIS.hex}]});}catch(e){if(e&&e.code===4902){await eth.request({method:'wallet_addEthereumChain',params:[{chainId:ANUBIS.hex,chainName:ANUBIS.name,rpcUrls:[ANUBIS.rpc],nativeCurrency:ANUBIS.native,blockExplorerUrls:[ANUBIS.exp]}]});}else throw e;}}
      uiWallet();
      if(!window._wl){window._wl=1;if(eth.on){eth.on('accountsChanged',function(a){myAddr=(a&&a[0])||null;uiWallet();});eth.on('chainChanged',function(){location.reload();});}}
    }catch(e){toast((e&&e.message)||TR('连接失败'));}};
  async function sendTx(to,d){var eth=window.ethereum;var tx={from:myAddr,to:to,data:d,type:'0x0'};tx.gasPrice=await eth.request({method:'eth_gasPrice',params:[]});
    var hash=await eth.request({method:'eth_sendTransaction',params:[tx]});toast(TR('交易已发送，等待确认…'));
    for(var i=0;i<150;i++){await new Promise(function(r){setTimeout(r,2000);});var rc=await eth.request({method:'eth_getTransactionReceipt',params:[hash]});if(rc&&rc.blockNumber&&rc.blockNumber!=='0x0'){if(rc.status==='0x1')return rc;throw new Error(TR('交易失败(被合约回退)'));}}throw new Error(TR('确认超时，请在浏览器查看'));}
  /* 链接 + 二维码 */
  function inviteUrl(){try{return new URL('../lottery/?ref='+myAddr, location.href).href;}catch(e){return location.origin+'/lottery/?ref='+myAddr;}}
  function loadLink(){var el=$('refLink');if(!el)return;el.value=myAddr?inviteUrl():'';}
  window.copyLink=function(){var el=$('refLink');if(!el||!el.value){toast(TR('连接钱包'));return;}el.select();try{if(navigator.clipboard)navigator.clipboard.writeText(el.value);else document.execCommand('copy');}catch(e){}toast(TR('已复制'));};
  window.shareLink=function(){var el=$('refLink');if(!el||!el.value){toast(TR('连接钱包'));return;}if(navigator.share){navigator.share({title:document.title,url:el.value}).catch(function(){});}else copyLink();};
  window.toggleQr=function(){var box=$('qrbox');if(!box)return;if(box.style.display==='block'){box.style.display='none';return;}var el=$('refLink');if(!el||!el.value){toast(TR('连接钱包'));return;}try{var qr=qrcode(0,'M');qr.addData(el.value);qr.make();box.innerHTML=qr.createImgTag(5,0);box.style.display='block';}catch(e){toast('QR');}};
  /* 读数据 */
  async function loadReferrer(){var el=$('myRef');if(!el)return;if(!myAddr){el.textContent='—';return;}var refs=[];for(var i=0;i<POOLS.length;i++){try{var r='0x'+(await ethCall(POOLS[i].c,SEL.referrer+encA(myAddr))).slice(-40);if(r!=='0x0000000000000000000000000000000000000000'){refs.push(short(r));break;}}catch(e){}}el.textContent=refs.length?refs[0]:TR('无，首次购票时绑定');}
  async function loadRewards(){
    var box=$('claimList');if(!box)return;
    if(!myAddr){box.innerHTML='<div class="note">'+TR('连接钱包查看邀请数据')+'</div>';return;}
    var rows='';claimable={};
    for(var i=0;i<POOLS.length;i++){var P=POOLS[i];var rw=0n;try{rw=BigInt('0x'+((await ethCall(P.c,SEL.rewards+encA(myAddr)))||'0'));}catch(e){}claimable[i]=rw;
      var has=rw>0n;
      rows+='<div class="claim-row"><span class="pl"><span class="dot" style="background:'+COL[i]+'"></span>'+P.sym+'</span><span class="amt">'+fmt(rw,P.d)+' '+P.sym+'</span>'+(has?'<button class="btn-claim" onclick="claim('+i+')">'+TR('领取')+'</button>':'')+'</div>';}
    box.innerHTML=rows;
  }
  window.claim=async function(i){if(busy)return;if(!myAddr){await connectWallet();return;}if(!claimable[i]||claimable[i]<=0n){toast(TR('没有可领返佣'));return;}busy=true;try{await sendTx(POOLS[i].c,'0x'+SEL.claim);toast(TR('领取成功！'));loadRewards();}catch(e){toast((e&&e.message)||e);}finally{busy=false;}};
  async function loadStats(){
    if(!myAddr){$('stDirect').textContent='—';$('stIndirect').textContent='—';$('stEarned').textContent='—';return;}
    var me=myAddr.toLowerCase();
    try{
      var bound={};
      for(var i=0;i<POOLS.length;i++){var bl=await getLogs(EV_BOUND,POOLS[i].c,POOLS[i].b);bl.forEach(function(l){var buyer=('0x'+l.topics[1].slice(-40)).toLowerCase();var rf=('0x'+l.topics[2].slice(-40)).toLowerCase();if(!(buyer in bound))bound[buyer]=rf;});}
      var direct={},dc=0;for(var b in bound){if(bound[b]===me){direct[b]=1;dc++;}}
      var ic=0;for(var b in bound){if(!direct[b]&&b!==me&&direct[bound[b]])ic++;}
      var earned=0n,det=[];
      for(var i=0;i<POOLS.length;i++){var P=POOLS[i];var rl=await getLogs(EV_REWARD,P.c,P.b);rl.forEach(function(l){var d=(l.data||'0x').replace(/^0x/,'');var rid=num(l.topics[1]);var buyer=('0x'+l.topics[2].slice(-40)).toLowerCase();var r1=('0x'+d.slice(0,64).slice(-40)).toLowerCase(),a1=BigInt('0x'+(d.slice(64,128)||'0')),r2=('0x'+d.slice(128,192).slice(-40)).toLowerCase(),a2=BigInt('0x'+(d.slice(192,256)||'0'));var bn=num(l.blockNumber);if(r1===me&&a1>0n){earned+=a1;det.push({lvl:1,buyer:buyer,amt:a1,P:P,tx:l.transactionHash,bn:bn,rid:rid});}if(r2===me&&a2>0n){earned+=a2;det.push({lvl:2,buyer:buyer,amt:a2,P:P,tx:l.transactionHash,bn:bn,rid:rid});}});}
      $('stDirect').textContent=dc;$('stIndirect').textContent=ic;
      var es={};det.forEach(function(x){if(!es[x.P.sym])es[x.P.sym]={d:x.P.d,a:0n};es[x.P.sym].a+=x.amt;});
      var estr=Object.keys(es).map(function(s){return fmt(es[s].a,es[s].d)+' '+s;}).join(' · ');
      $('stEarned').textContent=estr||'0';
      det.sort(function(a,b){return b.bn-a.bn;});_det=det;_dp=0;renderDetail();
    }catch(e){ $('stDirect').textContent='0';$('stIndirect').textContent='0';$('stEarned').textContent='0'; }
  }
  function renderDetail(){
    var box=$('detail');if(!box)return;
    if(!myAddr){box.innerHTML='<div class="note">'+TR('连接钱包查看邀请数据')+'</div>';return;}
    if(!_det.length){box.innerHTML='<div class="note">'+TR('暂无记录')+'</div>';return;}
    var pages=Math.ceil(_det.length/8);if(_dp>=pages)_dp=pages-1;if(_dp<0)_dp=0;
    var sl=_det.slice(_dp*8,_dp*8+8),html='';var en=(window.getLang&&window.getLang()==='en');
    sl.forEach(function(r){var tag=r.lvl===1?TR('直推'):TR('间推');var tc=r.lvl===1?'var(--accent)':'#9A834F';
      html+='<div class="rdrow"><span><span class="tag" style="color:'+tc+';border:1px solid '+tc+'">'+tag+'</span><span class="dl">'+r.P.sym+' · '+(en?('R'+r.rid):('第'+r.rid+'期'))+' · '+short(r.buyer)+'</span></span><a class="tx" href="https://browser.anubispace.org/tx/'+r.tx+'" target="_blank" rel="noopener">'+short(r.tx)+' ↗</a><span class="a">+'+fmt(r.amt,r.P.d)+' '+r.P.sym+'</span></div>';});
    if(pages>1){html+='<div class="pager"><button '+(_dp<=0?'disabled':'')+' onclick="detPage(-1)">‹</button><span class="note" style="align-self:center">'+(_dp+1)+' / '+pages+'</span><button '+(_dp>=pages-1?'disabled':'')+' onclick="detPage(1)">›</button></div>';}
    box.innerHTML=html;
  }
  window.detPage=function(d){_dp+=d;renderDetail();};
  function loadAll(){loadReferrer();loadRewards();loadStats();}
  window.__loadInvite=loadAll;
  if(window.ethereum&&window.ethereum.request){window.ethereum.request({method:'eth_accounts'}).then(function(a){if(a&&a.length){myAddr=a[0];uiWallet();}}).catch(function(){});}
  loadLink();
})();
</script>
