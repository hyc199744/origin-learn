<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1114">
<title>平台公告 · ANUBIS PLAY</title>
<meta name="description" content="ANUBIS PLAY 平台公告与最新动态。">
<link rel="icon" href="../img/logo.webp?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<script defer src="../i18n.js?v=22"></script>
<script defer src="../spa.js?v=1"></script>
<style>
:root{--bg:#0d1114;--card:#181e23;--card2:#20292e;--text:#eff6f3;--muted:#96a4ab;--accent:#c8f665;--line:#ffffff14;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color-scheme:dark;}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:#0d1114e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}.back .ic{width:16px;height:16px}
.brand{display:flex;align-items:center;gap:8px}.brand img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 6px #0008)}
.brand b{font-size:13px;font-weight:700;letter-spacing:.5px;line-height:1}.brand small{display:block;font-size:7px;letter-spacing:1.5px;color:var(--muted);margin-top:3px}
.langbtn{display:inline-flex;align-items:center;gap:6px;background:#131a1e;color:var(--accent);border:1px solid var(--line);border-radius:9px;padding:10px 12px}.langbtn .ic{width:16px;height:16px}
.lang-menu[hidden]{display:none!important}
.lang-menu{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));right:14px;background:#20292e;border:1px solid var(--line);border-radius:12px;padding:6px;min-width:150px;z-index:200;box-shadow:0 14px 34px #0009;display:flex;flex-direction:column;gap:2px;max-height:min(70vh,440px);overflow-y:auto}
.lang-menu .lmi{padding:10px 14px;border-radius:8px;font-size:13px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:10px}
.lang-menu .lmi:hover{background:#ffffff0d}.lang-menu .lmi.on{color:var(--accent);background:#bfee6612}
.lang-menu .lmi.soon{opacity:.45;cursor:default}.lang-menu .lmi.soon em{margin-left:auto;font-size:9px;font-style:normal;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.flag{display:inline-block;width:20px;height:13px;border-radius:3px;overflow:hidden;flex:none;line-height:0;box-shadow:0 0 0 1px #0004}.flag svg{width:100%;height:100%;display:block}
.wrap{max-width:680px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.h1{font-size:22px;font-weight:600;margin:0 0 20px}
.anc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.anc .date{font-size:11px;color:var(--accent);font-weight:600;font-family:ui-monospace,monospace;margin-bottom:8px}
.anc h2{font-size:16px;font-weight:600;margin:0 0 10px}
.anc p{font-size:13px;color:#c6d2cc;margin:0;line-height:1.8}
.note{font-size:13px;color:var(--muted);text-align:center;padding:30px 0}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="../"><svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>游戏大厅</a>
  <a class="brand" href="../"><img src="../img/logo.webp?v=2" alt="ANUBIS PLAY"><span><b>ANUBIS PLAY</b><small>平台公告</small></span></a>
  <button class="langbtn" id="langBtn" onclick="toggleLangMenu(event)" aria-label="Language"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span id="langCode"></span></button>
  <div id="langMenu" class="lang-menu" hidden></div>
</header>
<main class="wrap">
  <h1 class="h1">平台公告</h1>
  <div id="list"><div class="note">加载中…</div></div>
</main>
<script>
(function(){
  var items=[];
  function TR(s){return window.tr?window.tr(s):s;}
  function en(){return window.getLang&&window.getLang()==='en';}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function render(){
    var box=document.getElementById('list');if(!box)return;
    var on=items.filter(function(x){return x.on;});
    if(!on.length){box.innerHTML='<div class="note">'+TR('暂无公告')+'</div>';return;}
    var l=en()?'en':'zh';
    box.innerHTML=on.map(function(x){var c=x[l]||x.zh||{};return '<article class="anc"><div class="date">'+esc(x.date||'')+'</div><h2>'+esc(c.t||'')+'</h2><p>'+esc(c.b||'').replace(/\n/g,'<br>')+'</p></article>';}).join('');
  }
  window.__poolRender=render; // 语言切换时重渲染
  fetch('../announce.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){items=(j&&j.items)||[];render();}).catch(function(){items=[];render();});
})();
</script>
</body>
</html>
