let addr=null; const results={};
const $=id=>document.getElementById(id);
const log=t=>{ $('log').textContent += t+"\n"; $('log').scrollTop=1e9; };
const enc=a=>'0'.repeat(24)+String(a).toLowerCase().replace(/^0x/,'');
const isAddr=a=>/^0x[0-9a-fA-F]{40}$/.test(a||'');
function renderPools(){
  $('pools').innerHTML = POOLS.map(p=>`<div class="pool"><div><b>${p.label} 池</b> <span class="muted">底注 ${p.tiers}</span><div class="muted">代币 <code>${p.token}</code></div><div class="muted">庄家 <code>${p.dealer}</code></div><div class="addr" id="res_${p.key}"></div></div><button class="sec" data-dep="${p.key}" disabled>部署</button></div>`).join('');
}
renderPools();
async function connect(){
  const eth=window.ethereum; if(!eth){alert('请在 OKX / MetaMask 钱包内置浏览器打开');return;}
  const accs=await eth.request({method:'eth_requestAccounts'}); addr=accs[0];
  const cid=await eth.request({method:'eth_chainId'});
  if(parseInt(cid,16)!==ANUBIS.id){ try{await eth.request({method:'wallet_switchEthereumChain',params:[{chainId:ANUBIS.hex}]});}catch(e){ if(e&&e.code===4902){await eth.request({method:'wallet_addEthereumChain',params:[{chainId:ANUBIS.hex,chainName:ANUBIS.name,rpcUrls:[ANUBIS.rpc],nativeCurrency:ANUBIS.native,blockExplorerUrls:[ANUBIS.exp]}]});} } }
  $('who').innerHTML='已连接 owner：<code>'+addr+'</code>';
  document.querySelectorAll('[data-dep]').forEach(b=>b.disabled=false);
  log('已连接 '+addr);
}
async function deploy(key){
  const p=POOLS.find(x=>x.key===key); const feeTo=$('feeTo').value.trim();
  if(!addr){alert('先连接钱包');return;}
  if(!isAddr(feeTo)){alert('请先填写正确的收款地址 feeTo');return;}
  const btn=document.querySelector('[data-dep="'+key+'"]'); btn.disabled=true; btn.textContent='部署中…';
  try{
    const eth=window.ethereum;
    const data='0x'+p.bytecode+enc(p.token)+enc(p.dealer)+enc(feeTo);
    const gp=await eth.request({method:'eth_gasPrice',params:[]});
    log(p.label+' 部署中，请在钱包确认…');
    const hash=await eth.request({method:'eth_sendTransaction',params:[{from:addr,data,type:'0x0',gasPrice:gp,gas:'0x4C4B40'}]});
    log(p.label+' tx '+hash+' 等待确认…');
    let rc=null; for(let i=0;i<150;i++){ await new Promise(r=>setTimeout(r,2000)); rc=await eth.request({method:'eth_getTransactionReceipt',params:[hash]}); if(rc&&rc.blockNumber)break; }
    if(!rc||rc.status!=='0x1'){ throw new Error('部署失败或超时'); }
    const ca=rc.contractAddress; results[key]=ca;
    $('res_'+key).textContent='✅ 合约地址：'+ca;
    btn.textContent='已部署';
    log(p.label+' ✅ '+ca);
    updateResult(feeTo);
  }catch(e){ btn.disabled=false; btn.textContent='重试部署'; log(p.label+' 出错：'+(e.message||e)); }
}
function updateResult(feeTo){
  const lines=POOLS.map(p=>p.label+': '+(results[p.key]||'(未部署)')+'  dealer='+p.dealer).join('\n');
  $('result').textContent='owner='+addr+'\nfeeTo='+feeTo+'\n'+lines;
}
$('conn').onclick=connect;
document.addEventListener('click',e=>{const b=e.target.closest('[data-dep]'); if(b)deploy(b.dataset.dep);});
</script></body></html>
