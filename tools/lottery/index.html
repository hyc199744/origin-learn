.hero2{position:relative;padding:120px 0 46px;overflow:hidden}
.hero2-grid{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;position:relative}

.hero2 .sub{margin-top:10px;font-size:13px;letter-spacing:.34em;color:var(--neon);font-weight:600}
.hero2 .zh{margin-top:12px;color:var(--muted);font-size:16px}
.hero2 .desc{margin-top:14px;color:var(--muted);font-size:14px;max-width:440px}
.feat-card{border:1px solid var(--line);border-radius:20px;overflow:hidden;

.feat-rows{padding:16px 22px}
.feat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line-soft);font-size:14px}
.feat-row:last-child{border:none}
.feat-row .k{color:var(--muted)}
.feat-row .v{font-weight:700}
.feat-cta{padding:6px 22px 22px;display:flex;gap:10px}
.pool-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.pool-card{display:block;border:1px solid var(--line-soft);border-radius:16px;padding:18px;
  background:linear-gradient(160deg,var(--card2),rgba(255,255,255,.015));transition:.22s}
.pool-card:hover{transform:translateY(-4px);border-color:var(--line);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.pool-card .ps{font-size:17px;font-weight:800;letter-spacing:.06em}
.pool-card .pp{color:var(--gold-hi);font-weight:700;margin-top:6px;font-size:14.5px}
.pool-card .pm{color:var(--faint);font-size:12px;margin-top:4px}
.pool-card .go{color:var(--neon);font-size:13px;font-weight:700;margin-top:10px;display:block}
.result-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px dashed var(--line-soft);font-size:14px;flex-wrap:wrap}
.result-row:last-child{border:none}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.step{border:1px solid var(--line-soft);border-radius:16px;padding:20px;background:var(--card)}
.step .n{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold-hi),var(--gold));
  color:#241a05;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.step h4{margin-bottom:8px;font-size:15px}
.step p{color:var(--muted);font-size:13.5px}
.dev-strip{display:flex;gap:14px;flex-wrap:wrap}
.dev-item{flex:1;min-width:200px;border:1px solid var(--line-soft);border-radius:14px;padding:16px 18px;
  background:var(--card);display:flex;gap:12px;align-items:center}
.dev-item .di{font-size:26px}
.dev-item h4{font-size:14.5px;margin-bottom:4px}
.dev-item p{color:var(--faint);font-size:12.5px}
.skel{color:var(--faint)!important}
@media(max-width:860px){ .hero2-grid{grid-template-columns:1fr} .hero2{padding:100px 0 36px} }

<script>
SiteNav.render('nav_home');
document.getElementById('fcCover').innerHTML = window.gameCover('lottery');
renderFooter();
initParticles('stars');
I18n.apply();

/* ---- live data: featured lottery card (LGNS main pool) ---- */
function hex(n){ return '0x' + BigInt(n).toString(16); }
function pad64(n){ return BigInt(n).toString(16).padStart(64,'0'); }
function setT(id, txt, cls){ var el=document.getElementById(id); if(el){ el.textContent=txt; if(cls) el.classList.add(cls); } }
async function loadFeatured(){
  var P = window.LOTTERY_POOLS[0], S = window.LOTTERY_SEL;
  try{
    var tp = await apRpc('eth_call',[{to:P.contract,data:'0x'+S.ticketPrice},'latest']);
    var rid = await apRpc('eth_call',[{to:P.contract,data:'0x'+S.currentRound},'latest']);
    var ridN = parseInt(rid,16);
    var rh = await apRpc('eth_call',[{to:P.contract,data:'0x'+S.rounds+pad64(ridN)},'latest']);
    var d = rh.slice(2);
    var endTime = parseInt(d.slice(0,64),16)*1000;
    var sold = parseInt(d.slice(128,192),16);
    var sales = BigInt('0x'+d.slice(192,256)), jackpot = BigInt('0x'+d.slice(256,320));
    var pool = sales + jackpot;
    setT('fcJackpot', apFmt(pool, P.dec)+' '+P.sym);
    setT('fcPrice', apFmt(BigInt(tp), P.dec)+' '+P.sym+' / '+(I18n.lang==='zh'?'张':'ticket'));
    var el = document.getElementById('fcEnd');
    if(el){ el.dataset.end = endTime; tickEnd(); }
    setT('fcSold', sold);
  }catch(e){
    ['fcJackpot','fcPrice','fcEnd','fcSold'].forEach(function(id){
      var el=document.getElementById(id);
      if(el) el.innerHTML = '<a href="javascript:loadFeatured()" class="neon small">'+t('load_fail')+'</a>';
    });
  }
}
function tickEnd(){
  var el=document.getElementById('fcEnd'); if(!el||!el.dataset.end) return;
  var ms = Number(el.dataset.end) - Date.now();
  if(ms<=0){ el.textContent = I18n.lang==='zh'?'已截止':'Ended'; return; }
  var s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  el.textContent = h+':'+String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  setTimeout(tickEnd, 1000);
}

/* ---- pool entries: ticket price per pool ---- */
async function loadPools(){
  var g = document.getElementById('poolGrid'); if(!g) return;
  var S = window.LOTTERY_SEL;
  g.innerHTML = window.LOTTERY_POOLS.map(function(p,i){
    return '<a class="pool-card" href="games/lottery/?pool='+p.sym.toLowerCase()+'">'
      +'<div class="ps">'+p.sym+'</div>'
      +'<div class="pp" id="pp'+i+'">'+t('loading')+'</div>'
      +'<div class="pm">'+(I18n.lang==='zh'?'结算币种':'Settles in')+' '+p.sym+' · '+(I18n.lang==='zh'?'独立轮次':'independent rounds')+'</div>'
      +'<span class="go">'+t('go_pool')+'</span></a>';
  }).join('');
  window.LOTTERY_POOLS.forEach(function(p,i){
    apRpc('eth_call',[{to:p.contract,data:'0x'+S.ticketPrice},'latest']).then(function(tp){
      var el=document.getElementById('pp'+i);
      if(el) el.textContent = apFmt(BigInt(tp),p.dec)+' '+p.sym+' / '+(I18n.lang==='zh'?'张':'ticket');
    }).catch(function(){
      var el=document.getElementById('pp'+i);
      if(el) el.innerHTML = '<a href="javascript:loadPools()" class="neon small">'+t('load_fail')+'</a>';
    });
  });
}

/* ---- recent draws: latest WinnersDrawn on LGNS pool ---- */
function decAddr(h){ return '0x'+h.slice(-40); }
async function loadRecent(){
  var box=document.getElementById('recentList'); if(!box) return;
  var P=window.LOTTERY_POOLS[0], EX='https://browser.anubispace.org';
  try{
    var latest=parseInt(await apRpc('eth_blockNumber',[]),16);
    var from=Math.max(P.deploy, latest-80000), logs=[];
    for(var f=from; f<=latest; f+=4000){
      var to=Math.min(f+3999, latest);
      var part=await apRpc('eth_getLogs',[{address:P.contract,topics:[window.EV_WINNERS],
        fromBlock:hex(f),toBlock:hex(to)}]);
      if(part&&part.length) logs=logs.concat(part);
    }
    logs.sort(function(a,b){return parseInt(b.blockNumber,16)-parseInt(a.blockNumber,16);});
    var show=logs.slice(0,3);
    if(!show.length){ box.innerHTML='<div class="muted">'+t('no_recent')+'</div>'; return; }
    box.innerHTML=show.map(function(l){
      var rid=parseInt(l.topics[1],16), d=(l.data||'0x').slice(2);
      var offW=parseInt(d.slice(0,64),16)*2, offA=parseInt(d.slice(64,128),16)*2;
      var nW=parseInt(d.slice(offW,offW+64),16), total=0n;
      var nA=parseInt(d.slice(offA,offA+64),16);
      for(var i=0;i<nA;i++) total+=BigInt('0x'+d.slice(offA+64*(i+1),offA+64*(i+2)));
      return '<div class="result-row"><div><b>'+t('recent_round').replace('{r}',rid)+'</b> · '
        +t('recent_winners').replace('{n}',nW)+' · <span class="gold">'+t('recent_paid').replace('{a}',apFmt(total,P.dec)+' '+P.sym)+'</span></div>'
        +'<div><a class="neon small" target="_blank" rel="noopener" href="'+EX+'/tx/'+l.transactionHash+'">'+t('verify')+'</a></div></div>';
    }).join('');
  }catch(e){ box.innerHTML='<div class="muted"><a href="javascript:loadRecent()" class="neon">'+t('load_fail')+'</a></div>'; }
}

/* ---- dev progress strip (compact, real info only) ---- */
function paintDev(){
  var el=document.getElementById('devStrip'); if(!el) return;
  var lang=I18n.lang;
  el.innerHTML=window.GAMES.filter(function(g){return g.status!=='live';}).map(function(g){
    return '<div class="dev-item"><div class="di">'+window.gameCover(g.id).replace('style="width:100%;display:block"','style="width:64px;display:block;border-radius:8px"')+'</div>'
      +'<div><h4>'+g.name[lang]+'</h4><p>'+g.desc[lang]+'</p></div></div>';
  }).join('');
}

loadFeatured(); loadPools(); loadRecent(); paintDev();
window.onLangChange = function(){
  paintDev(); loadPools();
  var f=document.querySelector('footer'); if(f) f.remove(); renderFooter();
  var el=document.getElementById('fcEnd'); if(el) tickEnd();
};
</script>
