<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>即开彩票 · Instant Scratch</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",serif;background:#FAF7F0;color:#3a2a22;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 2px}
.brand{font-size:20px;font-weight:800;color:#5C1A27;letter-spacing:1px}
.badge{font-size:11px;color:#a08c6a;border:1px solid #e8dcc0;border-radius:10px;padding:2px 8px;margin-left:6px}
.btns{display:flex;gap:8px}
.wbtn{border:1px solid #C9A86A;background:#fff;color:#5C1A27;border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:600}
.wbtn.on{background:#5C1A27;color:#F5E9C8;border-color:#5C1A27}
.poolcard{background:linear-gradient(135deg,#5C1A27,#7a2434);border-radius:16px;color:#F5E9C8;padding:18px;margin:6px 0 12px;box-shadow:0 6px 20px rgba(92,26,39,.25)}
.poolcard .lb{font-size:12px;opacity:.75;letter-spacing:2px}
.poolcard .amt{font-size:34px;font-weight:800;color:#E8C874;margin:4px 0}
.poolcard .sub{font-size:12px;opacity:.7}
.poolcard.paused{filter:grayscale(.6)}
.tiers{display:flex;gap:8px;margin-bottom:10px}
.tier{flex:1;border:1px solid #C9A86A;background:#fff;border-radius:12px;padding:10px 0;text-align:center;cursor:pointer}
.tier.on{background:#5C1A27;color:#F5E9C8;border-color:#5C1A27}
.tier .b{font-size:16px;font-weight:800}
.tier .p{font-size:11px;opacity:.7;margin-top:2px}
.buy{display:block;width:100%;background:linear-gradient(135deg,#C9A86A,#a8823f);border:none;border-radius:14px;color:#fff;font-size:17px;font-weight:800;padding:14px;cursor:pointer;letter-spacing:2px;margin-bottom:6px}
.buy:disabled{opacity:.45;cursor:default}
.cardwrap{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 4px 18px rgba(92,26,39,.18);display:none;margin-bottom:6px}
.cardwrap.show{display:block}
.cardph{height:190px}
.result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FAF7F0}
.result .amt{font-size:44px;font-weight:800;color:#b8912f}
.result .msg{font-size:15px;color:#5C1A27;margin-top:6px}
canvas#cover{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
.hint{text-align:center;font-size:12px;color:#a08c6a;margin:8px 0;display:none}
.again{display:none;width:100%;background:#fff;border:1px solid #C9A86A;border-radius:12px;color:#5C1A27;font-size:14px;padding:11px;cursor:pointer;margin-bottom:4px}
.ptable{background:#fff;border:1px solid #e8dcc0;border-radius:12px;padding:12px 14px;font-size:13px;margin:12px 0}
.ptable h4{color:#5C1A27;margin-bottom:6px;font-size:14px}
.ptable .pr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #eee}
.ptable .pr:last-child{border:none}
.ptable .pr b{color:#b8912f}
.wins{background:#fff;border:1px solid #e8dcc0;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:12px}
.wins h4{color:#5C1A27;margin-bottom:6px;font-size:14px}
.wins .wr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #f0e8d5;font-size:12px}
.wins .wr:last-child{border:none}
.wins .wr b{color:#b8912f}
.ownerp{background:#fff8ee;border:1px dashed #C9A86A;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:12px;display:none}
.ownerp.show{display:block}
.ownerp h4{color:#5C1A27;margin-bottom:8px;font-size:14px}
.ownerp .row{display:flex;gap:8px;margin-bottom:8px}
.ownerp input{flex:1;border:1px solid #e8dcc0;border-radius:8px;padding:8px;font-size:14px;width:60px}
.ownerp button{background:#5C1A27;color:#F5E9C8;border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.foot{text-align:center;font-size:12px;color:#a08c6a;margin-top:14px}
.foot a{color:#b8912f}
.cfetti{position:absolute;width:8px;height:12px;top:-14px;pointer-events:none;animation:fall 1.6s ease-in forwards;z-index:5}
@keyframes fall{to{transform:translateY(230px) rotate(540deg);opacity:0}}
.freebox{background:#fff;border:1px solid #e8dcc0;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.freebox .ftitle{font-size:14px;font-weight:800;color:#5C1A27;margin-bottom:4px}
.freebox .fsub{font-size:12px;color:#a08c6a;margin-bottom:10px}
.freebox .fsub b{color:#b8912f}
.freebtn{display:block;width:100%;background:#fff;border:1px solid #C9A86A;border-radius:12px;color:#5C1A27;font-size:15px;font-weight:700;padding:11px;cursor:pointer}
.freebtn:disabled{opacity:.45;cursor:default}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><span class="brand" data-i18n="brand">⚡ 即开彩票</span><span class="badge">Anubis</span></div>
    <div class="btns">
      <button class="wbtn" id="langBtn">EN</button>
      <button class="wbtn" id="walletBtn"><span id="walletBtnTxt" data-i18n="connect">连接钱包</span></button>
    </div>
  </div>

  <div class="poolcard" id="poolCard">
    <div class="lb" data-i18n="pool">奖池</div>
    <div class="amt"><span id="poolAmt">-</span> <span style="font-size:16px">LGNS</span></div>
    <div class="sub" id="poolSub"></div>
  </div>

  <div class="tiers" id="tiers"></div>
  <button class="buy" id="buyBtn" disabled><span id="buyTxt"></span></button>

  <div class="freebox" id="freeBox">
    <div class="ftitle" data-i18n="freeTitle">🎁 每日免费刮</div>
    <div class="fsub"><span data-i18n="freeHow">每地址每天 1 次 · 奖项同 1 LGNS 档 · 奖金从奖池出</span> · <span data-i18n="freeLeft">今日剩余</span> <b id="freeLeftN">-</b></div>
    <button class="freebtn" id="freeBtn" disabled><span id="freeTxt"></span></button>
  </div>

  <div class="cardwrap" id="cardwrap">
    <div class="cardph"></div>
    <div class="result"><div class="amt" id="v-amt"></div><div class="msg" id="v-msg"></div></div>
    <canvas id="cover"></canvas>
  </div>
  <div class="hint" id="hint"></div>
  <button class="again" id="againBtn"></button>

  <div class="ptable"><h4 data-i18n="prizeTable">奖项</h4><div id="ptRows"></div></div>
  <div class="wins"><h4 data-i18n="recentWins">最新中奖</h4><div id="winRows"><div style="color:#a08c6a" data-i18n="loading">加载中…</div></div></div>

  <div class="ownerp" id="ownerPanel">
    <h4 data-i18n="ownerPanel">管理员</h4>
    <div class="row"><input id="seedAmt" type="number" placeholder="LGNS"><button id="seedBtn" data-i18n="seed">注资奖池</button></div>
    <div class="row"><input id="skimAmt" type="number" placeholder="LGNS"><button id="skimBtn" data-i18n="skim">提取利润</button></div>
    <div class="row"><input id="reserveAmt" type="number" placeholder="LGNS"><button id="reserveBtn" data-i18n="setReserve">设保留线</button></div>
    <div class="row"><button id="pauseBtn" data-i18n="pause">暂停</button><button id="unpauseBtn" data-i18n="unpause">恢复</button></div>
    <div style="font-size:12px;color:#a08c6a"><span data-i18n="reserveLb">保留线</span>: <span id="reserveVal">-</span> LGNS</div>
  </div>

  <div class="foot"><a href="../" data-i18n="dailyLink">← 每日彩票</a> · <a id="contractLink" target="_blank" rel="noopener" data-i18n="contract">合约</a></div>
</div>

<script>
/* ===== 配置 ===== */
const CFG = {
  CONTRACT: '0xEAD5eA0A5B3EcB718CC69821A4EA389927F1c123',
  token: '0x4d1d808a081fdac440703b3765fc61f8028c06b8',
  decimals: 9, chainId: 6714, chainHex: '0x1a3a',
  chainName: 'Anubis', rpcUrl: 'https://rpc.anubispace.org',
  explorer: 'https://browser.anubispace.org'
};
const SEL = {
  approve:'095ea7b3', allowance:'dd62ed3e', balanceOf:'70a08231',
  play:'6898f82b', seedPool:'025d26bd', skim:'6939aaf5',
  pool:'16f0115b', tiers:'039af9eb', tierCount:'96b55f7d',
  owner:'8da5cb5b', paused:'5c975abb', minReserve:'1b4a2001',
  setMinReserve:'3deb91c7', setPaused:'16c38b3c',
  playFree:'25925e83', lastFreePlay:'1c14f69f', freePerDay:'ea030f22', freeUsed:'6101b37f',
  setFreePerDay:'40f48752'
};
const PLAYED_TOPIC = '0x68c7202a45decf815c2b366df51351accc580243258fedf46ddc86c1c0dd5f2b';
const PLAYEDFREE_TOPIC = '0xd690b938d530df191a758598ef552cf9f40190f20157a97874cf2d2f9e29e7e0';

/* ===== I18N ===== */
const I18N = {
  zh: {brand:'⚡ 即开彩票',connect:'连接钱包',pool:'奖池',poolLow:'奖池不足，等待注资',poolOk:'奖池充足，放心刮',
    buy:'买一张',approve:'授权 LGNS',processing:'处理中…',stepConnect:'连接钱包开始玩',txSent:'交易已发送，等待确认…',txReverted:'交易失败',
    scratchHint:'👆 手指划开涂层',again:'再来一张',lose:'谢谢惠顾，再接再厉',winS:'小奖！',winB:'🎉 大奖！！',
    prizeTable:'奖项（返奖率 70%）',recentWins:'最新中奖',loading:'加载中…',noWins:'暂无',loseRow:'未中奖',
    ownerPanel:'管理员',seed:'注资奖池',skim:'提取利润',setReserve:'设保留线',pause:'暂停',unpause:'恢复',reserveLb:'保留线',
    dailyLink:'← 每日彩票',contract:'合约',needPool:'奖池不足',paused:'已暂停',insufficient:'LGNS 余额不足',
    freeTitle:'🎁 每日免费刮',freeBtn:'免费刮一张',freeUsedUp:'今日免费名额已用完',freeClaimed:'明天再来',freeLeft:'今日剩余',
    freeHow:'每地址每天 1 次 · 奖项同 1 LGNS 档 · 奖金从奖池出'},
  en: {brand:'⚡ Instant Scratch',connect:'Connect Wallet',pool:'Prize Pool',poolLow:'Pool low, waiting for funding',poolOk:'Pool healthy, scratch away',
    buy:'Buy ticket',approve:'Approve LGNS',processing:'Processing…',stepConnect:'Connect wallet to play',txSent:'Tx sent, confirming…',txReverted:'Tx failed',
    scratchHint:'👆 Swipe to scratch',again:'Play again',lose:'No luck this time',winS:'Small win!',winB:'🎉 JACKPOT!!',
    prizeTable:'Prizes (70% RTP)',recentWins:'Recent wins',loading:'Loading…',noWins:'None yet',loseRow:'No win',
    ownerPanel:'Owner',seed:'Seed pool',skim:'Withdraw profit',setReserve:'Set reserve',pause:'Pause',unpause:'Unpause',reserveLb:'Reserve',
    dailyLink:'← Daily lottery',contract:'Contract',needPool:'Pool too low',paused:'Paused',insufficient:'Insufficient LGNS',
    freeTitle:'🎁 Free daily scratch',freeBtn:'Scratch free',freeUsedUp:'No free plays left today',freeClaimed:'Come back tomorrow',freeLeft:'left today',
    freeHow:'1 per address per day · same prizes as 1 LGNS tier · paid from pool'}
};
let LANG = 'zh';
const t = k => (I18N[LANG] && I18N[LANG][k]) || I18N.zh[k] || k;
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.documentElement.lang = LANG==='zh' ? 'zh-CN' : 'en';
  $('langBtn').textContent = LANG==='zh' ? 'EN' : '中文';
}

/* ===== 工具 ===== */
const $ = id => document.getElementById(id);
const short = a => a ? a.slice(0,6)+'…'+a.slice(-4) : '';
function encUint(v){ return BigInt(v).toString(16).padStart(64,'0'); }
function encAddr(a){ return '0'.repeat(24) + a.toLowerCase().replace(/^0x/,''); }
function decUint(h){ return BigInt('0x'+h); }
function parseUnits(s,dec){ const p=String(s).split('.'); const f=(p[1]||''); if(f.length>dec) throw new Error('dec'); return BigInt(p[0]+(f+'0'.repeat(dec)).slice(0,dec)); }
function formatUnits(v,dec){ dec=dec||CFG.decimals; const s=BigInt(v).toString().padStart(dec+1,'0'); const i=s.slice(0,-dec),f=s.slice(-dec).replace(/0+$/,''); return i+(f?'.'+f:''); }
const fmt = v => Number(formatUnits(v)).toLocaleString('en-US',{maximumFractionDigits:2});
function toast(m){ alert(m); }
function req(m,p){ return window.ethereum.request({method:m, params:p}); }
async function ethCall(to,d){ return ((await req('eth_call',[{to,data:d},'latest']))||'0x').replace(/^0x/,''); }

/* ===== 状态 ===== */
let myAddr=null, OWNER='', TIERS=[], POOL=0n, PAUSED=false, tierIdx=0, busy=false;
let FREE_OK=false, FREE_LEFT='-', FREE_REASON='';

/* ===== 钱包 ===== */
async function connect(){
  if(!window.ethereum){ toast('No wallet'); return; }
  const accs = await req('eth_requestAccounts',[]);
  myAddr = accs[0];
  try{
    const cid = await req('eth_chainId',[]);
    if(cid.toLowerCase() !== CFG.chainHex){
      await req('wallet_switchEthereumChain',[{chainId:CFG.chainHex}]);
    }
  }catch(e){
    try{
      await req('wallet_addEthereumChain',[{chainId:CFG.chainHex,chainName:CFG.chainName,
        rpcUrls:[CFG.rpcUrl],nativeCurrency:{name:'Anubis',symbol:'ANB',decimals:18},blockExplorerUrls:[CFG.explorer]}]);
    }catch(e2){ toast(e2.message); }
  }
  updateWalletBtn(); refresh();
}
function updateWalletBtn(){
  const el=$('walletBtnTxt');
  el.textContent = myAddr ? short(myAddr) : t('connect');
  $('walletBtn').classList.toggle('on', !!myAddr);
}
$('walletBtn').onclick = connect;
$('langBtn').onclick = ()=>{ LANG = LANG==='zh'?'en':'zh'; applyI18n(); render(); };

/* ===== 读取 ===== */
async function refresh(){
  try{
    POOL = decUint(await ethCall(CFG.CONTRACT,'0x'+SEL.pool));
    PAUSED = decUint(await ethCall(CFG.CONTRACT,'0x'+SEL.paused)) === 1n;
    OWNER = '0x' + (await ethCall(CFG.CONTRACT,'0x'+SEL.owner)).slice(24);
    const n = Number(decUint(await ethCall(CFG.CONTRACT,'0x'+SEL.tierCount)));
    TIERS = [];
    for(let i=0;i<n;i++){
      const h = await ethCall(CFG.CONTRACT,'0x'+SEL.tiers+encUint(i));
      TIERS.push({
        bet: decUint(h.slice(0,64)), smallPrize: decUint(h.slice(64,128)), bigPrize: decUint(h.slice(128,192)),
        smallBps: Number(decUint(h.slice(192,256))), bigBps: Number(decUint(h.slice(256,320))),
        active: decUint(h.slice(320,384))===1n
      });
    }
    const r = decUint(await ethCall(CFG.CONTRACT,'0x'+SEL.minReserve));
    $('reserveVal').textContent = fmt(r);
    // 免费资格
    try{
      const perDay = decUint(await ethCall(CFG.CONTRACT,'0x'+SEL.freePerDay));
      const used = decUint(await ethCall(CFG.CONTRACT,'0x'+SEL.freeUsed));
      FREE_LEFT = (perDay - used).toString();
      FREE_OK = false; FREE_REASON = t('freeUsedUp');
      if(myAddr && !PAUSED && TIERS.length && POOL >= TIERS[0].bigPrize && used < perDay){
        const last = decUint(await ethCall(CFG.CONTRACT,'0x'+SEL.lastFreePlay+encAddr(myAddr)));
        const now = BigInt(Math.floor(Date.now()/1000));
        if(last === 0n || now >= last + 86400n){ FREE_OK = true; FREE_REASON=''; }
        else FREE_REASON = t('freeClaimed');
      }
    }catch(e){ console.log('free err', e); }
  }catch(e){ console.log('refresh err', e); }
  $('contractLink').href = CFG.explorer + '/address/' + CFG.CONTRACT;
  $('ownerPanel').classList.toggle('show', !!myAddr && myAddr.toLowerCase()===OWNER.toLowerCase());
  $('freeLeftN').textContent = FREE_LEFT;
  updateFreeBtn();
  render(); loadWins();
}
function render(){
  $('poolAmt').textContent = fmt(POOL);
  const tier = TIERS[tierIdx];
  const poolOk = tier && POOL >= tier.bigPrize && !PAUSED;
  $('poolSub').textContent = PAUSED ? t('paused') : (!tier ? '' : (POOL >= tier.bigPrize ? t('poolOk') : t('poolLow')));
  $('poolCard').classList.toggle('paused', PAUSED);
  // 档位按钮
  const te = $('tiers'); te.innerHTML='';
  TIERS.forEach((tr,i)=>{
    const b=document.createElement('div');
    b.className='tier'+(i===tierIdx?' on':'');
    b.innerHTML='<div class="b">'+fmt(tr.bet)+' LGNS</div><div class="p">win '+fmt(tr.smallPrize)+' / '+fmt(tr.bigPrize)+'</div>';
    b.onclick=()=>{ tierIdx=i; render(); };
    te.appendChild(b);
  });
  // 奖项表
  let rows='';
  if(tier){
    rows='<div class="pr"><span>'+(tier.bigBps/100)+'%</span><b>+'+fmt(tier.bigPrize)+' LGNS</b></div>'
        +'<div class="pr"><span>'+(tier.smallBps/100)+'%</span><b>+'+fmt(tier.smallPrize)+' LGNS</b></div>'
        +'<div class="pr"><span>'+((10000-tier.bigBps-tier.smallBps)/100)+'%</span><b>'+t('loseRow')+'</b></div>';
  }
  $('ptRows').innerHTML = rows;
  updateBuyBtn();
}
async function needApprove(){
  if(!myAddr || !TIERS[tierIdx]) return false;
  const al = decUint(await ethCall(CFG.token,'0x'+SEL.allowance+encAddr(myAddr)+encAddr(CFG.CONTRACT)));
  return al < TIERS[tierIdx].bet;
}
async function updateBuyBtn(){
  const btn=$('buyBtn'), txt=$('buyTxt');
  if(busy){ btn.disabled=true; txt.textContent=t('processing'); return; }
  const tier=TIERS[tierIdx];
  if(!tier){ btn.disabled=true; txt.textContent=t('loading'); return; }
  if(PAUSED){ btn.disabled=true; txt.textContent=t('paused'); return; }
  if(POOL < tier.bigPrize){ btn.disabled=true; txt.textContent=t('needPool'); return; }
  btn.disabled=false;
  if(!myAddr){ txt.textContent=t('stepConnect'); return; }
  try{ txt.textContent = (await needApprove()) ? t('approve') : t('buy')+' · '+fmt(tier.bet)+' LGNS'; }
  catch(e){ txt.textContent = t('approve'); }
}

/* ===== 交易 ===== */
async function sendTx(to,d){
  const tx={from:myAddr,to,data:d,type:'0x0'};
  tx.gasPrice = await req('eth_gasPrice',[]);
  const hash = await req('eth_sendTransaction',[tx]);
  toast(t('txSent'));
  for(let i=0;i<150;i++){
    await new Promise(r=>setTimeout(r,2000));
    const rc = await req('eth_getTransactionReceipt',[hash]);
    if(rc && rc.blockNumber && rc.blockNumber!=='0x0'){
      if(rc.status==='0x1') return rc;
      throw new Error(t('txReverted'));
    }
  }
  throw new Error('timeout');
}
async function mainAction(){
  if(busy) return;
  try{
    if(!myAddr){ await connect(); return; }
    busy=true; updateBuyBtn();
    const tier=TIERS[tierIdx];
    if(await needApprove()){
      await sendTx(CFG.token,'0x'+SEL.approve+encAddr(CFG.CONTRACT)+encUint(tier.bet));
    }else{
      await doPlay();
    }
  }catch(e){ toast(e.message); }
  finally{ busy=false; updateBuyBtn(); refresh(); }
}
$('buyBtn').onclick = mainAction;
async function doPlay(){
  const rc = await sendTx(CFG.CONTRACT,'0x'+SEL.play+encUint(tierIdx));
  let prize=0n;
  for(const log of (rc.logs||[])){
    if(log.address && log.address.toLowerCase()===CFG.CONTRACT.toLowerCase()
       && log.topics && log.topics[0] && log.topics[0].toLowerCase()===PLAYED_TOPIC){
      const data=(log.data||'0x').replace(/^0x/,'');
      prize=decUint(data.slice(64,128));
    }
  }
  showCard(prize);
}

/* ===== 刮刮卡 ===== */
let cv=$('cover'), ctx=cv.getContext('2d'), W=0,H=0, down=false, strokes=0, revealed=false, lastPrize=0n, lastBet=0n;
function sizeCanvas(){
  const r=$('cardwrap').getBoundingClientRect();
  W=cv.width=Math.floor(r.width*2); H=cv.height=380; cv.style.height='190px';
}
function paintCover(){
  ctx.globalCompositeOperation='source-over';
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#d9b96e');g.addColorStop(.5,'#c39a4a');g.addColorStop(1,'#a8823f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.92)';ctx.textAlign='center';
  ctx.font='700 44px serif';
  ctx.fillText(LANG==='zh'?'刮开见分晓':'SCRATCH TO REVEAL',W/2,H/2+8);
  ctx.font='28px serif';ctx.fillStyle='rgba(255,255,255,.7)';
  ctx.fillText(LANG==='zh'?'👆 滑动刮开':'👆 swipe to scratch',W/2,H/2+58);
}
function showCard(prize){
  lastPrize=prize; lastBet=TIERS[tierIdx].bet; revealed=false; strokes=0;
  $('v-amt').textContent=''; $('v-msg').textContent='';
  $('cardwrap').classList.add('show');
  sizeCanvas(); paintCover();
  $('hint').style.display='block'; $('hint').textContent=t('scratchHint');
  $('againBtn').style.display='none';
  $('cardwrap').scrollIntoView({behavior:'smooth',block:'center'});
}
function eraseAt(cx,cy){
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath();ctx.arc(cx,cy,46,0,7);ctx.fill();
  ctx.globalCompositeOperation='source-over';
  if(++strokes%6===0)checkDone();
}
cv.addEventListener('pointerdown',e=>{down=true;const r=cv.getBoundingClientRect();eraseAt((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));e.preventDefault();});
window.addEventListener('pointermove',e=>{if(!down)return;const r=cv.getBoundingClientRect();eraseAt((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));});
window.addEventListener('pointerup',()=>{if(down){down=false;checkDone();}});
function checkDone(){
  if(revealed||!W)return;
  const d=ctx.getImageData(0,0,W,H).data;let clear=0,total=0;
  for(let i=3;i<d.length;i+=32){total++;if(d[i]===0)clear++;}
  if(clear/total>0.4)reveal();
}
function reveal(){
  revealed=true;ctx.clearRect(0,0,W,H);
  if(lastPrize>0n){
    $('v-amt').textContent='+'+fmt(lastPrize)+' LGNS';
    $('v-msg').textContent = lastPrize>=lastBet*4n ? t('winB') : t('winS');
    boom();
  }else{ $('v-amt').textContent='0'; $('v-msg').textContent=t('lose'); }
  $('hint').style.display='none';
  const ab=$('againBtn');ab.style.display='block';ab.textContent=t('again');
}
function boom(){
  const w=$('cardwrap'),cols=['#C9A86A','#5C1A27','#F5E9C8','#e74c3c','#2ecc71'];
  for(let i=0;i<36;i++){
    const s=document.createElement('div');s.className='cfetti';
    s.style.left=(Math.random()*100)+'%';s.style.background=cols[i%cols.length];
    s.style.animationDelay=(Math.random()*0.5)+'s';w.appendChild(s);
    setTimeout(()=>s.remove(),2400);
  }
}
$('againBtn').onclick=()=>{ if(!busy) mainAction(); };

/* ===== 免费刮 ===== */
function updateFreeBtn(){
  const btn=$('freeBtn'), txt=$('freeTxt');
  if(busy){ btn.disabled=true; txt.textContent=t('processing'); return; }
  if(!myAddr){ btn.disabled=true; txt.textContent=t('stepConnect'); return; }
  if(FREE_OK){ btn.disabled=false; txt.textContent=t('freeBtn'); }
  else{ btn.disabled=true; txt.textContent=FREE_REASON||t('freeUsedUp'); }
}
async function doFreePlay(){
  const rc = await sendTx(CFG.CONTRACT,'0x'+SEL.playFree);
  let prize=0n;
  for(const log of (rc.logs||[])){
    if(log.address && log.address.toLowerCase()===CFG.CONTRACT.toLowerCase()
       && log.topics && log.topics[0] && log.topics[0].toLowerCase()===PLAYEDFREE_TOPIC){
      const data=(log.data||'0x').replace(/^0x/,'');
      prize=decUint(data.slice(0,64));
    }
  }
  tierIdx=0;
  showCard(prize);
}
$('freeBtn').onclick=async()=>{
  if(busy||!FREE_OK) return;
  try{ busy=true; updateFreeBtn(); await doFreePlay(); }
  catch(e){ toast(e.message); }
  finally{ busy=false; updateFreeBtn(); refresh(); }
};

/* ===== 最新中奖 ===== */
async function loadWins(){
  try{
    const latest=parseInt(await req('eth_blockNumber',[]),16);
    let logs=[];
    for(let i=0;i<2;i++){
      const from='0x'+Math.max(0,latest-(i+1)*4000).toString(16);
      const to='0x'+(latest-i*4000).toString(16);
      const r=await req('eth_getLogs',[{address:CFG.CONTRACT,topics:[PLAYED_TOPIC],fromBlock:from,toBlock:to}]);
      logs=logs.concat(r||[]);
    }
    logs.sort((a,b)=>parseInt(b.blockNumber,16)-parseInt(a.blockNumber,16));
    const rows=logs.slice(0,8).map(l=>{
      const player='0x'+l.topics[1].slice(26);
      const data=(l.data||'0x').replace(/^0x/,'');
      const prize=decUint(data.slice(64,128));
      return '<div class="wr"><span>'+short(player)+'</span><b>'+(prize>0n?'+'+fmt(prize)+' LGNS':t('loseRow'))+'</b></div>';
    });
    $('winRows').innerHTML = rows.length?rows.join(''):'<div style="color:#a08c6a">'+t('noWins')+'</div>';
  }catch(e){ $('winRows').innerHTML='<div style="color:#a08c6a">'+t('noWins')+'</div>'; }
}

/* ===== 管理员 ===== */
async function ownerTx(sel,amt){
  if(busy)return;
  try{
    busy=true;
    const v=parseUnits(amt||'0',CFG.decimals);
    if(sel===SEL.seedPool){
      const al=decUint(await ethCall(CFG.token,'0x'+SEL.allowance+encAddr(myAddr)+encAddr(CFG.CONTRACT)));
      if(al<v) await sendTx(CFG.token,'0x'+SEL.approve+encAddr(CFG.CONTRACT)+encUint(v));
    }
    await sendTx(CFG.CONTRACT,'0x'+sel+encUint(v));
  }catch(e){ toast(e.message); }
  finally{ busy=false; refresh(); }
}
$('seedBtn').onclick=()=>ownerTx(SEL.seedPool,$('seedAmt').value);
$('skimBtn').onclick=()=>ownerTx(SEL.skim,$('skimAmt').value);
$('reserveBtn').onclick=()=>ownerTx(SEL.setMinReserve,$('reserveAmt').value);
$('pauseBtn').onclick=async()=>{ if(!busy){busy=true;try{await sendTx(CFG.CONTRACT,'0x'+SEL.setPaused+encUint(1));}catch(e){toast(e.message);}busy=false;refresh();} };
$('unpauseBtn').onclick=async()=>{ if(!busy){busy=true;try{await sendTx(CFG.CONTRACT,'0x'+SEL.setPaused+encUint(0));}catch(e){toast(e.message);}busy=false;refresh();} };

/* ===== 启动 ===== */
applyI18n(); render(); refresh();
if(window.ethereum){
  window.ethereum.on('accountsChanged',a=>{myAddr=a[0]||null;updateWalletBtn();refresh();});
}
</script>
