<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>炸金花 dealer 授权</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
<style>
body{font-family:system-ui;background:#0e1512;color:#e9f1ea;max-width:480px;margin:40px auto;padding:20px;text-align:center}
button{background:#e8c15a;border:none;border-radius:10px;padding:14px 32px;font-size:16px;font-weight:700;cursor:pointer;margin:10px}
button:disabled{opacity:.4}
.addr{font-size:12px;word-break:break-all;color:#8fa89a;background:#15201b;padding:10px;border-radius:8px;margin:10px 0}
#log{text-align:left;font-size:13px;margin-top:20px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>🃏 炸金花 dealer 授权</h2>
<p>把发牌权转给后端 bot，以后 3 人凑齐自动发牌</p>
<div class="addr">合约：0xaAeffB75Dd31F7a11595a2c9934505a76cc2e146<br>新 dealer：0xf47F405e30462768C41667BF94619222B5cE5726</div>
<button id="btn">连接钱包并授权</button>
<div id="log"></div>
<script>
const ROOM = "0xaAeffB75Dd31F7a11595a2c9934505a76cc2e146";
const NEW_DEALER = "0xf47F405e30462768C41667BF94619222B5cE5726";
const ABI = ["function setDealer(address d)", "function dealer() view returns (address)"];
const log = m => document.getElementById('log').textContent += m + "\n";

document.getElementById('btn').onclick = async () => {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  try {
    if (!window.ethereum) { log("❌ 没检测到钱包，请用 OKX 钱包浏览器打开"); return; }
    const provider = new ethers.BrowserProvider(window.ethereum);
    // 切到 Anubis
    try {
      await window.ethereum.request({method:'wallet_switchEthereumChain', params:[{chainId:'0x1a3a'}]});
    } catch(e) {
      await window.ethereum.request({method:'wallet_addEthereumChain', params:[{
        chainId:'0x1a3a', chainName:'Anubis',
        rpcUrls:['https://rpc.anubispace.org'],
        nativeCurrency:{name:'DAI', symbol:'DAI', decimals:18}
      }]});
    }
    const signer = await provider.getSigner();
    const addr = await signer.getAddress();
    log("钱包：" + addr);
    const c = new ethers.Contract(ROOM, ABI, signer);
    const cur = await c.dealer();
    log("当前 dealer：" + cur);
    if (cur.toLowerCase() === NEW_DEALER.toLowerCase()) { log("✅ 已经是 bot 了，不用调"); return; }
    log("发送 setDealer 交易，请在钱包确认...");
    const tx = await c.setDealer(NEW_DEALER, {type: 0});
    log("交易已发：" + tx.hash);
    await tx.wait();
    log("✅ dealer 已转给 bot！");
  } catch(e) {
    log("❌ " + (e.reason || e.message || e));
  }
  btn.disabled = false;
};
</script>
</body>
</html>
