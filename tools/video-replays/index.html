<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精品视频回放 · Web3Origin</title>
<meta name="robots" content="noindex,nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="起源精品视频回放">
<meta property="og:description" content="起源直播课程视频回放 · 带 PPT / 共享屏幕，点开即看">
<meta property="og:image" content="https://web3origin.com/assets/logo.png">
<link rel="icon" href="/assets/logo.png">
<style>
:root{--ob:#050303;--gold:#D6A84B;--gold-lt:#f0d48a;--bone:#F1DFC0;--ink:#e8d9be;--soft:#b79c74;--muted:#7c6a4f;--line:#3a2313;--green:#25C96F;--serif:"STZhongsong","Songti SC",Georgia,serif;--sans:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1100px 560px at 50% -8%,#0f2318,#050303 60%) fixed,#050303;color:var(--ink);font-family:var(--sans);line-height:1.7}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.top a.back{display:flex;align-items:center;gap:8px;color:var(--soft);text-decoration:none;font-size:14px}
.top a.back img{width:24px;height:24px}
.top .sp{margin-left:auto}
#langBtn{background:none;border:1px solid var(--line);color:var(--soft);border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer;font-family:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 70px}
.hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.hd .ic{font-size:26px;line-height:1}
h1{font-size:clamp(20px,4vw,27px);color:var(--gold-lt);margin:0;font-family:var(--serif);letter-spacing:.04em}
.sub{color:var(--soft);font-size:13.5px;margin:4px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0));border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s;text-align:left}
.card:hover,.card:focus{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 14px 32px rgba(0,0,0,.4);outline:none}
.card .thumb{position:relative;width:100%;aspect-ratio:16/9;background:#000 center/cover no-repeat}
.card .thumb .pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card .thumb .pl span{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--gold-lt),#b8842f);color:#1a1206;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 6px 18px rgba(214,168,75,.4);transition:.2s}
.card:hover .thumb .pl span{transform:scale(1.08)}
.card .thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:11.5px;padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.card .cb{padding:11px 13px 13px}
.card .ct{font-size:14.5px;color:var(--bone);font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cm{margin-top:5px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.card .tag{font-size:10.5px;padding:2px 7px;border-radius:999px;background:rgba(118,255,54,.12);color:var(--green);border:1px solid rgba(37,201,111,.4);font-weight:600}
.card .pv{color:var(--gold);font-weight:700}
.card .sh{position:absolute;right:8px;top:8px;z-index:3;width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.55);color:var(--gold-lt);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px);transition:.18s}
.card .sh:hover{background:rgba(214,168,75,.9);color:#1a1206;border-color:transparent}
.empty,.loading{text-align:center;color:var(--muted);padding:48px 16px;font-size:14px}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);z-index:10001;background:rgba(20,14,6,.97);border:1px solid var(--gold);color:var(--gold-lt);padding:11px 20px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 12px 30px rgba(0,0,0,.5);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* modal */
.modal{position:fixed;inset:0;z-index:9999;background:rgba(3,5,4,.88);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.mbox{width:min(1040px,96vw);background:#0b0906;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;max-height:94vh}
.mhd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line)}
.mhd .t{font-family:var(--serif);font-size:15.5px;color:var(--gold-lt);line-height:1.4;min-width:0;flex:1;word-break:break-word}
.mhd .sh{flex:0 0 auto;cursor:pointer;background:rgba(214,168,75,.12);border:1px solid var(--line);color:var(--gold-lt);border-radius:8px;padding:6px 12px;font:inherit;font-size:13.5px;white-space:nowrap}
.mhd .sh:hover{border-color:var(--gold)}
.mhd .x{flex:0 0 auto;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--bone);border-radius:8px;padding:6px 11px;font:inherit;font-size:14px}
.mhd .x:hover{border-color:var(--gold);color:var(--gold-lt)}
.mstage{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.mstage video,.mstage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
@media(max-width:600px){.modal{padding:0}.mbox{width:100vw;height:100vh;max-height:100vh;border-radius:0;border:0;justify-content:center}}
[data-lang]{display:none!important}html[lang^="zh"] [data-lang="zh"],html:not([lang^="zh"]) [data-lang="en"]{display:revert!important}
</style>
</head><body>
<div class="top">
  <a class="back" href="/tools/origin-monitor/"><img src="/assets/logo.png" alt=""><span data-lang="zh">← 返回起源百宝箱</span><span data-lang="en">← Back to Toolbox</span></a>
  <span class="sp"></span>
  <button id="langBtn" aria-label="Language">🌐</button>
</div>
<div class="wrap">
  <div class="hd"><span class="ic">🎬</span><div>
    <h1><span data-lang="zh">精品视频回放</span><span data-lang="en">Premium Video Replays</span></h1>
    <div class="sub"><span data-lang="zh">带 PPT / 共享屏幕的直播课程录像，点击任意一节即可在本页观看。<b style="color:var(--green)">限时免费</b>。</span><span data-lang="en">Recorded live sessions with slides / screen share. Tap any one to watch here. <b style="color:var(--green)">Free for now</b>.</span></div>
  </div></div>
  <div id="list" class="grid"><div class="loading" data-lang="zh">正在加载视频回放…</div><div class="loading" data-lang="en">Loading video replays…</div></div>
</div>

<div class="modal" id="modal"><div class="mbox">
  <div class="mhd"><span class="t" id="mtitle"></span><button class="sh" id="mshare"><span data-lang="zh">↗ 分享</span><span data-lang="en">↗ Share</span></button><button class="x" id="mclose" aria-label="close">✕</button></div>
  <div class="mstage" id="mstage"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var API="https://count.web3origin.com";
  var ZH=(document.documentElement.lang||"zh").slice(0,2)==="zh";
  var list=document.getElementById("list");
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function two(n){return (n<10?"0":"")+n;}
  function fmtClock(ts){if(!ts)return"";var d=new Date(ts*1000);return d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate())+" "+two(d.getHours())+":"+two(d.getMinutes());}
  function fmtDur(s){s=parseInt(s,10)||0;if(!s)return"";var m=Math.round(s/60);if(m<60)return m+(ZH?" 分钟":" min");var h=Math.floor(m/60),mm=m%60;return h+(ZH?" 小时":"h")+(mm?(" "+mm+(ZH?" 分":"m")):"");}
  function safeUrl(u){u=String(u||"");return /^https:\/\//i.test(u)?u:"";}
  function safeCover(u){u=String(u||"");return /^https:\/\//i.test(u)?u:"";}

  var modal=document.getElementById("modal"),mstage=document.getElementById("mstage"),mtitle=document.getElementById("mtitle");
  var curItem=null, ITEMS=[];
  function closeModal(){modal.classList.remove("on");mstage.innerHTML="";document.body.style.overflow="";curItem=null;}
  document.getElementById("mclose").onclick=closeModal;
  modal.addEventListener("click",function(e){if(e.target===modal)closeModal();});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});
  var toastEl=document.getElementById("toast"),toastT;
  function showToast(msg){toastEl.textContent=msg;toastEl.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove("on");},2600);}
  function shareVideo(item){
    if(!item)return;
    var link=location.origin+location.pathname+"?v="+encodeURIComponent(item.ticket_id||"");
    var title=ZH?"起源视频回放":"Origin video replay";
    var txt=(ZH?"🎬 起源课程视频回放 · ":"Origin class video · ")+(item._label||"");
    if(navigator.share){navigator.share({title:title,text:txt,url:link}).catch(function(){});return;}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(link).then(function(){showToast(ZH?"链接已复制，粘贴到微信发给好友即可观看":"Link copied");}).catch(function(){window.prompt(ZH?"复制此链接分享：":"Copy link:",link);});return;}
    window.prompt(ZH?"复制此链接分享：":"Copy link:",link);
  }
  document.getElementById("mshare").onclick=function(){shareVideo(curItem);};
  function openPlay(item){
    var url=safeUrl(item.play_url);if(!url)return;
    curItem=item;
    mtitle.textContent=item._label||"";
    if(item.kind==="embed"){mstage.innerHTML='<iframe src="'+esc(url)+'" allow="autoplay;fullscreen;picture-in-picture;encrypted-media" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>';}
    else{mstage.innerHTML='<video controls playsinline autoplay preload="metadata"'+(item.cover?' poster="'+esc(safeCover(item.cover))+'"':'')+'><source src="'+esc(url)+'" type="video/mp4"></video>';}
    modal.classList.add("on");document.body.style.overflow="hidden";
    if(item.ticket_id){try{fetch(API+"/live/replays/play?ticket="+encodeURIComponent(item.ticket_id),{method:"POST"}).catch(function(){});}catch(e){}}
  }

  function render(items){
    ITEMS=items||[];
    if(!items.length){list.innerHTML='<div class="empty" style="grid-column:1/-1">'+esc(ZH?"暂无视频回放。带 PPT / 画面的课程录制后会自动出现在这里。":"No video replays yet. Sessions with slides/video will appear here after recording.")+'</div>';return;}
    list.innerHTML="";
    items.forEach(function(c){
      var url=safeUrl(c.play_url);if(!url)return;
      var cov=safeCover(c.cover),when=c.live_time?fmtClock(c.live_time):"",dur=fmtDur(c.duration),plays=Number(c.plays)||0;
      var ttl=String(c.title||"").trim();
      c._label=ttl||when||(ZH?"视频回放":"Video replay");
      var el=document.createElement("div");
      el.className="card";el.setAttribute("tabindex","0");el.setAttribute("role","button");
      el.innerHTML='<div class="thumb"'+(cov?' style="background-image:url(\''+esc(cov)+'\')"':'')+'><div class="pl"><span>▶</span></div>'+(dur?'<span class="dur">'+esc(dur)+'</span>':'')+'<button class="sh" type="button" aria-label="'+(ZH?"分享":"share")+'" title="'+(ZH?"分享/转发":"Share")+'">↗</button></div>'
        +'<div class="cb"><div class="ct">'+esc(c._label)+'</div>'
        +'<div class="cm">'+((when&&ttl)?'<span>'+esc(when)+'</span>':'')+'<span class="tag">'+(ZH?"▶ 视频":"▶ Video")+'</span><span class="pv">▶ '+plays+(ZH?" 次":"")+'</span></div></div>';
      var go=function(){openPlay(c);};
      el.addEventListener("click",go);
      el.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
      var sb=el.querySelector(".sh");
      if(sb)sb.addEventListener("click",function(e){e.stopPropagation();shareVideo(c);});
      list.appendChild(el);
    });
  }

  fetch(API+"/live/replays?limit=200").then(function(r){return r.json();}).then(function(r){
    if(!r||!r.ok){render([]);return;}
    var vids=(r.replays||[]).filter(function(c){return c&&c.play_url&&(c.kind==="video"||c.kind==="embed");});
    render(vids);
    // 分享链接 ?v=<ticket> 打开时自动播放那条
    try{var q=new URLSearchParams(location.search).get("v");if(q){var it=vids.filter(function(c){return c.ticket_id===q;})[0];if(it)openPlay(it);}}catch(e){}
  }).catch(function(){list.innerHTML='<div class="empty" style="grid-column:1/-1">'+esc(ZH?"加载失败，稍后再试。":"Failed to load, try again later.")+'</div>';});
})();
</script>
<script src="/i18n.js"></script>
</body></html>
