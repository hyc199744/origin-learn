<script>
"use strict";
/* ================== 配置（合约/池/RPC/decimals，换池换币只改这里，不改逻辑） ================== */
var TOKENS = [
  { key:"polygon_lgns", name:"LGNS", chain:"Polygon", chainTag:"POL", chainId:137, badge:"L", bg:"#a78bfa",
    rpcs:["https://polygon-bor-rpc.publicnode.com","https://polygon.drpc.org"],
    pair:"0x882df4B0fB50a229C3B4124EB18c759911485bFb", token:"0xeb51d9a39ad5eef215dc0bf39a8821ff804a0f01",
    quoteIsToken0:true, quoteDec:18, baseDec:9, quoteSym:"DAI", poolName:"LGNS / DAI",
    explorer:"https://polygonscan.com", source:"Polygon 链上 LGNS/DAI 池",
    gecko:"https://api.geckoterminal.com/api/v2/networks/polygon_pos/pools/0x882df4B0fB50a229C3B4124EB18c759911485bFb" }
];
var FX_URLS=["https://open.er-api.com/v6/latest/USD","https://api.exchangerate.host/latest?base=USD&symbols=CNY"];

/* ================== 状态 ================== */
var state={}; TOKENS.forEach(function(t){ state[t.key]={def:t,price:null,change24h:null,tvl:null,updatedAt:0,anomaly:false,block:null}; });
var fx=null;

/* ================== 工具 ================== */
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function fmtUsd(p){ if(p==null)return "—"; if(p>=1000)return p.toLocaleString("en-US",{maximumFractionDigits:0}); if(p>=1)return p.toFixed(4); if(p>=0.01)return p.toFixed(5); return p.toPrecision(3); }
function fmtCny(p){ if(p==null||fx==null)return "≈ ¥ —"; var v=p*fx; return "≈ ¥ "+(v>=1000?v.toLocaleString("en-US",{maximumFractionDigits:0}):v.toFixed(2)); }
function shortAddr(a){ return a?a.slice(0,7)+"…"+a.slice(-5):"—"; }
function hhmmss(ts){ if(!ts)return "—"; var d=new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0"); }
function statusOf(ts){ if(!ts)return {cls:"",label:"获取中"}; var age=Date.now()-ts; if(age<30000)return{cls:"g",label:"实时"}; if(age<180000)return{cls:"a",label:"延迟"}; return{cls:"r",label:"数据异常"}; }

function withTimeout(ms){ var c=new AbortController(); setTimeout(function(){c.abort();},ms); return c; }
async function ethCall(rpcs,to,data,block){
  for(var i=0;i<rpcs.length;i++){
    try{
      var c=withTimeout(9000);
      var r=await fetch(rpcs[i],{method:"POST",headers:{"Content-Type":"application/json"},signal:c.signal,
        body:JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_call",params:[{to:to,data:data},block||"latest"]})});
      var j=await r.json();
      if(j&&j.result&&j.result!=="0x")return j.result;
    }catch(e){}
  }
  return null;
}
var _headCache={};
async function latestBlock(rpcs){
  var ck=rpcs[0]; var c=_headCache[ck]; if(c&&Date.now()-c.at<20000)return c.v;
  for(var i=0;i<rpcs.length;i++){ try{ var ac=withTimeout(8000);
    var r=await fetch(rpcs[i],{method:"POST",headers:{"Content-Type":"application/json"},signal:ac.signal,body:JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_getBlockByNumber",params:["latest",false]})});
    var j=await r.json(); if(j&&j.result){ var v={number:parseInt(j.result.number,16),ts:parseInt(j.result.timestamp,16)}; _headCache[ck]={at:Date.now(),v:v}; return v; } }catch(e){} }
  return null;
}

/* ===== 历史序列(走势图):Polygon走GeckoTerminal K线, Anubis走链上历史储备重建 ===== */
var SPAN={ "1h":3600, "24h":86400, "7d":604800, "30d":2592000 };       // Anubis按块(≈1s/块)
var GTF={ "1h":["minute",1,60], "24h":["hour",1,24], "7d":["hour",6,28], "30d":["day",1,30] };
async function geckoOhlcv(t,tf){
  var m=GTF[tf]; try{ var c=withTimeout(12000);
    var j=await (await fetch(t.gecko+"/ohlcv/"+m[0]+"?aggregate="+m[1]+"&limit="+m[2],{signal:c.signal})).json();
    var list=j&&j.data&&j.data.attributes&&j.data.attributes.ohlcv_list; if(!list||!list.length)return null;
    return list.map(function(k){return {t:k[0]*1000,p:+k[4]};}).sort(function(a,b){return a.t-b.t;});
  }catch(e){return null;}
}
async function anubisHist(t,tf,N){
  var span=SPAN[tf]; var head=await latestBlock(t.rpcs); if(!head)return null;
  var refDef=t.quoteRefKey?state[t.quoteRefKey].def:null;
  var blocks=[]; for(var i=0;i<N;i++){ blocks.push(Math.max(1,head.number-span+Math.round(i*span/(N-1)))); }
  var out=[];
  for(var b=0;b<blocks.length;b+=6){
    var rr=await Promise.all(blocks.slice(b,b+6).map(async function(bn){
      var tag="0x"+bn.toString(16);
      var hex=await ethCall(t.rpcs,t.pair,"0x0902f1ac",tag); var pr=hex&&priceFrom(t,reservesFromHex(hex)); if(!pr)return null;
      var qUsd=1; if(refDef){ var h2=await ethCall(refDef.rpcs,refDef.pair,"0x0902f1ac",tag); var pr2=h2&&priceFrom(refDef,reservesFromHex(h2)); if(!pr2)return null; qUsd=pr2.priceInQuote; }
      return { t:(head.ts-(head.number-bn))*1000, p:pr.priceInQuote*qUsd };
    }));
    rr.forEach(function(x){if(x)out.push(x);});
  }
  out.sort(function(a,b){return a.t-b.t;});
  return out.length>=2?out:null;
}
function history(t,tf,N){ return t.gecko?geckoOhlcv(t,tf):anubisHist(t,tf,N||30); }

/* 纯手绘 SVG 曲线(无图表库) */
function svgChart(ser,w,h,color,fill){
  if(!ser||ser.length<2)return '<div style="color:var(--faint);font-size:11px;text-align:center;padding:'+Math.max(8,(h/2-8))+'px 0">历史数据积累中…</div>';
  var ps=ser.map(function(d){return d.p;}), min=Math.min.apply(null,ps), max=Math.max.apply(null,ps), rng=(max-min)||Math.abs(max)||1, n=ser.length;
  function X(i){return (i/(n-1))*(w-2)+1;} function Y(p){return h-2-((p-min)/rng)*(h-4);}
  var pts=ser.map(function(d,i){return X(i).toFixed(1)+","+Y(d.p).toFixed(1);}).join(" ");
  var up=ser[n-1].p>=ser[0].p, stroke=color||(up?"#4ade80":"#f87171");
  var area=fill?'<polygon points="'+X(0).toFixed(1)+','+(h-1)+' '+pts+' '+X(n-1).toFixed(1)+','+(h-1)+'" fill="'+stroke+'" opacity="0.13"/>':'';
  var dot=fill?'<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(ser[n-1].p).toFixed(1)+'" r="2.6" fill="'+stroke+'"/>':'';
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" style="display:block">'+area+'<polyline points="'+pts+'" fill="none" stroke="'+stroke+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>'+dot+'</svg>';
}
/* 卡片迷你曲线:顺序加载(24h,少点),避免并发打爆RPC */
async function loadSparklines(){
  for(var i=0;i<TOKENS.length;i++){ var t=TOKENS[i]; if(t.unavailable)continue;
    try{ var ser=await history(t,"24h",16); if(ser){ state[t.key].spark=ser; render(); } }catch(e){}
  }
}
async function blockNumber(rpcs){
  for(var i=0;i<rpcs.length;i++){ try{ var c=withTimeout(8000);
    var r=await fetch(rpcs[i],{method:"POST",headers:{"Content-Type":"application/json"},signal:c.signal,body:JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_blockNumber",params:[]})});
    var j=await r.json(); if(j&&j.result)return parseInt(j.result,16); }catch(e){} }
  return null;
}
function reservesFromHex(hex){
  hex=(hex||"").replace(/^0x/,""); if(hex.length<128)return null;
  return { r0:BigInt("0x"+hex.slice(0,64)), r1:BigInt("0x"+hex.slice(64,128)) };
}
function priceFrom(def,res){
  var q=def.quoteIsToken0?res.r0:res.r1, b=def.quoteIsToken0?res.r1:res.r0;
  var quote=Number(q)/Math.pow(10,def.quoteDec), base=Number(b)/Math.pow(10,def.baseDec);
  if(base<=0)return null;
  return { priceInQuote:quote/base, tvlInQuote:quote*2 };  // 以“计价币”为单位;稳定币=美元,LGNS则再乘LGNS价
}
// 计价币的美元价:稳定币记 1;若挂靠另一代币(如 fLGNS 以 LGNS 计价)则取该币现价
function quoteUsdFor(t){ if(t.quoteRefKey){ var r=state[t.quoteRefKey]; return (r&&r.price!=null)?r.price:null; } return 1; }

/* 单个代币取价（含异常保护：单次跳变>30% 复核一次） */
async function fetchToken(t){
  var s=state[t.key]; if(t.unavailable)return;
  var hex=await ethCall(t.rpcs,t.pair,"0x0902f1ac"); var res=hex&&reservesFromHex(hex); var pr=res&&priceFrom(t,res);
  var qUsd=quoteUsdFor(t);
  if(!pr||qUsd==null){ return; } // 取不到(或依赖的计价币价未就绪)就保留上次，状态会转“延迟/异常”
  var np=pr.priceInQuote*qUsd;
  if(s.price!=null && s.price>0){
    var chg=Math.abs(np-s.price)/s.price;
    if(chg>0.30){ // 跳变过大：再取一次确认
      var hex2=await ethCall(t.rpcs,t.pair,"0x0902f1ac"); var pr2=hex2&&priceFrom(t,reservesFromHex(hex2));
      if(pr2 && Math.abs(pr2.price-np)/np<0.15){ s.anomaly=false; } // 两次一致→真实变动，接受
      else { s.anomaly=true; render(); return; }                  // 无法确认→保留旧价+标异常
    } else { s.anomaly=false; }
  }
  s.price=np; s.priceInQuote=pr.priceInQuote; s.tvl=pr.tvlInQuote*qUsd; s.updatedAt=Date.now();
  pushHistory(t.key,np);
  if(!t.gecko) s.change24h=change24hLocal(t.key,np); // 有GT的走GT
  render();
}

/* 24h：有GeckoTerminal的用GT真实24h；其余用本地滚动样本（首日积累中） */
function pushHistory(key,price){
  try{ var k="mkt_hist_"+key; var a=JSON.parse(localStorage.getItem(k)||"[]");
    var now=Date.now(); if(!a.length||now-a[a.length-1].t>240000){ a.push({t:now,p:price}); }
    a=a.filter(function(x){return now-x.t<26*3600e3;}); localStorage.setItem(k,JSON.stringify(a)); }catch(e){}
}
function change24hLocal(key,cur){
  try{ var a=JSON.parse(localStorage.getItem("mkt_hist_"+key)||"[]"); var target=Date.now()-24*3600e3; var best=null;
    for(var i=0;i<a.length;i++){ if(Math.abs(a[i].t-target)<2*3600e3){ if(!best||Math.abs(a[i].t-target)<Math.abs(best.t-target))best=a[i]; } }
    if(best&&best.p>0)return (cur-best.p)/best.p*100; }catch(e){}
  return null; // 积累中
}
async function fetchGecko(t){
  if(!t.gecko)return; try{ var c=withTimeout(9000); var r=await fetch(t.gecko,{signal:c.signal,headers:{Accept:"application/json"}}); var j=await r.json();
    var at=j&&j.data&&j.data.attributes; if(at){ var h=at.price_change_percentage&&at.price_change_percentage.h24;
      if(h!=null&&h!=="")state[t.key].change24h=parseFloat(h);
      if(at.reserve_in_usd)state[t.key].tvl=parseFloat(at.reserve_in_usd); render(); } }catch(e){}
}
async function fetchFx(){
  try{ var c=JSON.parse(localStorage.getItem("mkt_fx")||"null"); if(c&&Date.now()-c.t<3600e3){fx=c.v;return;} }catch(e){}
  for(var i=0;i<FX_URLS.length;i++){ try{ var ct=withTimeout(9000); var r=await fetch(FX_URLS[i],{signal:ct.signal}); var j=await r.json();
    var v=j&&j.rates&&j.rates.CNY; if(v){ fx=v; try{localStorage.setItem("mkt_fx",JSON.stringify({t:Date.now(),v:v}));}catch(e){} return; } }catch(e){} }
}

/* ================== 渲染 ================== */
function render(){
  var grid=document.getElementById("grid"); grid.innerHTML="";
  var newest=0;
  TOKENS.forEach(function(t){
    var s=state[t.key]; if(s.updatedAt>newest)newest=s.updatedAt;
    var card=el("div","card"+(t.unavailable?" na":""));
    card.style.setProperty("--accent",t.bg);
    var head='<div class="ch"><div class="badge">'+t.badge+'</div>'+
      '<div class="nm"><div class="t">'+t.name+'</div></div></div>';
    if(t.unavailable){
      card.innerHTML=head+'<div class="px" style="color:var(--dim);font-size:20px">—</div>'+
        '<div class="na-box">暂无公开交易池，无法按市场价定价</div>'+
        '<div class="meta"><div class="row"><span>数据来源</span><span class="v">'+t.source+'</span></div>'+
        '<div class="row"><span>状态</span><span class="v st"><span class="dot"></span>待配置</span></div></div>';
      card.addEventListener("click",function(){openModal(t.key);});
      card.addEventListener("keydown",function(e){if(e.key==="Enter")openModal(t.key);});
      grid.appendChild(card); return;
    }
    card.innerHTML=head+
      '<div class="px"><span class="u">$</span>'+fmtUsd(s.price)+'</div>'+
      '<div class="cny">'+fmtCny(s.price)+'</div>';
    grid.appendChild(card);
  });
  // 顶部总状态
  var g=statusOf(newest);
  document.getElementById("liveDot").className="dot "+g.cls;
  document.getElementById("liveTxt").textContent=(newest?("已更新 "+hhmmss(newest)+" · 每12秒"):"连接链上…");
}

/* ================== 详情弹窗 ================== */
function openModal(key){
  var s=state[key],t=s.def,m=document.getElementById("modal");
  var chg=s.change24h;
  var rows="";
  function row(k,v,mono){ return '<div class="kv"><span class="k">'+k+'</span><span class="v'+(mono?" mono":"")+'">'+v+'</span></div>'; }
  if(t.unavailable){
    m.innerHTML='<div class="mh"><div class="badge" style="background:'+t.bg+'">'+t.badge+'</div><div><div class="t" style="font-weight:800;color:var(--white)">'+t.name+'</div><div class="c" style="font-size:11px;color:var(--dim)">'+t.chain+'</div></div><button class="x" onclick="closeModal()">✕</button></div>'+
      '<div class="na-box" style="margin:10px 0 4px">'+t.note+'</div>'+
      row("代币合约",shortAddr(t.token)+'<span class="copy" data-c="'+t.token+'">复制</span>',true)+
      row("所在链",t.chain+" (chainId "+t.chainId+")")+
      '<a class="mbtn" href="'+t.explorer+'/address/'+t.token+'" target="_blank" rel="noopener">在区块浏览器查看 →</a>';
    bindCopy(m); document.getElementById("mask").classList.add("on"); return;
  }
  m.innerHTML='<div class="mh"><div class="badge" style="background:'+t.bg+'">'+t.badge+'</div>'+
    '<div><div class="t" style="font-weight:800;color:var(--white)">'+t.name+' · '+t.chain+'</div>'+
    '<div class="c" style="font-size:11px;color:var(--dim)">'+t.source+'</div></div>'+
    '<button class="x" onclick="closeModal()">✕</button></div>'+
    (t.note?'<div class="na-box" style="margin:8px 0 2px">'+t.note+'</div>':'')+
    '<div class="bigpx"><span style="font-size:18px;color:var(--dim)">$</span>'+fmtUsd(s.price)+'</div>'+
    '<div class="cny" style="margin-bottom:6px">'+fmtCny(s.price)+'</div>'+
    '<div class="tfbar" id="tfbar"></div><div class="chartbox" id="chartbox"><div class="loading">加载走势…</div></div>'+
    row("24H 涨跌", chg==null?'<span style="color:var(--dim)">积累中</span>':('<span style="color:'+(chg>=0?"var(--up)":"var(--down)")+'">'+(chg>=0?"+":"")+chg.toFixed(2)+'%</span>'))+
    row("主要交易池", t.poolName)+
    row("流动性 (TVL)", s.tvl!=null?("$"+Math.round(s.tvl).toLocaleString("en-US")):"—")+
    row("所在链", t.chain+" (chainId "+t.chainId+")")+
    row("代币合约", shortAddr(t.token)+'<span class="copy" data-c="'+t.token+'">复制</span>', true)+
    row("交易对合约", shortAddr(t.pair)+'<span class="copy" data-c="'+t.pair+'">复制</span>', true)+
    '<div class="kv"><span class="k">最后区块</span><span class="v" id="mblock">'+(s.block!=null?("#"+s.block):"…")+'</span></div>'+
    row("更新时间", hhmmss(s.updatedAt))+
    '<a class="mbtn" href="'+t.explorer+'/address/'+t.pair+'" target="_blank" rel="noopener">查看链上交易池 →</a>';
  bindCopy(m);
  document.getElementById("mask").classList.add("on");
  setupChart(key);
  blockNumber(t.rpcs).then(function(b){ if(b){ s.block=b; var be=document.getElementById("mblock"); if(be)be.textContent="#"+b; } });
}
/* ===== 详情走势图 ===== */
var TFS=[{k:"1h",l:"1H"},{k:"24h",l:"24H"},{k:"7d",l:"7D"},{k:"30d",l:"30D"}];
var curKey=null,curTf="24h";
function setupChart(key){
  curKey=key; curTf="24h";
  var bar=document.getElementById("tfbar"); if(!bar)return;
  bar.innerHTML=TFS.map(function(f){return '<button class="tf'+(f.k===curTf?" on":"")+'" data-tf="'+f.k+'">'+f.l+'</button>';}).join("");
  bar.querySelectorAll(".tf").forEach(function(btn){ btn.addEventListener("click",function(){
    curTf=btn.getAttribute("data-tf"); bar.querySelectorAll(".tf").forEach(function(b){b.classList.toggle("on",b===btn);}); drawModalChart(); }); });
  drawModalChart();
}
async function drawModalChart(){
  var key=curKey,tf=curTf,box=document.getElementById("chartbox"); if(!box)return;
  box.innerHTML='<div class="loading">加载走势…</div>';
  var ser=await history(state[key].def,tf,tf==="1h"?24:34);
  var cur=document.getElementById("chartbox"); if(cur!==box)return;               // 弹窗已关/切换
  if(curKey!==key||curTf!==tf)return;
  if(!ser||ser.length<2){ box.innerHTML='<div class="loading">该时间段暂无足够历史</div>'; return; }
  var ps=ser.map(function(d){return d.p;}), mn=Math.min.apply(null,ps), mx=Math.max.apply(null,ps);
  var first=ser[0].p, last=ser[ser.length-1].p, dchg=first>0?((last-first)/first*100):0;
  box.innerHTML=svgChart(ser,320,120,"#8fe36a",true)+
    '<div class="axr"><span>高 $'+fmtUsd(mx)+'</span><span style="color:'+(dchg>=0?"var(--up)":"var(--down)")+'">'+(dchg>=0?"+":"")+dchg.toFixed(2)+'%</span><span>低 $'+fmtUsd(mn)+'</span></div>';
}
function bindCopy(m){ m.querySelectorAll(".copy").forEach(function(c){ c.addEventListener("click",function(e){ e.stopPropagation(); try{navigator.clipboard.writeText(c.getAttribute("data-c"));c.textContent="已复制";setTimeout(function(){c.textContent="复制";},1200);}catch(x){} }); }); }
function closeModal(){ document.getElementById("mask").classList.remove("on"); }
document.getElementById("mask").addEventListener("click",function(e){ if(e.target===this)closeModal(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape")closeModal(); });

/* ================== 主循环 ================== */
async function tick(){
  await Promise.all(TOKENS.filter(function(t){return !t.quoteRefKey;}).map(fetchToken)); // 先算稳定币计价的(含 ANB LGNS)
  await Promise.all(TOKENS.filter(function(t){return t.quoteRefKey;}).map(fetchToken));  // 再算挂靠计价的(fLGNS 依赖 LGNS 价)
}
async function tickGecko(){ await Promise.all(TOKENS.map(fetchGecko)); }
render();
fetchFx();
tick(); tickGecko();
setInterval(tick, 12000);
setInterval(tickGecko, 60000);
setInterval(fetchFx, 3600000);
setInterval(render, 5000); // 刷新价格/顶部状态
</script>
</body>
