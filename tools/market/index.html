<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<script>try{if(location.search.indexOf("embed")>=0)document.documentElement.classList.add("embed");}catch(e){}</script>
<title>起源生态实时行情 · Web3Origin</title>
<meta name="description" content="LGNS(Polygon)、LGNS(Anubis)、gLGNS、fLGNS 实时价格与卖税后到手价，由链上流动性池储备实时计算。">
<link rel="canonical" href="https://web3origin.com/tools/market/">
<style>
:root{
  --pg:#f4f5f8;--card:#ffffff;--div:#eef0f4;--ink:#131722;--sub:#6b7280;
  --price:#0f1420;--tax-bg:#fdeaea;--tax-fg:#e0483d;--net:#16a34a;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--ink);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
html.embed,html.embed body{background:transparent}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px}
html.embed .wrap{padding:0}
.h{font-size:15px;font-weight:800;color:var(--ink);margin:0 0 12px}
html.embed .h{display:none}
.strip{background:var(--card);border:1px solid var(--div);border-radius:16px;box-shadow:0 2px 10px rgba(20,25,45,.05);
  display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden}
.tk{padding:14px 14px 13px;text-align:center;border-left:1px solid var(--div);min-width:0}
.tk:first-child{border-left:0}
.hd{display:inline-flex;align-items:center;gap:7px;justify-content:center;margin-bottom:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.nm{font-size:14.5px;font-weight:700;color:var(--sub)}
.px{font-size:23px;font-weight:800;color:var(--price);letter-spacing:-.4px;font-variant-numeric:tabular-nums;line-height:1.15;word-break:break-all}
.px .u{font-size:15px;color:#9aa1ad;margin-right:1px}
.tax{margin-top:7px;display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center}
.tp{font-size:11px;font-weight:700;color:var(--tax-fg);background:var(--tax-bg);border-radius:6px;padding:2px 7px;white-space:nowrap}
.net{font-size:13.5px;font-weight:800;color:var(--net);font-variant-numeric:tabular-nums}
.tp.na{color:var(--sub);background:#f1f2f5}
@media(max-width:560px){
  .strip{grid-template-columns:repeat(2,1fr)}
  .tk{padding:12px 8px}
  .tk:nth-child(odd){border-left:0}
  .tk:nth-child(n+3){border-top:1px solid var(--div)}
  .px{font-size:20px}
  .nm{font-size:13px}
  .net{font-size:12.5px}
  .tp{font-size:10px;padding:2px 6px}
}
.upd{margin-top:9px;font-size:10.5px;color:#9aa1ad;text-align:right;font-variant-numeric:tabular-nums}
html.embed .upd{margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h2 class="h">起源生态实时行情</h2>
  <div class="strip" id="strip"></div>
  <div class="upd" id="upd"></div>
</div>
<script>
"use strict";
var POL=["https://polygon-bor-rpc.publicnode.com","https://polygon.drpc.org"], ANB=["https://rpc.anubispace.org"];
/* 配置：换池/换币只改这里 */
var TOKENS=[
  { key:"pol",   label:"Polygon", dot:"#3b82f6", rpcs:POL, pair:"0x882df4B0fB50a229C3B4124EB18c759911485bFb",
    quoteIsToken0:true,  quoteDec:18, baseDec:9,  taxAddr:"0xeb51d9a39ad5eef215dc0bf39a8821ff804a0f01", hasTax:true },
  { key:"anb",   label:"Anubis",  dot:"#8b5cf6", rpcs:ANB, pair:"0x32A4586797E3f561F41C0F47CA57eD08D64f3dC0",
    quoteIsToken0:false, quoteDec:18, baseDec:9,  hasTax:true, taxFixed:0.40 },  // 链上feeRatio只读到5%(代理未开源),真实卖税40%(老板确认),故用固定值
  { key:"glgns", label:"gLGNS",   dot:"#22c55e", rpcs:ANB, pair:"0x8c4Ea5dAC01E2E8Fb67F50201Aa2e10A6949C58D",
    quoteIsToken0:true,  quoteDec:18, baseDec:18, taxAddr:"0xf140a92C156e76F5A1d3D6f96284b250330F8F4c", hasTax:true },
  { key:"flgns", label:"fLGNS",   dot:"#38bdf8", rpcs:ANB, pair:"0x4171222dfb000f1b9a2e7fb9c213f3b7c656ba9f",
    quoteIsToken0:true,  quoteDec:9,  baseDec:18, quoteRefKey:"anb", hasTax:false }
];
var st={}; TOKENS.forEach(function(t){ st[t.key]={def:t,price:null,tax:null}; });

function withTimeout(ms){var c=new AbortController();setTimeout(function(){c.abort();},ms);return c;}
async function ethCall(rpcs,to,data){
  for(var i=0;i<rpcs.length;i++){ try{ var c=withTimeout(9000);
    var r=await fetch(rpcs[i],{method:"POST",headers:{"Content-Type":"application/json"},signal:c.signal,
      body:JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_call",params:[{to:to,data:data},"latest"]})});
    var j=await r.json(); if(j&&j.result&&j.result!=="0x")return j.result; }catch(e){} }
  return null;
}
function bn(hex,slice0,slice1){ hex=(hex||"").replace(/^0x/,""); if(hex.length<slice1)return null; return BigInt("0x"+hex.slice(slice0,slice1)); }
function priceOf(t,hex){
  hex=(hex||"").replace(/^0x/,""); if(hex.length<128)return null;
  var r0=BigInt("0x"+hex.slice(0,64)), r1=BigInt("0x"+hex.slice(64,128));
  var q=t.quoteIsToken0?r0:r1, b=t.quoteIsToken0?r1:r0;
  var quote=Number(q)/Math.pow(10,t.quoteDec), base=Number(b)/Math.pow(10,t.baseDec);
  return base>0?quote/base:null;
}
function quoteUsd(t){ if(t.quoteRefKey){ var r=st[t.quoteRefKey]; return (r&&r.price!=null)?r.price:null; } return 1; }

async function readTax(t){
  if(!t.hasTax){ return; }
  if(t.taxFixed!=null){ st[t.key].tax=t.taxFixed; return; }   // 配置固定卖税(链上读不到真实值时)
  var fr=await ethCall(t.rpcs,t.taxAddr,"0x41744dd4");        // feeRatio()
  var pr=await ethCall(t.rpcs,t.taxAddr,"0xaaf5eb68");        // PRECISION()
  var f=bn(fr,0,64), p=bn(pr,0,64);
  if(f!=null&&p!=null&&p>0n){ st[t.key].tax=Number(f)/Number(p); }
}
async function readPrice(t){
  var hex=await ethCall(t.rpcs,t.pair,"0x0902f1ac"); var pq=hex&&priceOf(t,hex);
  var qu=quoteUsd(t); if(pq==null||qu==null)return;
  st[t.key].price=pq*qu;
}
function fmt(p){ if(p==null)return "—"; return p.toFixed(4); }
function render(){
  var box=document.getElementById("strip"); box.innerHTML="";
  TOKENS.forEach(function(t){
    var s=st[t.key], d=document.createElement("div"); d.className="tk";
    var taxHtml="";
    if(t.hasTax){
      if(s.tax!=null){
        var pct=(s.tax*100); pct=(pct%1===0)?pct.toFixed(0):pct.toFixed(1);
        var net=(s.price!=null)?("$"+fmt(s.price*(1-s.tax))):"—";
        taxHtml='<div class="tax"><span class="tp">卖税 '+pct+'%</span><span class="net">'+net+'</span></div>';
      } else {
        taxHtml='<div class="tax"><span class="tp na">卖税 …</span></div>';
      }
    } else {
      taxHtml='<div class="tax"><span class="tp na">卖税 —</span></div>';
    }
    d.innerHTML='<div class="hd"><span class="dot" style="background:'+t.dot+'"></span><span class="nm">'+t.label+'</span></div>'+
      '<div class="px"><span class="u">$</span>'+fmt(s.price)+'</div>'+taxHtml;
    box.appendChild(d);
  });
  var now=new Date();
  document.getElementById("upd").textContent="更新 "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")+":"+String(now.getSeconds()).padStart(2,"0");
  reportH();
}
function reportH(){ try{ if(window.parent&&window.parent!==window){ var h=Math.ceil(Math.max(document.body.scrollHeight,document.documentElement.scrollHeight)); window.parent.postMessage({__mkt:1,h:h},"*"); } }catch(e){} }

async function tickPrice(){
  await Promise.all(TOKENS.filter(function(t){return !t.quoteRefKey;}).map(readPrice));
  await Promise.all(TOKENS.filter(function(t){return t.quoteRefKey;}).map(readPrice));
  render();
}
render();
Promise.all(TOKENS.map(readTax)).then(render);
tickPrice();
setInterval(tickPrice, 12000);
window.addEventListener("load",reportH); window.addEventListener("resize",reportH);
setTimeout(reportH,300); setTimeout(reportH,1200);
</script>
</body>
</html>
