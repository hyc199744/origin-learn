<html lang="zh-CN">

<style>
:root{--bg:#08090c;--tile:#12151b;--tile2:#181d25;--line:#222833;--acc:#8fe36a;--acc2:#b6f36a;--gold2:#8fe36a;--txt:#e8edf2;--white:#fff;--dim:#8a94a1;--soft:#c2cad4;--green:#8fe36a;--red:#ff8b63;--blue:#8fd4ff;--poly:#b79bf0}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(700px 420px at 88% -6%,rgba(143,227,106,.09),transparent),var(--bg);color:var(--txt);font:14.5px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:22px 15px 60px}
.top{margin-bottom:14px}
.top a.home{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--acc);text-decoration:none}
.top img{height:22px}
h1{font-size:23px;margin:0 0 3px;color:var(--white);font-weight:800}
h1 span{color:var(--white)}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:16px;line-height:1.6}
.qbox{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.qin{flex:1;min-width:200px;background:var(--tile);border:1px solid var(--line);color:var(--soft);border-radius:14px;padding:13px 15px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;min-height:46px}
.qbtn{background:linear-gradient(180deg,var(--acc2),var(--acc));border:none;color:#0c2405;border-radius:14px;padding:11px 24px;font-size:14.5px;font-weight:800;cursor:pointer;min-height:46px}
.qbtn:disabled{opacity:.55;cursor:default}
.qhint{color:var(--dim);font-size:12px;margin-bottom:14px}
.status{color:var(--dim);font-size:13px;min-height:20px;margin:6px 0 14px}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:middle}
/* ===== Bento 网格 ===== */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{background:var(--tile);border:1px solid var(--line);border-radius:20px;padding:18px}
.tile.big{grid-column:1/3;background:radial-gradient(120% 130% at 90% -10%,rgba(143,227,106,.16),transparent 60%),var(--tile)}
.tile .ic{font-size:19px;opacity:.9}
.tile .k{color:var(--dim);font-size:12px;margin:9px 0 5px}
.tile .v{font-size:20px;font-weight:800;color:var(--white);word-break:break-all}
.tile.big .k{font-size:13px;margin-top:0}
.tile.big .v{font-size:38px;letter-spacing:-.5px}.tile.big .v .u{font-size:16px;color:var(--acc);margin-left:5px}
.tile .v.g{color:var(--acc)}.tile .v.o{color:var(--red)}
.tile .subd{color:var(--dim);font-size:11.5px;margin-top:6px}
.chip{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip span{background:var(--tile2);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:11.5px;color:var(--soft)}.chip b{color:var(--white)}
.panel{grid-column:1/3;background:var(--tile);border:1px solid var(--line);border-radius:20px;padding:18px}
.panel-h{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;color:var(--white);margin-bottom:6px;flex-wrap:wrap}
.panel-h .blk{color:var(--dim);font-size:11px;font-weight:400}
.pill{font-size:11px;font-weight:800;padding:3px 11px;border-radius:8px}
.pill.anb{background:rgba(143,227,106,.14);color:var(--acc);border:1px solid var(--line)}
.pill.poly{background:rgba(130,71,229,.18);color:var(--poly);border:1px solid rgba(130,71,229,.4)}
.gt{font-size:12.5px;color:var(--acc);font-weight:700;margin:14px 0 7px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gt.bond{color:var(--red)}.gt.gift{color:var(--blue)}
.gt b{color:var(--soft);font-weight:600}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--tile2);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.rw .l{font-weight:700;color:var(--white);font-size:13.5px}.rw .l small{color:var(--dim);font-weight:400;margin-left:6px;font-size:12px}
.rw .r{text-align:right;font-size:12px;color:var(--dim);flex:none}.rw .r b{color:var(--acc)}
.rw.reward .l{color:var(--soft)}.rw.reward b{color:var(--white);font-weight:800;font-size:15px}
.badge{flex:none;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:8px;background:rgba(143,227,106,.16);color:var(--acc);border:1px solid var(--line)}
.badge.off{background:#12160f;color:var(--dim);border-color:var(--line)}
.mono{font-variant-numeric:tabular-nums}
.emptyg{color:var(--dim);font-size:12px;padding:4px 2px}
.chainsum{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:13.5px;color:var(--soft)}
.chainsum b{color:var(--white);font-weight:800}
.chainsum a{color:var(--acc);text-decoration:none;font-size:12.5px;font-weight:700}
.err{color:#ff9a8f;font-size:12px;margin-top:8px}
.empty{color:var(--dim);text-align:center;padding:26px 12px;font-size:13.5px;line-height:1.8}
.note{color:var(--dim);font-size:12px;background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:16px;line-height:1.75}
.note code{color:var(--soft)}
.foot{color:var(--dim);font-size:12px;text-align:center;margin-top:22px;line-height:1.8}
#gate{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 500px at 50% 0%,rgba(143,227,106,.12),transparent),rgba(8,9,12,.97);backdrop-filter:blur(6px)}
#gate.on{display:flex}
#gate .gb{max-width:440px;width:100%;text-align:center;background:radial-gradient(120% 130% at 85% -10%,rgba(143,227,106,.12),transparent 60%),var(--tile);border:1px solid var(--line);border-radius:22px;padding:32px 24px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
#gate .gic{font-size:44px}#gate h3{font-size:21px;color:var(--white);margin:12px 0 6px}
#gate .gs{font-size:14px;color:var(--soft);line-height:1.8;margin:0 0 18px}
#gate .gc{display:inline-block;text-decoration:none;padding:14px 28px;border-radius:14px;font-weight:800;font-size:16px;color:#0c2405;background:linear-gradient(180deg,var(--acc2),var(--acc))}
#gate .gback{display:block;margin-top:14px;color:var(--soft);font-size:13px;text-decoration:none}
body.locked .wrap{filter:blur(6px);pointer-events:none;user-select:none}
@media(max-width:520px){h1{font-size:21px}.tile.big .v{font-size:32px}.bento{gap:9px}}
</style>
</head>
<body class="locked">
<div id="gate"><div class="gb"><div class="gic">🔒</div><div class="gs" style="margin:12px 0 0">正在验证会员…</div></div></div>

<div class="wrap">
  <div class="top"><a class="home" href="/"><img src="/assets/logo.png" alt="Web3Origin">Web3Origin</a></div>
  <h1>双链<span>质押查询</span></h1>
  <div class="sub">输入任意起源钱包地址，一次查全 <b style="color:var(--gold2)">Polygon 与 Anubis 双链</b>的活期质押、360/600 天锁仓逐笔明细与名下总质押。纯链上只读，不连钱包、不签名。</div>

  <div class="qbox">
    <input class="qin" id="addr" placeholder="0x… 粘贴要查询的钱包地址" spellcheck="false" autocomplete="off">
    <button class="qbtn" id="qbtn">查询</button>
  </div>
  <div class="qhint">支持任意公开地址（不限本人）。查询约需几秒，双链并行读取。</div>

  <div class="status" id="status"></div>
  <div id="result"></div>
  <div class="empty" id="empty" style="display:none">输入一个钱包地址开始查询。</div>

  <div class="foot">数据源：Polygon / Anubis 链上合约（eth_call）· 纯只读 · 不连钱包不签名</div>
</div>

<script>
(function(){
  "use strict";
  var WK='https://count.web3origin.com', MLS='mon_access_v1', MONTOKEN=null, busy=false;

  /* ===== 会员门控(与其它会员工具一致) ===== */
  var gate=document.getElementById('gate');
  function unlock(){ document.body.classList.remove('locked'); gate.classList.remove('on'); start(); }
  function showGate(){
    gate.innerHTML='<div class="gb"><div class="gic">🔒</div><h3>双链质押查询 · 会员专属</h3>'
      +'<div class="gs">开通 <b style="color:var(--gold2)">10 LGNS 会员</b>后即可查询任意地址的双链质押明细，全站工具一次通用。</div>'
      +'<a class="gc" href="/tools/origin-monitor/">🔓 开通会员 · 10 LGNS 解锁全部工具</a>'
      +'<a class="gback" href="/">← 返回主站</a></div>';
    gate.classList.add('on');
  }
  function tok(){ try{return localStorage.getItem(MLS)||'';}catch(e){return '';} }
  (async function(){
    var t=tok(); if(!t){ showGate(); return; }
    try{ var r=await fetch(WK+'/mon/access?token='+encodeURIComponent(t)).then(function(x){return x.json();});
      if(r&&r.ok){ MONTOKEN=t; unlock(); } else showGate(); }catch(e){ showGate(); }
  })();

  /* ===== 双链配置与链上查询引擎(复用 origin-monitor 现有逻辑) ===== */
  var CHAINS={
    polygon:{name:'Polygon',cls:'poly',chainId:137,explorer:'https://polygonscan.com/address/',
      rpcs:['https://polygon-bor-rpc.publicnode.com','https://polygon.drpc.org','https://polygon-rpc.com'],
      sLGNS:'0x99a57E6C8558BC6689f894e068733ADf83C19725',
      lockStakes:[{label:'铸造·360天质押',addr:'0x6652d0f0D7aEc5070804E55b7023d32B9Bbc4190'},{label:'铸造·能量值质押（销毁 LGNS）',addr:'0x25a4b842cB200E9148FF5a11BAbF80488c8d8b07'}],
      bonds:[]},
    anubis:{name:'Anubis',cls:'anb',chainId:6714,explorer:'https://browser.anubispace.org/address/',
      rpcs:['https://rpc.anubispace.org'],
      sLGNS:'0x2243aE29F73137d678197b61B0621AE942845B8C',
      lockStakes:[{label:'360长期质押',addr:'0x88ea98af226Cd4402A3873400308a4D78784eCE6'},{label:'600天质押',addr:'0x04eD22c6d1D020A9B5e032E93D79ab28293EF72f'},{label:'能量值质押',addr:'0x1E5FeeC473F7F445FC7F5FeEC0beABB2270b0b4E'}],
      bonds:[{label:'销毁债券',addr:'0x11b10c9827c5b7071e96fcaa143b4e6e86b17c69'}],
      rewards:{ cobweb:'0xF7a0cacDF0810609EE5618247C4121b799E41664', dao:'0x579a71890aE0E99806f75cD2e006bB07559C3b49', turbine:'0x92B53785090F6FE0717Ca3cF5dB8f8040d3B070b' }}
  };
  var SEL={balanceOf:'0x70a08231',decimals:'0x313ce567',getUserStakesCount:'0x98dc8dea',stakes:'0x584b62a1',getDepositorBalance:'0xb79215d6',
    getUserDepositCount:'0x1bae91a4',getUserDeposit:'0x60711058',getClaimable:'0x6f5244b1',
    rewardOf:'0x1d62ebd9',getTurbineBal:'0xb4131557'};
  var encAddr=function(a){return a.toLowerCase().replace(/^0x/,'').padStart(64,'0');};
  var encU=function(n){return BigInt(n).toString(16).padStart(64,'0');};
  var okHex=function(h){return h&&h!=='0x';};
  var toBig=function(h){return okHex(h)?BigInt(h):0n;};
  function words(h){var s=h.replace(/^0x/,'');var w=[];for(var i=0;i<s.length;i+=64)w.push(BigInt('0x'+s.slice(i,i+64)));return w;}
  function fmt(raw,dec){ if(typeof raw!=='bigint'){try{raw=BigInt(raw||0);}catch(e){raw=0n;}} var neg=raw<0n; if(neg)raw=-raw; var b=10n**BigInt(dec); var i=raw/b; var f=(raw%b).toString().padStart(dec,'0').replace(/0+$/,''); return (neg?'-':'')+i.toString()+(f?'.'+f:''); }
  function pretty(raw,dec){ var parts=fmt(raw,dec).split('.'); var i=parts[0],f=parts[1]||''; var neg=i.charAt(0)==='-'; var ia=i.replace('-',''); f=(ia!=='0')?f.slice(0,2):f.slice(0,6); i=(neg?'-':'')+ia.replace(/\B(?=(\d{3})+(?!\d))/g,','); return f?i+'.'+f:i; }
  function rpc(rpcs,method,params){
    return (async function(){ var e; for(var k=0;k<rpcs.length;k++){ try{ var c=new AbortController(); var t=setTimeout(function(){c.abort();},9000);
      var r=await fetch(rpcs[k],{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:method,params:params}),signal:c.signal});
      clearTimeout(t); var j=await r.json(); if(j.error)throw new Error(j.error.message); return j.result; }catch(x){e=x;} } throw e; })();
  }
  var call=function(rpcs,to,data){return rpc(rpcs,'eth_call',[{to:to,data:data},'latest']);};
  async function blockTime(cfg){ try{ var cur=Number(toBig(await rpc(cfg.rpcs,'eth_blockNumber',[]))); var back=Math.max(1,cur-100000);
    var res=await Promise.all([rpc(cfg.rpcs,'eth_getBlockByNumber',['0x'+cur.toString(16),false]),rpc(cfg.rpcs,'eth_getBlockByNumber',['0x'+back.toString(16),false])]);
    var t2=Number(toBig(res[0].timestamp)),t1=Number(toBig(res[1].timestamp)); return {cur:cur,ts:t2,spb:(t2-t1)/(cur-back)}; }catch(e){ return null; } }
  var blkDate=function(blk,bt){ return !bt?'—':new Date((bt.ts+(Number(blk)-bt.cur)*bt.spb)*1000).toISOString().slice(0,10); };
  var remainDays=function(blk,bt){ return !bt?'—':Math.round((Number(blk)-bt.cur)*bt.spb/86400); };
  function bjTime(ts){ try{ return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ts*1000)).replace(/\//g,'-'); }catch(e){ return '—'; } }
  function dai2(raw){ try{ return Number(fmt(raw,18)).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }catch(e){ return '0.00'; } } // DAI金额,四舍五入2位(对齐官方)
  function comma(n){ try{ return Number(n).toLocaleString('en-US'); }catch(e){ return String(n); } }

  async function queryChain(key,addr){
    var cfg=CHAINS[key]; var o={cfg:cfg,block:'—',sLGNS:null,positions:[],bonds:[],bt:null,errors:[]};
    var jobs=[];
    jobs.push((async function(){try{o.block=Number(toBig(await rpc(cfg.rpcs,'eth_blockNumber',[]))).toString();}catch(e){o.errors.push('区块高度');}})());
    jobs.push((async function(){o.bt=await blockTime(cfg);})());
    jobs.push((async function(){try{ var res=await Promise.all([call(cfg.rpcs,cfg.sLGNS,SEL.decimals),call(cfg.rpcs,cfg.sLGNS,SEL.balanceOf+encAddr(addr))]); o.sLGNS={raw:toBig(res[1]),dec:Number(toBig(res[0]))||9}; }catch(e){ o.sLGNS=null; o.errors.push('活期sLGNS'); }})());
    var posR=new Array(cfg.lockStakes.length);
    cfg.lockStakes.forEach(function(ls,idx){ jobs.push((async function(){try{
      var res=await Promise.all([call(cfg.rpcs,ls.addr,SEL.getUserStakesCount+encAddr(addr)),call(cfg.rpcs,ls.addr,SEL.getDepositorBalance+encAddr(addr))]);
      var cnt=Number(toBig(res[0])), total=toBig(res[1]); var items=[];
      if(cnt>0){ var n=Math.min(cnt,50);
        items=await Promise.all(Array.from({length:n},function(_,i){ return call(cfg.rpcs,ls.addr,SEL.stakes+encAddr(addr)+encU(i)).then(function(hx){var w=words(hx);return {principal:w[0],matBlk:w[3],startBlk:w[5],status:w[7],accrued:w[10]};}).catch(function(){return {principal:0n,matBlk:0n,startBlk:0n,status:0n,accrued:0n};}); }));
      }
      if(cnt>0||total>0n) posR[idx]={label:ls.label,addr:ls.addr,count:cnt,total:total,items:items};
    }catch(e){o.errors.push(ls.label);}})()); });
    var bondR=new Array((cfg.bonds||[]).length);
    (cfg.bonds||[]).forEach(function(bd,idx){ jobs.push((async function(){try{
      // 销毁债券:多笔存款,本金按DAI(18位),已领取/可领取按LGNS(9位)。读 getUserDepositCount + getUserDeposit(i) + getClaimable(i)
      var cnt=Number(toBig(await call(cfg.rpcs,bd.addr,SEL.getUserDepositCount+encAddr(addr))));
      if(cnt<=0) return;
      var n=Math.min(cnt,50);
      var deps=await Promise.all(Array.from({length:n},function(_,i){
        return Promise.all([
          call(cfg.rpcs,bd.addr,SEL.getUserDeposit+encAddr(addr)+encU(i)),
          call(cfg.rpcs,bd.addr,SEL.getClaimable+encAddr(addr)+encU(i)).catch(function(){return null;})
        ]).then(function(rr){
          var w=words(rr[0]);
          return {principal:w[0]||0n,released:w[3]||0n,claimed:w[4]||0n,depositTs:Number(w[7]||0n),claimable:rr[1]?toBig(rr[1]):0n};
        }).catch(function(){return null;});
      }));
      deps=deps.filter(Boolean);
      if(deps.length) bondR[idx]={label:bd.label,addr:bd.addr,count:cnt,deps:deps};
    }catch(e){o.errors.push(bd.label);}})()); });
    // 待领奖励:蜘蛛网/DAO用 rewardOf→(总额,已领),待领=总额-已领;涡轮用 getTurbineBal
    o.rewards=null;
    if(cfg.rewards){
      o.rewards={cobweb:null,dao:null,turbine:null};
      jobs.push((async function(){try{ var w=words(await call(cfg.rpcs,cfg.rewards.cobweb,SEL.rewardOf+encAddr(addr))); o.rewards.cobweb=(w[0]||0n)-(w[1]||0n); }catch(e){o.errors.push('蜘蛛网奖励');}})());
      jobs.push((async function(){try{ var w=words(await call(cfg.rpcs,cfg.rewards.dao,SEL.rewardOf+encAddr(addr))); o.rewards.dao=(w[0]||0n)-(w[1]||0n); }catch(e){o.errors.push('社区奖励');}})());
      jobs.push((async function(){try{ o.rewards.turbine=toBig(await call(cfg.rpcs,cfg.rewards.turbine,SEL.getTurbineBal+encAddr(addr))); }catch(e){o.errors.push('涡轮奖励');}})());
    }
    await Promise.all(jobs);
    o.positions=posR.filter(Boolean);
    o.bonds=bondR.filter(Boolean);
    return o;
  }

  var esc=function(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});};
  function card(k,v,gold){ return '<div class="card"><div class="k">'+k+'</div><div class="v '+(gold?'gold':'')+'">'+v+'</div></div>'; }

  function lockSum(o){ var t=0n; o.positions.forEach(function(p){t+=p.total;}); return t; }
  // 名下总质押只算 LGNS(活期+锁仓);销毁债券本金是 DAI、单独展示,不并入 LGNS 合计
  function chainStakeTotal(o){ return (o.sLGNS?o.sLGNS.raw:0n)+lockSum(o); }
  function bondPrincipalDai(o){ var t=0n; (o.bonds||[]).forEach(function(bd){(bd.deps||[]).forEach(function(d){t+=d.principal;});}); return t; }
  function bondClaimable(o){ var t=0n; (o.bonds||[]).forEach(function(bd){(bd.deps||[]).forEach(function(d){t+=d.claimable;});}); return t; }

  function rewardAll(o){ if(!o.rewards) return 0n; var r=o.rewards; return (r.cobweb&&r.cobweb>0n?r.cobweb:0n)+(r.turbine&&r.turbine>0n?r.turbine:0n)+(r.dao&&r.dao>0n?r.dao:0n); }
  // 单条链的 Bento 明细面板
  function chainHTML(o,addr){
    var c=o.cfg, sL=o.sLGNS?o.sLGNS.raw:null, total=chainStakeTotal(o);
    var h='<div class="panel"><div class="panel-h"><span class="pill '+c.cls+'">'+c.name+'</span> 质押明细</div>';
    // 活期
    h+='<div class="gt">💧 活期质押 sLGNS</div>';
    h+='<div class="rw"><span class="l">直接持有 sLGNS</span><span class="r"><b>'+(sL==null?'读取失败':pretty(sL,o.sLGNS.dec)+' LGNS')+'</b></span></div>';
    // 锁仓逐笔
    if(!o.positions.length){ h+='<div class="gt">🔒 锁仓质押</div><div class="emptyg">本链暂无 360/600 等锁仓记录。</div>'; }
    o.positions.forEach(function(p){
      h+='<div class="gt">🔒 '+esc(p.label)+' <b>合计 '+pretty(p.total,9)+''+(p.count>0?' · '+p.count+' 笔':'')+'</b></div>';
      p.items.forEach(function(it,i){
        var md=blkDate(it.matBlk,o.bt),rd=remainDays(it.matBlk,o.bt);
        var okDate=md!=='—'&&rd!=='—'&&Math.abs(rd)<3000&&(+md.slice(0,4))>=2023&&(+md.slice(0,4))<=2031;
        var staking=(it.status===1n);
        h+='<div class="rw"><span class="l">#'+(i+1)+' <span class="mono">'+pretty(it.principal,9)+'</span> LGNS'+(okDate?'<small>到期 '+md+' · 剩 '+rd+' 天</small>':'')+'</span>'
          +'<span class="r">'+(okDate?'待领 <b>'+pretty(it.accrued,9)+'</b>':'<span class="badge'+(staking?'':' off')+'">'+(staking?'质押中':'状态'+it.status)+'</span>')+'</span></div>';
      });
    });
    // 销毁债券
    (o.bonds||[]).forEach(function(bd){
      var pSum=0n,cSum=0n; (bd.deps||[]).forEach(function(d){pSum+=d.principal;cSum+=d.claimable;});
      h+='<div class="gt bond">🔥 '+esc(bd.label)+' <b>本金 '+dai2(pSum)+' DAI · '+bd.deps.length+' 笔'+(cSum>0n?' · 可领 '+pretty(cSum,9):'')+'</b></div>';
      bd.deps.forEach(function(d,i){
        h+='<div class="rw"><span class="l">#'+i+' <span class="mono">'+dai2(d.principal)+'</span> DAI<small>已释 '+dai2(d.released)+' · 已领 '+pretty(d.claimed,9)+(d.depositTs>0?' · '+bjTime(d.depositTs):'')+'</small></span>'
          +'<span class="r">可领 <b>'+pretty(d.claimable,9)+'</b></span></div>';
      });
    });
    // 待领奖励
    if(o.rewards){
      var rw=o.rewards;
      h+='<div class="gt gift">🎁 待领奖励（LGNS）<b>需在官方 App 领取</b></div>';
      h+='<div class="rw reward"><span class="l">🕸️ 蜘蛛网奖励</span><span class="r"><b>'+(rw.cobweb==null?'—':pretty(rw.cobweb,9))+'</b></span></div>';
      h+='<div class="rw reward"><span class="l">🌀 涡轮增压器</span><span class="r"><b>'+(rw.turbine==null?'—':pretty(rw.turbine,9))+'</b></span></div>';
      h+='<div class="rw reward"><span class="l">🏛️ 社区奖励(DAO)</span><span class="r"><b>'+(rw.dao==null?'—':pretty(rw.dao,9))+'</b></span></div>';
    }
    h+='<div class="chainsum"><span>本链名下总质押 <b>'+pretty(total,9)+' LGNS</b>'+((o.bonds||[]).length&&bondPrincipalDai(o)>0n?' · 债券 '+dai2(bondPrincipalDai(o))+' DAI':'')+'</span>'
      +'<a href="'+c.explorer+addr+'" target="_blank" rel="noopener">🔗 链上验证 ↗</a></div>';
    if(o.errors.length) h+='<div class="err">部分读取失败：'+esc(o.errors.join('、'))+'（可开 VPN 后重试）</div>';
    h+='</div>';
    return h;
  }

  var addrEl=document.getElementById('addr'), btn=document.getElementById('qbtn'),
      st=document.getElementById('status'), res=document.getElementById('result'), empty=document.getElementById('empty');

  async function doQuery(){
    if(busy) return;
    var addr=(addrEl.value||'').trim();
    if(!/^0x[0-9a-fA-F]{40}$/.test(addr)){ st.innerHTML='<span style="color:#ff9a8f">请输入正确的钱包地址（0x 开头 42 位）。</span>'; return; }
    busy=true; btn.disabled=true; btn.textContent='查询中…'; empty.style.display='none';
    st.innerHTML='<span class="dot"></span>正在读取双链质押数据…';
    res.innerHTML='';
    try{
      var out=await Promise.all([queryChain('polygon',addr),queryChain('anubis',addr)]);
      var poly=out[0], anb=out[1];
      var grand=out.reduce(function(s,o){return s+chainStakeTotal(o);},0n);
      var sLall=out.reduce(function(s,o){return s+(o.sLGNS?o.sLGNS.raw:0n);},0n);
      var lockAll=out.reduce(function(s,o){return s+lockSum(o);},0n);
      var rwAll=out.reduce(function(s,o){return s+rewardAll(o);},0n);
      var bondAll=out.reduce(function(s,o){return s+bondPrincipalDai(o);},0n);
      var html='<div class="bento">';
      // 总额大格
      html+='<div class="tile big"><div class="k">名下总质押（双链合计）</div><div class="v mono">'+pretty(grand,9)+'<span class="u">LGNS</span></div>'
        +'<div class="chip"><span>Polygon <b class="mono">'+pretty(chainStakeTotal(poly),9)+'</b></span><span>Anubis <b class="mono">'+pretty(chainStakeTotal(anb),9)+'</b></span></div></div>';
      // 四指标格
      html+='<div class="tile"><div class="ic">🔒</div><div class="k">锁仓合计</div><div class="v g mono">'+pretty(lockAll,9)+'</div><div class="subd">360/600/能量值</div></div>';
      html+='<div class="tile"><div class="ic">🎁</div><div class="k">待领奖励</div><div class="v g mono">'+pretty(rwAll,9)+'</div><div class="subd">蜘蛛网+涡轮+DAO</div></div>';
      html+='<div class="tile"><div class="ic">🔥</div><div class="k">销毁债券本金</div><div class="v o mono">'+(bondAll>0n?dai2(bondAll)+' DAI':'0')+'</div><div class="subd">另计，非 LGNS</div></div>';
      html+='<div class="tile"><div class="ic">💧</div><div class="k">活期 sLGNS</div><div class="v mono">'+pretty(sLall,9)+'</div><div class="subd">直接持有</div></div>';
      // 双链明细面板
      html+=out.map(function(o){return chainHTML(o,addr);}).join('');
      html+='</div>';
      res.innerHTML=html;
      st.innerHTML='<span class="dot"></span>✓ 查询完成 · '+new Date().toLocaleString('zh-CN');
    }catch(e){
      st.innerHTML='<span style="color:#ff9a8f">查询失败：'+esc(e&&e.message||'网络波动')+'，请重试（海外节点可能需开 VPN）。</span>';
    }finally{ busy=false; btn.disabled=false; btn.textContent='查询'; }
  }

  function start(){
    empty.style.display='block';
    btn.onclick=doQuery;
    addrEl.addEventListener('keydown',function(e){ if(e.key==='Enter') doQuery(); });
    // 支持 ?addr= 直接带地址查询
    try{ var q=new URLSearchParams(location.search).get('addr'); if(q&&/^0x[0-9a-fA-F]{40}$/.test(q.trim())){ addrEl.value=q.trim(); doQuery(); } }catch(e){}
  }
})();
</script>
