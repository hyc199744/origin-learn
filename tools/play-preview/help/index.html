<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帮助 · ANUBIS PLAY</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
.hero{padding:118px 0 20px}
.faq{margin-top:8px}
.faq-item{border-bottom:1px solid var(--line-soft)}
.faq-q{width:100%;background:none;border:none;text-align:left;padding:20px 4px;font-size:16px;font-weight:700;
  color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:56px;
  font-family:var(--font-body)}
.faq-q::after{content:'+';font-size:22px;color:var(--gold);font-weight:300}
.faq-item.open .faq-q::after{content:'−'}
.faq-a{display:none;padding:0 4px 22px;color:var(--muted);font-size:14.5px;max-width:760px}
.faq-item.open .faq-a{display:block}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:24px}
.step{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.step .n{font-family:var(--font-num);font-size:28px;color:var(--green);font-weight:300}
.step h4{margin:10px 0 8px;font-size:16px}
.step p{color:var(--muted);font-size:14px}
</style>
</head>
<body>

<script src="../shared/site.js"></script>

<header class="hero">
  <div class="wrap">
    <div class="sec-kicker" data-i18n="kicker">HELP CENTER</div>
    <h1 class="sec-title" data-i18n="h_title">新手指南</h1>
    <p class="sec-sub" data-i18n="h_sub"></p>
    <div class="steps">
      <div class="step"><div class="n">01</div><h4 data-i18n="s1t"></h4><p data-i18n="s1d"></p></div>
      <div class="step"><div class="n">02</div><h4 data-i18n="s2t"></h4><p data-i18n="s2d"></p></div>
      <div class="step"><div class="n">03</div><h4 data-i18n="s3t"></h4><p data-i18n="s3d"></p></div>
      <div class="step"><div class="n">04</div><h4 data-i18n="s4t"></h4><p data-i18n="s4d"></p></div>
    </div>
  </div>
</header>

<section class="sec" style="padding-top:20px">
  <div class="wrap">
    <h2 class="sec-title" style="font-size:24px" data-i18n="faq_t">常见问题</h2>
    <div class="faq card" style="margin-top:20px" id="faq"></div>
  </div>
</section>

<script>
SiteNav.render('nav_help');
I18n.set(PAGE_I18N); I18n.apply();
renderFooter();
function paintFaq(){
  var el=document.getElementById('faq');
  var html='';
  for(var i=1;i<=7;i++){
    html+='<div class="faq-item"><button class="faq-q" aria-expanded="false">'+t('q'+i)+'</button>'
      +'<div class="faq-a">'+t('a'+i)+'</div></div>';
  }
  el.innerHTML=html;
  el.querySelectorAll('.faq-q').forEach(function(b){
    b.onclick=function(){
      var it=b.parentElement, open=it.classList.contains('open');
      el.querySelectorAll('.faq-item').forEach(function(x){ x.classList.remove('open'); });
      if(!open){ it.classList.add('open'); b.setAttribute('aria-expanded','true'); }
    };
  });
}
paintFaq();
window.onLangChange=function(){
  paintFaq();
  var f=document.querySelector('footer'); if(f) f.remove(); renderFooter();
};
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') document.querySelectorAll('.faq-item.open').forEach(function(x){x.classList.remove('open');});
});
</script>
</body>
</html>
