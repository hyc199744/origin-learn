<header class="hero">
  <div class="wrap">
    <div class="sec-kicker" data-i18n="kicker">ANNOUNCEMENTS</div>
    <h1 class="sec-title" data-i18n="h_title">平台公告</h1>
    <p class="sec-sub" data-i18n="h_sub"></p>
  </div>
</header>

<section class="sec" style="padding-top:10px">
  <div class="wrap" id="newsList" style="max-width:800px"></div>
</section>

<script>

I18n.set(PAGE_I18N); I18n.apply();
SiteNav.render('nav_news');
renderFooter();
function paintNews(){
  var html='';
  for(var i=1;i<=3;i++){
    html+='<div class="news-item"><div class="date num">'+t('n'+i+'d')+'</div>'
      +'<h3>'+t('n'+i+'t')+'</h3><p>'+t('n'+i+'c')+'</p></div>';
  }
  document.getElementById('newsList').innerHTML=html;
}
paintNews();
window.onLangChange=function(){
  paintNews();
  var f=document.querySelector('footer'); if(f) f.remove(); renderFooter();
};
</script>
