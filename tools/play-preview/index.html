<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANUBIS PLAY · Anubis 链上游戏平台</title>
<meta name="description" content="ANUBIS PLAY — 简洁、清晰的 Anubis 链上游戏体验。从一张彩票开始，发现更多可能。">

<link rel="stylesheet" href="shared/theme.css">
<style>
.hero{padding:118px 0 30px}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.kicker-en{font-size:12.5px;letter-spacing:.3em;color:var(--green);font-weight:700;margin-bottom:20px}
.hero h1{font-family:var(--font);font-size:clamp(34px,4.6vw,54px);line-height:1.35;font-weight:700;letter-spacing:.06em}
.hero h1 .dim{color:var(--muted);font-weight:400}
.hero-sub{margin-top:22px;color:var(--muted);font-size:16px;line-height:1.8}
.hero-cta{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
.hero-stats{display:flex;gap:26px;margin-top:34px;color:var(--muted);font-size:13.5px}
.hero-stats b{color:var(--ink);font-family:var(--font-num)}
.hero-img{border-radius:26px;overflow:hidden;box-shadow:var(--shadow-lg);aspect-ratio:4/4.4;background:var(--green-soft)}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
/* 彩票主卡 */
.feat{background:var(--green-deep);border-radius:22px;color:#F2EFE4;padding:34px 38px;
  display:grid;grid-template-columns:auto 1fr auto;gap:34px;align-items:center;box-shadow:var(--shadow-lg)}
.feat .fl{display:flex;gap:18px;align-items:center}
.feat .fic{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;flex:none}
.feat h2{font-family:var(--font);font-size:24px;letter-spacing:.08em}
.feat .fd{color:rgba(242,239,228,.65);font-size:13.5px;margin-top:6px}
.feat .fm{text-align:center;border-left:1px solid rgba(255,255,255,.14);border-right:1px solid rgba(255,255,255,.14);padding:0 34px}
.feat .fk{font-size:12.5px;letter-spacing:.2em;color:rgba(242,239,228,.6)}
.feat .fv{font-family:var(--font-num);font-size:clamp(34px,4vw,52px);font-weight:700;color:#F5E9C8;margin-top:6px}
.feat .fv small{font-size:18px;color:rgba(242,239,228,.7)}
.feat .fr{text-align:right}
.feat .fp{font-family:var(--font-num);font-size:22px;font-weight:700}
.feat .fn{font-size:13px;color:rgba(242,239,228,.6);margin-top:4px}
/* 奖池入口 */
.pools{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:18px}
.pool{background:var(--card);border:1.5px solid var(--line-soft);border-radius:var(--r);padding:20px;
  cursor:pointer;transition:.2s;position:relative;min-height:44px}
.pool:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--shadow)}
.pool.sel{border-color:var(--green);background:#fff;box-shadow:var(--shadow)}
.pool.sel::after{content:'✓';position:absolute;top:14px;right:16px;color:var(--green);font-weight:800}
.pool .pb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;margin-bottom:12px;background:var(--green-soft);color:var(--green)}
.pool h4{font-size:16px}
.pool .pp{color:var(--muted);font-size:13px;margin-top:4px;font-family:var(--font-num)}
/* 更多游戏 */
.games3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.gcard{background:var(--card);border:1px solid var(--line-soft);border-radius:20px;overflow:hidden;
  box-shadow:var(--shadow);transition:.25s}
.gcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.gcard .cov{aspect-ratio:16/10;overflow:hidden;position:relative;background:var(--green-soft)}
.gcard .cov img{width:100%;height:100%;object-fit:cover;display:block}
.gcard .cbody{padding:22px 24px;display:flex;justify-content:space-between;align-items:center}
.gcard h3{font-family:var(--font);font-size:20px}
.gcard .en{font-size:11.5px;letter-spacing:.18em;color:var(--muted);margin-top:4px}
/* 新手 */
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.steps{display:flex;gap:34px;margin-top:26px;flex-wrap:wrap}
.step .n{font-family:var(--font-num);font-size:30px;color:var(--green);font-weight:300}
.step .t{font-size:14.5px;margin-top:8px;color:var(--ink-soft)}
@media(max-width:900px){
  .hero-grid{grid-template-columns:1fr}
  .hero-img{aspect-ratio:16/10;order:-1}
  .feat{grid-template-columns:1fr;text-align:center;gap:22px;padding:28px 24px}
  .feat .fl{justify-content:center}
  .feat .fm{border:none;border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14);padding:18px 0}
  .feat .fr{text-align:center}
  .pools{grid-template-columns:repeat(2,1fr)}
  .games3{grid-template-columns:1fr}
  .help-grid{grid-template-columns:1fr}
}
@media(max-width:420px){ .pools{grid-template-columns:1fr 1fr} }
</style>

<script>
SiteNav.render('nav_home');
I18n.set(PAGE_I18N); I18n.apply();
renderFooter();

var selPool = 0;
try{
  var qp = new URLSearchParams(location.search).get('pool');
  if(qp){ var qi=['lgns','usdt','dai','a','rm'].indexOf(qp.toLowerCase()); if(qi>=0) selPool=qi; }
}catch(e){}
function pad64(n){ return BigInt(n).toString(16).padStart(64,'0'); }

async function loadPoolData(i){
  var P = window.LOTTERY_POOLS[i], S = window.LOTTERY_SEL;
  var tp = await apRpc('eth_call',[{to:P.contract,data:'0x'+S.ticketPrice},'latest']);
  var rid = await apRpc('eth_call',[{to:P.contract,data:'0x'+S.currentRound},'latest']);
  var rh = await apRpc('eth_call',[{to:P.contract,data:'0x'+S.rounds+pad64(parseInt(rid,16))},'latest']);
  var d = rh.slice(2);
  return {
    price: BigInt(tp),
    round: parseInt(rid,16),
    end: parseInt(d.slice(0,64),16)*1000,
    pool: BigInt('0x'+d.slice(192,256)) + BigInt('0x'+d.slice(256,320))
  };
}
function paintFeat(P, D){
  document.getElementById('featJackpot').innerHTML = apFmt(D.pool,P.dec)+' <small>'+P.sym+'</small>';
  document.getElementById('featPrice').textContent = apFmt(D.price,P.dec)+' '+P.sym+t('per_ticket');
  document.getElementById('featSym').textContent = (I18n.lang==='zh'?'奖金以 ':'Prizes in ')+P.sym+(I18n.lang==='zh'?' 结算':'');
  document.getElementById('featRound').textContent = (I18n.lang==='zh'?'第 ':'Round ')+D.round+(I18n.lang==='zh'?' 期':'');
  document.getElementById('featBtn').href = 'games/lottery/?pool='+P.sym.toLowerCase();
  var el = document.getElementById('featEnd');
  (function tick(){
    var ms = D.end - Date.now();
    if(ms<=0){ el.textContent = I18n.lang==='zh'?'已截止':'Ended'; return; }
    var s=Math.floor(ms/1000);
    el.textContent = Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
    setTimeout(tick,1000);
  })();
}
function failFeat(){
  ['featJackpot','featPrice'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.innerHTML='<a href="javascript:refreshFeat()" class="neon small" style="color:#F5E9C8">'+t('load_fail')+' · '+t('retry')+'</a>';
  });
}
async function refreshFeat(){
  var P = window.LOTTERY_POOLS[selPool];
  try{ paintFeat(P, await loadPoolData(selPool)); }
  catch(e){ failFeat(); }
}
function paintPools(){
  var g = document.getElementById('poolGrid');
  g.innerHTML = window.LOTTERY_POOLS.map(function(p,i){
    return '<div class="pool'+(i===selPool?' sel':'')+'" data-i="'+i+'" role="button" tabindex="0" aria-label="'+p.sym+'">'
      +'<div class="pb">'+p.badge+'</div><h4>'+p.sym+' 池</h4>'
      +'<div class="pp" id="pp'+i+'">'+t('loading')+'</div></div>';
  }).join('');
  g.querySelectorAll('.pool').forEach(function(el){
    function go(){ selPool=Number(el.getAttribute('data-i')); paintPools(); refreshFeat(); }
    el.onclick=go;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } };
  });
  window.LOTTERY_POOLS.forEach(function(p,i){
    apRpc('eth_call',[{to:p.contract,data:'0x'+window.LOTTERY_SEL.ticketPrice},'latest']).then(function(tp){
      var el=document.getElementById('pp'+i);
      if(el) el.textContent = apFmt(BigInt(tp),p.dec)+' '+p.sym+t('per_ticket');
    }).catch(function(){
      var el=document.getElementById('pp'+i);
      if(el) el.textContent = t('load_fail');
    });
  });
}
function paintGames(){
  var el = document.getElementById('games3');
  el.innerHTML = window.GAMES.filter(function(g){return g.status!=='live';}).map(function(g){
    return '<div class="gcard"><div class="cov"><img data-img="'+g.cover+'" alt="'+g.name[I18n.lang]+'" loading="lazy">'
      +'<span class="badge soon" style="position:absolute;top:14px;right:14px;background:rgba(255,254,250,.92)">'+t('dev')+'</span></div>'
      +'<div class="cbody"><div><h3>'+g.name[I18n.lang]+'</h3><div class="en">'+g.name.en+'</div></div>'
      +'<a href="'+g.path+'" class="neon" aria-label="'+g.name[I18n.lang]+'">→</a></div></div>';
  }).join('');
  paintImgs();
}
paintPools(); refreshFeat(); paintGames();
window.onLangChange = function(){
  paintPools(); refreshFeat(); paintGames();
  var f=document.querySelector('footer'); if(f) f.remove(); renderFooter();
};
</script>
