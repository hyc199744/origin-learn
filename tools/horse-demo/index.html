<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>FCB 赛马 体验版 | Web3Origin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0e14;color:#e8e8e8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.demobar{background:linear-gradient(90deg,#7a5c00,#a8842c);color:#fff8e1;text-align:center;font-size:12.5px;padding:8px 12px;letter-spacing:1px}
.wrap{max-width:1080px;margin:0 auto;padding:14px 14px 50px}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 14px}
.logo{font-size:18px;font-weight:800;color:#f5c518;letter-spacing:1px}
.bal{background:#141922;border:1px solid #2a3140;border-radius:12px;padding:8px 16px;font-size:14px}
.bal b{color:#f5c518;font-size:17px}
.langbtn{background:#141922;border:1px solid #2a3140;color:#aaa;border-radius:20px;padding:6px 14px;font-size:12.5px;cursor:pointer;margin-left:8px}
.main{display:grid;gap:14px}
@media(min-width:900px){.main{grid-template-columns:1fr 340px;align-items:start}}
.stage{background:#10141c;border:1px solid #232b3a;border-radius:16px;overflow:hidden}
canvas#cv{width:100%;height:340px;display:block;background:linear-gradient(180deg,#0d1420,#0b0e14)}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid #232b3a;border-bottom:1px solid #232b3a;font-size:13.5px}
.statusbar .t{color:#8b94a3;letter-spacing:1px}
.statusbar .t b{color:#f5c518;font-size:16px;font-variant-numeric:tabular-nums}
.betpanel{padding:16px}
.horses{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
@media(max-width:600px){.horses{grid-template-columns:repeat(2,1fr)}}
.horse{background:#141922;border:2px solid #2a3140;border-radius:12px;padding:10px;cursor:pointer;text-align:center;transition:border-color .15s,transform .1s}
.horse:active{transform:scale(.97)}
.horse.sel{border-color:#f5c518;box-shadow:0 0 0 1px #f5c518;background:#1c1a12}
.horse .dot{width:14px;height:14px;border-radius:50%;margin:0 auto 6px}
.horse .nm{font-size:14px;font-weight:700}
.horse .od{font-size:12px;color:#f5c518;margin-top:3px;font-weight:700}
.horse .no{font-size:11px;color:#5a6472}
.row{display:flex;gap:10px;margin-bottom:10px}
.field{flex:1}
.field label{font-size:12.5px;color:#8b94a3;display:block;margin-bottom:5px}
input[type=number]{width:100%;background:#0b0e14;border:1.5px solid #2a3140;border-radius:10px;color:#fff;padding:11px 12px;font-size:15px;font-family:inherit}
input[type=number]:focus{border-color:#f5c518;outline:none}
.qbtns{display:flex;gap:8px;margin-bottom:12px}
.qbtn{flex:1;background:#141922;border:1px solid #2a3140;color:#aaa;border-radius:8px;padding:8px 0;font-size:13px;cursor:pointer}
.bigbtn{width:100%;border:none;border-radius:12px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit}
.bigbtn:active{transform:scale(.98)}
.bigbtn.bet{background:linear-gradient(180deg,#f5c518,#d9a410);color:#1a1405}
.bigbtn:disabled{opacity:.45;cursor:not-allowed}
.mybets{margin-top:10px;font-size:12.5px;color:#8b94a3}
.mybets .chip{display:inline-block;background:#1c2330;border:1px solid #2a3140;border-radius:16px;padding:4px 12px;margin:3px 4px 3px 0;color:#ccc}
.mybets .chip b{color:#f5c518}
.side{background:#10141c;border:1px solid #232b3a;border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid #232b3a}
.tab{flex:1;text-align:center;padding:12px 4px;font-size:13px;color:#8b94a3;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:#f5c518;border-bottom-color:#f5c518;font-weight:700}
.pane{display:none;max-height:430px;overflow-y:auto;padding:10px 12px}
.pane.on{display:block}
.feed-item{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 4px;border-bottom:1px dashed #1d2430;color:#b9c0cc;gap:8px}
.feed-item .win{color:#3ddc84;font-weight:700}
.feed-item .time{color:#5a6472;font-size:11px;flex:none}
.hist{display:flex;flex-wrap:wrap;gap:8px;padding:6px 2px}
.pill{font-size:13px;font-weight:700;padding:5px 12px;border-radius:20px}
.pill{background:#1c2a1a;color:#3ddc84}
.lb-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:9px 4px;border-bottom:1px dashed #1d2430}
.lb-row .rk{width:26px;font-weight:800;color:#f5c518}
.lb-row.me{background:#1a1d23;border-radius:8px;padding:9px 8px}
.refbox{font-size:13.5px;line-height:2;color:#b9c0cc;padding:6px 2px}
.refbox b{color:#f5c518}
.reflink{background:#0b0e14;border:1px dashed #2a3140;border-radius:8px;padding:10px;font-size:12px;color:#8b94a3;word-break:break-all;margin:8px 0}
.copybtn{background:#1c2330;border:1px solid #f5c518;color:#f5c518;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;width:100%}
.note{font-size:12px;color:#5a6472;line-height:1.9;margin-top:14px;padding:0 2px}
.foot{text-align:center;color:#4a5261;font-size:12px;margin-top:26px}
</style>
</head>
<body>
<div class="demobar" id="demoBar">🧪 体验版 · 使用测试 FCB（非真实资产）· 正式版上线后数据清零</div>
<div class="wrap">
  <div class="top">
    <div class="logo">🏇 FCB 赛马</div>
    <div>
      <span class="bal"><span id="tBal">余额</span> <b id="balance">10,000</b> FCB</span>
      <button class="langbtn" id="langBtn">EN</button>
    </div>
  </div>
  <div class="main">
    <div class="stage">
      <canvas id="cv"></canvas>
      <div class="statusbar">
        <span class="t" id="roundStatus">等待开赛</span>
        <span class="t"><b id="countdown">--</b></span>
      </div>
      <div class="betpanel">
        <div class="horses" id="horseGrid"></div>
        <div class="row">
          <div class="field"><label id="lAmt">下注金额 (FCB)</label><input type="number" id="betAmt" value="100" min="1"></div>
        </div>
        <div class="qbtns">
          <button class="qbtn" data-a="10">10</button>
          <button class="qbtn" data-a="50">50</button>
          <button class="qbtn" data-a="100">100</button>
          <button class="qbtn" data-a="500">500</button>
          <button class="qbtn" data-a="half">½</button>
          <button class="qbtn" data-a="max">MAX</button>
        </div>
        <button class="bigbtn bet" id="betBtn">下注</button>
        <div class="mybets" id="myBets"></div>
      </div>
    </div>
    <div class="side">
      <div class="tabs">
        <div class="tab on" data-p="feed">🔴 <span id="tFeed">实时</span></div>
        <div class="tab" data-p="hist">📊 <span id="tHist">历史</span></div>
        <div class="tab" data-p="rank">🏆 <span id="tRank">排行</span></div>
        <div class="tab" data-p="ref">🎁 <span id="tRef">推广</span></div>
      </div>
      <div class="pane on" id="p-feed"></div>
      <div class="pane" id="p-hist"><div class="hist" id="histList"></div></div>
      <div class="pane" id="p-rank"></div>
      <div class="pane" id="p-ref"></div>
    </div>
  </div>
  <div class="note" id="ruleNote"></div>
  <div class="foot">FCB 赛马 · 体验版 · Web3Origin</div>
</div>
<script>
var LANG='zh';
var I18N={
zh:{bal:'余额',feed:'实时',hist:'历史',rank:'排行',ref:'推广',bet:'下注',betting:'下注中',racing:'比赛中…',finish:'开奖',waiting:'等待开赛',
 amt:'下注金额 (FCB)',mybets:'我的投注：',noBet:'还没有下注',
 rule:'玩法：6 匹马，赔率不同，下注看中的马，30 秒跑完开奖，押中按赔率赔付。每局平台抽水 5%（3% 归平台 · 1% 直推奖励 · 0.5% 日榜奖池 · 0.5% 运营）。推广只做两级，奖励全部来自平台抽水。',
 refTitle:'🎁 我的推广',invited:'已邀请',earned:'累计返佣',rate:'直推 1% · 间推 0.5%（来自平台抽水，不扣玩家）',copy:'复制邀请链接',copied:'已复制！',
 demo:'🧪 体验版 · 使用测试 FCB（非真实资产）· 正式版上线后数据清零',win:'获胜',board:'日榜 Top10 按盈利瓜分奖池（体验版为模拟数据）'},
en:{bal:'Balance',feed:'Live',hist:'History',rank:'Board',ref:'Referral',bet:'Place Bet',betting:'Betting open',racing:'Racing…',finish:'Finished',waiting:'Waiting',
 amt:'Bet amount (FCB)',mybets:'My bets: ',noBet:'No bets yet',
 rule:'How it works: 6 horses with different odds. Bet your pick, 30s race, winners paid at odds. 5% house edge per round (3% platform · 1% direct referral · 0.5% daily board · 0.5% ops). Two-level referral only, rewards from house edge.',
 refTitle:'🎁 My Referrals',invited:'Invited',earned:'Total commission',rate:'Direct 1% · 2nd-level 0.5% (from house edge, players pay nothing extra)',copy:'Copy invite link',copied:'Copied!',
 demo:'🧪 DEMO · Test FCB only (not real assets) · Data resets at official launch',win:'wins',board:'Daily Top10 shares prize pool by profit (demo data)'}
};
var T=function(k){return I18N[LANG][k];};
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function $(id){return document.getElementById(id);}
function fmt(n){return n.toLocaleString('en-US',{maximumFractionDigits:2});}
function nowT(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);}

var HORSES=[
 {name:'烈焰',en:'Blaze',color:'#e74c3c',odds:2.0},
 {name:'闪电',en:'Bolt',color:'#f1c40f',odds:3.0},
 {name:'疾风',en:'Gale',color:'#3498db',odds:4.5},
 {name:'追月',en:'Luna',color:'#9b59b6',odds:6.5},
 {name:'黑旋风',en:'Storm',color:'#95a5a6',odds:9.0},
 {name:'老黄牛',en:'OldOx',color:'#c98a4b',odds:15.0}
];
var PROBS=(function(){var s=0;HORSES.forEach(function(h){s+=1/h.odds;});return HORSES.map(function(h){return (1/h.odds)/s;});})();
var NAMES=['火箭🚀','梭哈王','稳如狗','0x3f…a2','钻石手','佛系玩家','0x88…41','追梦人','韭菜根','0xab…09','稳中带皮','ALL IN','0x5c…77','快乐源泉','翻倍大师','马王爷'];

var balance=parseFloat(lsGet('horse_demo_bal','10000'))||10000;
var phase='waiting',phaseT=0,raceT=0,winner=-1,finishTimes=[],myBetsArr=[],selHorse=0,history=[];
var BET_MS=15000,SHOW_MS=5000,LANES=6,LANE_H=56;
function saveBal(){lsSet('horse_demo_bal',balance);}
function setBal(){$('balance').textContent=fmt(balance);saveBal();}
function hName(i){return LANG==='zh'?HORSES[i].name:HORSES[i].en;}

// ---- 画布 ----
var cv=$('cv'),ctx=cv.getContext('2d');
function sizeCanvas(){
  var r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=r.width*dpr;cv.height=LANE_H*LANES*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',sizeCanvas);
function drawTrack(){
  var W=cv.getBoundingClientRect().width,H=LANE_H*LANES;
  ctx.clearRect(0,0,W,H);
  for(var i=0;i<LANES;i++){
    var y=LANE_H*(i+0.5);
    ctx.strokeStyle='#1d2430';ctx.lineWidth=1;
    ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(10,y+18);ctx.lineTo(W-24,y+18);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#5a6472';ctx.font='11px sans-serif';
    ctx.fillText((i+1)+'号',12,y-14);
    // 终点线
    ctx.strokeStyle='#f5c518';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(W-24,8);ctx.lineTo(W-24,H-8);ctx.stroke();
    var p,x;
    if(phase==='racing'||phase==='show'){
      var base=Math.min(1,raceT/finishTimes[i]);
      var wob=0.022*Math.sin(raceT*1.6+i*2.1)*(1-base);
      p=Math.min(1,Math.max(0,base+wob));
    }else{p=0;}
    x=44+p*(W-110);
    // 马身色块
    ctx.fillStyle=HORSES[i].color;ctx.beginPath();ctx.arc(x,y,17,0,7);ctx.fill();
    ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🐎',x,y+1);
    ctx.fillStyle='#cfd6df';ctx.font='12px sans-serif';ctx.textAlign='left';
    ctx.fillText(hName(i)+' '+HORSES[i].odds.toFixed(1)+'x',x+24,y);
    if(phase==='show'&&i===winner){
      ctx.fillStyle='#f5c518';ctx.font='bold 13px sans-serif';
      ctx.fillText('🏆',x-34,y);
    }
  }
  if(phase==='show'&&winner>=0){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f5c518';ctx.font='bold 30px sans-serif';ctx.textAlign='center';
    ctx.fillText('🏆 '+(winner+1)+'号 '+hName(winner)+' '+T('win')+'!',W/2,H/2-10);
    ctx.fillStyle='#fff';ctx.font='16px sans-serif';
    ctx.fillText('@ '+HORSES[winner].odds.toFixed(1)+'x',W/2,H/2+26);
  }
  if(phase==='betting'){
    ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,0,W,H);
  }
}

// ---- 动态 ----
function feed(html){
  var p=$('p-feed'),d=document.createElement('div');d.className='feed-item';d.innerHTML=html;
  p.prepend(d);while(p.children.length>30)p.removeChild(p.lastChild);
}
function renderHist(){
  var h='';
  for(var i=history.length-1;i>=0;i--){var w=history[i];
    h+='<span class="pill">'+(w+1)+'号 '+hName(w)+' '+HORSES[w].odds.toFixed(1)+'x</span>';}
  $('histList').innerHTML=h||'<span style="color:#5a6472;font-size:13px">暂无</span>';
}
function renderRank(){
  var rows=[['火箭🚀',15230],['马王爷',9840],['钻石手',7120],['0x3f…a2',5330],['梭哈王',3210],['追梦人',1870],['佛系玩家',760]];
  rows.push(['你 (体验)',balance-10000]);rows.sort(function(a,b){return b[1]-a[1];});
  var h='';
  rows.forEach(function(r,i){
    var me=r[0].indexOf('你')===0;
    h+='<div class="lb-row'+(me?' me':'')+'"><span class="rk">'+(i+1)+'</span><span>'+r[0]+'</span><span style="color:'+(r[1]>=0?'#3ddc84':'#ff7b7b')+'">'+(r[1]>=0?'+':'')+fmt(r[1])+'</span></div>';
  });
  $('p-rank').innerHTML=h+'<div style="font-size:11.5px;color:#5a6472;margin-top:8px">'+T('board')+'</div>';
}
function renderRef(){
  $('p-ref').innerHTML='<div class="refbox"><b>'+T('refTitle')+'</b><br>'+T('invited')+'：<b>12</b><br>'+T('earned')+'：<b>345.60</b> FCB<br><span style="font-size:12px;color:#8b94a3">'+T('rate')+'</span>'
  +'<div class="reflink">https://web3origin.com/tools/horse/?ref=DEMO1234</div>'
  +'<button class="copybtn" onclick="copyRef()">'+T('copy')+'</button></div>';
}
function copyRef(){if(navigator.clipboard)navigator.clipboard.writeText('https://web3origin.com/tools/horse/?ref=DEMO1234');alert(T('copied'));}
function renderHorses(){
  var g=$('horseGrid'),h='';
  HORSES.forEach(function(hs,i){
    h+='<div class="horse'+(i===selHorse?' sel':'')+'" data-i="'+i+'">'
      +'<div class="dot" style="background:'+hs.color+'"></div>'
      +'<div class="no">'+(i+1)+'号</div><div class="nm">'+hName(i)+'</div>'
      +'<div class="od">'+hs.odds.toFixed(1)+'x</div></div>';
  });
  g.innerHTML=h;
  g.querySelectorAll('.horse').forEach(function(el){
    el.onclick=function(){selHorse=parseInt(el.dataset.i);renderHorses();};
  });
}
function renderMyBets(){
  var el=$('myBets');
  if(!myBetsArr.length){el.innerHTML='<span style="color:#4a5261">'+T('mybets')+T('noBet')+'</span>';return;}
  var h=T('mybets');
  myBetsArr.forEach(function(b){h+='<span class="chip">'+(b.h+1)+'号 '+hName(b.h)+' <b>'+fmt(b.amt)+'</b></span>';});
  el.innerHTML=h;
}

// ---- 回合引擎 ----
var lastTs=0;
function loop(ts){
  var dt=Math.min(0.1,(ts-lastTs)/1000||0);lastTs=ts;
  if(phase==='betting'){
    phaseT-=dt*1000;
    $('countdown').textContent=Math.ceil(phaseT/1000)+'s';
    if(Math.random()<dt*0.9){
      var b={name:NAMES[Math.floor(Math.random()*NAMES.length)],h:Math.floor(Math.random()*6),amt:Math.round(10+Math.random()*490)};
      feed('<span>🎲 '+b.name+' 押 '+(b.h+1)+'号'+hName(b.h)+' <b>'+fmt(b.amt)+'</b> FCB</span><span class="time">'+nowT()+'</span>');
    }
    if(phaseT<=0)startRace();
  }else if(phase==='racing'){
    raceT+=dt;
    $('countdown').textContent='🏇';
    if(raceT>=finishTimes[winner])doFinish();
  }else if(phase==='show'){
    phaseT-=dt*1000;
    if(phaseT<=0)startBetting();
  }
  drawTrack();
  requestAnimationFrame(loop);
}
function startBetting(){
  phase='betting';phaseT=BET_MS;myBetsArr=[];winner=-1;raceT=0;
  $('roundStatus').textContent=T('betting');
  var btn=$('betBtn');btn.disabled=false;btn.textContent=T('bet');
  renderMyBets();
}
function startRace(){
  phase='racing';raceT=0;
  var r=Math.random(),acc=0;winner=0;
  for(var i=0;i<LANES;i++){acc+=PROBS[i];if(r<=acc){winner=i;break;}}
  var winTime=15+Math.random()*2.5;
  finishTimes=HORSES.map(function(_,i){return i===winner?winTime:winTime+1.2+Math.random()*5;});
  $('roundStatus').textContent=T('racing');
  $('betBtn').disabled=true;
  feed('<span>🔔 '+(LANG==='zh'?'比赛开始！':'Race started!')+'</span><span class="time">'+nowT()+'</span>');
}
function doFinish(){
  phase='show';phaseT=SHOW_MS;
  $('roundStatus').textContent='🏆 '+(winner+1)+'号 '+hName(winner);
  $('countdown').textContent=HORSES[winner].odds.toFixed(1)+'x';
  history.push(winner);if(history.length>20)history.shift();renderHist();
  var totalWin=0;
  myBetsArr.forEach(function(b){
    if(b.h===winner){totalWin+=b.amt*HORSES[winner].odds;}
  });
  if(totalWin>0){
    balance+=totalWin;setBal();
    feed('<span>💰 你押中 '+(winner+1)+'号！<span class="win">+'+fmt(totalWin)+' FCB</span></span><span class="time">'+nowT()+'</span>');
  }else if(myBetsArr.length){
    feed('<span>😭 '+(winner+1)+'号获胜，你没押中</span><span class="time">'+nowT()+'</span>');
  }
  feed('<span>🏆 '+(winner+1)+'号 '+hName(winner)+' '+T('win')+' @ '+HORSES[winner].odds.toFixed(1)+'x</span><span class="time">'+nowT()+'</span>');
  renderRank();
}
$('betBtn').onclick=function(){
  if(phase!=='betting')return;
  var amt=Math.floor(parseFloat($('betAmt').value)||0);
  if(amt<1){$('betAmt').focus();return;}
  if(amt>balance){alert(LANG==='zh'?'余额不足':'Insufficient balance');return;}
  balance-=amt;setBal();
  myBetsArr.push({h:selHorse,amt:amt});renderMyBets();
  feed('<span>🎲 你押 '+(selHorse+1)+'号'+hName(selHorse)+' <b>'+fmt(amt)+'</b> FCB @'+HORSES[selHorse].odds.toFixed(1)+'x</span><span class="time">'+nowT()+'</span>');
};
document.querySelectorAll('.qbtn').forEach(function(b){
  b.onclick=function(){
    var a=b.dataset.a,cur=parseFloat($('betAmt').value)||0;
    if(a==='half')$('betAmt').value=Math.max(1,Math.floor(cur/2));
    else if(a==='max')$('betAmt').value=Math.floor(balance);
    else $('betAmt').value=a;
  };
});
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    document.querySelectorAll('.pane').forEach(function(x){x.classList.remove('on');});
    t.classList.add('on');$('p-'+t.dataset.p).classList.add('on');
  };
});
function applyLang(){
  $('tBal').textContent=T('bal');$('tFeed').textContent=T('feed');$('tHist').textContent=T('hist');
  $('tRank').textContent=T('rank');$('tRef').textContent=T('ref');$('lAmt').textContent=T('amt');
  $('ruleNote').textContent=T('rule');$('demoBar').textContent=T('demo');
  $('langBtn').textContent=LANG==='zh'?'EN':'中文';
  renderHorses();renderRef();renderRank();renderMyBets();
  if(phase==='betting')$('betBtn').textContent=T('bet');
}
$('langBtn').onclick=function(){LANG=LANG==='zh'?'en':'zh';applyLang();};
// ---- 启动 ----
sizeCanvas();setBal();applyLang();renderHist();
feed('<span>🎉 欢迎来到 FCB 赛马体验版！选马下注，30 秒一局 🍀</span><span class="time">'+nowT()+'</span>');
startBetting();
requestAnimationFrame(loop);
</script>
