<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08090a">
<title>起源</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#08090a;--ink:#e9efea;--dim:#8a9088;--soft:#c3cbc4;
  --gold:#d4af37;--gold2:#e8cf7e;--green:#25C96F;--red:#ff5e57;
  --panel:#14160f;--panel2:#1b1e15;--line:rgba(212,175,55,.16);
  --sans:"Manrope",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --disp:"Sora",var(--sans);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(900px 500px at 50% -5%,#171a10,#08090a 60%);min-height:100vh;
  font-family:var(--sans);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 12px 50px}
.demo-cap{color:var(--dim);font-size:13px;text-align:center;max-width:400px;line-height:1.6}
.demo-cap b{color:var(--gold2)}

/* ---- 手机外壳 ---- */
.phone{width:390px;max-width:96vw;height:min(820px,88vh);background:#000;border-radius:44px;padding:11px;
  box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 2px #23261c,inset 0 0 0 2px #000;position:relative;flex:none}
.screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:34px;overflow:hidden;display:flex;flex-direction:column}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:26px;background:#000;
  border-radius:0 0 16px 16px;z-index:60}
.statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 24px;
  font-size:13px;font-weight:700;color:var(--ink);z-index:55}
.statusbar .r{display:flex;gap:6px;align-items:center;font-size:12px}

/* ---- 顶部栏 ---- */
.appbar{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);
  background:rgba(8,9,10,.85);backdrop-filter:blur(8px);z-index:40}
.appbar .brand{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:.5px}
.appbar .brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#e8cf7e,#b7892e);
  color:#1a1206;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.appbar .brand span{color:var(--gold2)}
.appbar .title{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--ink)}
.appbar .sp{flex:1}
.appbar .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:17px;color:var(--soft);position:relative}
.appbar .ic:active{background:rgba(255,255,255,.05)}
.appbar .ic .badge{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--bg)}
.appbar .back{font-size:22px;color:var(--gold2);width:30px}

/* ---- 内容区 ---- */
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{display:none}
.pad{padding:14px 16px 20px}
.sec-t{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--ink);margin:18px 2px 10px;display:flex;align-items:center;gap:7px}
.sec-t .more{margin-left:auto;font-family:var(--sans);font-size:12px;color:var(--dim);font-weight:600}

/* 价格卡 */
.pcard{border-radius:18px;padding:16px 16px 14px;background:linear-gradient(145deg,#1c1e14,#111309);
  border:1px solid var(--line);position:relative;overflow:hidden}
.pcard .lbl{color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.5px}
.pcard .row{display:flex;align-items:flex-end;gap:10px;margin-top:4px}
.pcard .price{font-family:var(--disp);font-weight:800;font-size:34px;color:var(--gold2);line-height:1;font-variant-numeric:tabular-nums}
.pcard .chg{font-size:13px;font-weight:800;color:var(--green);padding-bottom:4px}
.pcard .chg.dn{color:var(--red)}
.pcard .spark{position:absolute;right:12px;bottom:10px;width:120px;height:46px;opacity:.9}
.pcard .meta{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.pcard .meta div{font-size:11px;color:var(--dim)}
.pcard .meta b{display:block;color:var(--soft);font-size:13px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}

/* 直播横幅 */
.livebar{margin-top:14px;border-radius:16px;padding:13px 14px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,rgba(122,11,18,.35),rgba(20,22,15,.6));border:1px solid rgba(255,94,87,.3)}
.livebar .dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite;flex:none}
.livebar .t{font-weight:700;font-size:14px}
.livebar .s{font-size:11.5px;color:var(--dim);margin-top:2px}
.livebar .go{margin-left:auto;background:var(--gold);color:#1a1206;font-weight:800;font-size:12px;padding:7px 13px;border-radius:20px;flex:none}
@keyframes pulse{50%{opacity:.35}}

/* 快捷工具格子 */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.quick a{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line)}
.quick a:active{background:var(--panel2)}
.quick .qi{font-size:22px}
.quick .ql{font-size:11px;color:var(--soft);font-weight:600}

/* 资讯列表 */
.news{display:flex;flex-direction:column;gap:9px}
.nitem{display:flex;gap:11px;padding:11px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.nitem:active{background:var(--panel2)}
.nitem .tag{flex:none;width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#2a2410,#171308);
  display:flex;align-items:center;justify-content:center;font-size:20px}
.nitem .nc{flex:1;min-width:0}
.nitem .nt{font-size:13.5px;font-weight:700;line-height:1.4;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nitem .nm{font-size:11px;color:var(--dim);margin-top:5px;display:flex;gap:8px}
.nitem .nm .zh{color:var(--green)}

/* 直播页 */
.stage{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;background:#000}
.stage img{width:100%;height:100%;object-fit:cover;display:block}
.stage video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.stage .lv{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800;
  padding:4px 9px;border-radius:6px;display:flex;align-items:center;gap:5px}
.stage .lv i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.3s infinite}
.stage .on{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);color:#eafff2;font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px}
.stage .playc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.stage .playc button{width:60px;height:60px;border-radius:50%;background:rgba(214,175,55,.92);color:#1a1206;
  border:none;font-size:24px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.relaynote{font-size:11.5px;color:var(--dim);text-align:center;margin-top:10px;line-height:1.5;
  border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:rgba(212,175,55,.05)}
.chatbox{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.chatbox .ch{padding:9px 12px;font-size:12.5px;font-weight:700;color:var(--gold2);border-bottom:1px solid var(--line);display:flex}
.chatbox .ch .n{margin-left:auto;color:var(--green)}
.chatbox .cm{padding:8px 12px;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.03)}
.chatbox .cm b{color:var(--gold2)}
.chatbox .ci{display:flex;gap:8px;padding:9px 10px}
.chatbox .ci input{flex:1;background:#0f110b;border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:var(--ink);font:inherit;font-size:12.5px;outline:none}
.chatbox .ci button{background:var(--gold);color:#1a1206;border:none;border-radius:9px;padding:0 14px;font-weight:800;font-size:12.5px}

/* 视频网格 */
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vcard{border-radius:13px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.vcard:active{background:var(--panel2)}
.vthumb{aspect-ratio:16/10;background:linear-gradient(135deg,#241f10,#12100a);position:relative;display:flex;align-items:center;justify-content:center;font-size:26px}
.vthumb .dur{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;padding:2px 5px;border-radius:4px}
.vcard .vt{padding:8px 9px 10px;font-size:12px;font-weight:600;line-height:1.35;color:var(--soft);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12px;font-weight:600;padding:6px 13px;border-radius:20px;border:1px solid var(--line);color:var(--dim);background:var(--panel)}
.chip.on{background:var(--gold);color:#1a1206;border-color:var(--gold)}

/* 工具列表 */
.tools{display:flex;flex-direction:column;gap:9px}
.tool{display:flex;align-items:center;gap:13px;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.tool:active{background:var(--panel2)}
.tool .ti{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;
  background:linear-gradient(135deg,#2a2410,#171308)}
.tool .tc{flex:1}
.tool .tn{font-size:14px;font-weight:700}
.tool .td{font-size:11.5px;color:var(--dim);margin-top:2px}
.tool .ar{color:var(--dim);font-size:18px}

/* 我的 */
.profile{display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:18px;
  background:linear-gradient(145deg,#1c1e14,#111309);border:1px solid var(--line)}
.profile .av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#e8cf7e,#b7892e);
  display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.profile .pn{font-family:var(--disp);font-weight:700;font-size:17px}
.profile .pd{font-size:12px;color:var(--dim);margin-top:3px}
.profile .loginbtn{margin-left:auto;background:var(--gold);color:#1a1206;font-weight:800;font-size:13px;padding:9px 16px;border-radius:22px;border:none;flex:none}
.list{margin-top:16px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.li{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid rgba(255,255,255,.04)}
.li:last-child{border-bottom:none}
.li:active{background:var(--panel2)}
.li .lic{font-size:18px;width:24px;text-align:center}
.li .lt{flex:1;font-size:14px;font-weight:600}
.li .lr{color:var(--dim);font-size:13px}
.li .ar{color:var(--dim);font-size:17px}
/* 开关 */
.sw{width:44px;height:26px;border-radius:20px;background:#33372a;position:relative;transition:.2s;flex:none}
.sw.on{background:var(--green)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on::after{left:21px}

/* 底部导航 */
.tabbar{flex:none;height:60px;display:flex;border-top:1px solid var(--line);background:rgba(10,11,9,.95);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:10.5px;font-weight:600}
.tab .ti{font-size:20px;line-height:1}
.tab.on{color:var(--gold2)}
.tab.on .ti{transform:translateY(-1px)}

/* 覆盖全屏页(登录/隐私/协议) */
.overlay{position:absolute;inset:0;background:var(--bg);z-index:80;display:none;flex-direction:column}
.overlay.show{display:flex}
.readdoc{padding:16px 18px 30px;font-size:13px;line-height:1.85;color:var(--soft)}
.readdoc h3{font-family:var(--disp);color:var(--gold2);font-size:15px;margin:18px 0 8px}
.readdoc p{margin-bottom:10px}
.readdoc .upd{color:var(--dim);font-size:12px;margin-bottom:6px}

/* 登录 */
.login{padding:30px 24px;display:flex;flex-direction:column;height:100%}
.login .logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#e8cf7e,#b7892e);
  color:#1a1206;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:30px;margin:10px auto 14px}
.login h2{font-family:var(--disp);text-align:center;font-size:22px;color:var(--gold2)}
.login .sub{text-align:center;color:var(--dim);font-size:13px;margin:6px 0 26px}
.field{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:0 14px;margin-bottom:12px;height:50px}
.field .pre{color:var(--soft);font-weight:700;font-size:14px;border-right:1px solid var(--line);padding-right:11px}
.field input{flex:1;background:none;border:none;color:var(--ink);font:inherit;font-size:15px;outline:none}
.field .code{background:none;border:none;color:var(--gold2);font-weight:700;font-size:13px;white-space:nowrap}
.bigbtn{height:50px;border-radius:13px;background:var(--gold);color:#1a1206;font-weight:800;font-size:16px;border:none;margin-top:6px}
.bigbtn:active{filter:brightness(1.08)}
.finger{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:26px;color:var(--dim)}
.finger .fp{width:56px;height:56px;border-radius:50%;border:1px solid var(--gold);color:var(--gold2);
  display:flex;align-items:center;justify-content:center;font-size:28px}
.finger .fp:active{background:rgba(212,175,55,.12)}
.finger span{font-size:12px}
.agree{display:flex;gap:8px;align-items:flex-start;margin-top:auto;font-size:11.5px;color:var(--dim);line-height:1.6}
.agree .ck{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--gold);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--gold)}
.agree .ck.on{background:var(--gold);color:#1a1206}
.agree a{color:var(--gold2)}

/* toast */
.toast{position:absolute;bottom:78px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(20,22,15,.97);
  border:1px solid var(--line);color:var(--ink);font-size:13px;padding:10px 18px;border-radius:12px;z-index:90;opacity:0;
  transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* —— 打包成手机App:满屏,去掉演示外壳 —— */
html,body{height:100%;margin:0;padding:0;background:var(--bg);overflow:hidden}
body{display:block!important;padding:0!important;gap:0!important}
.demo-cap{display:none!important}
.phone{width:100%!important;max-width:none!important;height:100vh!important;height:100dvh!important;border-radius:0!important;padding:0!important;box-shadow:none!important;background:var(--bg)!important;flex:1!important}
.screen{border-radius:0!important;height:100vh!important;height:100dvh!important}
.notch{display:none!important}
.statusbar{display:none!important}
.appbar{height:auto!important;min-height:52px;padding-top:calc(8px + env(safe-area-inset-top))!important;padding-bottom:6px}
.overlay .appbar{padding-top:calc(8px + env(safe-area-inset-top))!important}
.tabbar{padding-bottom:calc(4px + env(safe-area-inset-bottom))!important;height:auto!important;min-height:60px}
.webframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
.overlay .webframe{flex:1}

/* V1-V6 等级人数 */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 8px;text-align:center;position:relative;overflow:hidden}
.lvl .lk{font-family:var(--disp);font-weight:800;font-size:13px;color:var(--gold2);letter-spacing:.5px}
.lvl .ln{font-family:var(--disp);font-weight:800;font-size:19px;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums}
.lvl .ls{font-size:10px;color:var(--dim);margin-top:1px}
.lvl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#e8cf7e,#b7892e)}

/* 大额交易 */
.trade{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;background:var(--panel);border:1px solid var(--line);margin-bottom:9px}
.trade .side{font-weight:800;font-size:12px;padding:5px 10px;border-radius:8px;flex:none}
.trade .side.buy{background:rgba(37,201,111,.15);color:var(--green)}
.trade .side.sell{background:rgba(255,94,87,.15);color:var(--red)}
.trade .amt{font-weight:800;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.trade .sub{font-size:11px;color:var(--dim);margin-top:3px}
.mon-h{display:flex;align-items:center;gap:10px;padding:2px 2px 14px}
.mon-h .mt{flex:1;font-size:12px;color:var(--dim);line-height:1.5}
.explain{border:1px solid rgba(212,175,55,.28);border-radius:14px;background:rgba(212,175,55,.06);padding:13px 15px;font-size:13.5px;line-height:1.75;color:var(--soft)}
.explain b{color:var(--gold2);font-weight:700}
.detbox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.det{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.04)}
.det:last-child{border-bottom:none}
.det .dl{font-size:11.5px;color:var(--dim);margin-bottom:5px}
.det .dv{font-size:13px;color:var(--ink);word-break:break-all;line-height:1.5;font-variant-numeric:tabular-nums}
.det .dv .cp{color:var(--gold2);font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap;border:1px solid var(--line);padding:2px 8px;border-radius:6px}

/* 观察钱包 */
.wadd{display:flex;gap:8px;margin-bottom:14px}
.wadd input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--ink);font:inherit;font-size:13px;outline:none}
.wadd button{background:var(--gold);color:#1a1206;border:none;border-radius:11px;padding:0 16px;font-weight:800;font-size:13px}
.wallet{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:13px;background:var(--panel);border:1px solid var(--line);margin-bottom:9px}
.wallet .wa{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#2a2410,#171308);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.wallet .wn{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.wallet .ws{font-size:11px;color:var(--dim);margin-top:3px}
.wallet .wb{color:var(--gold2);font-size:16px}
</style>

<div class="demo-cap">👇 这是<b>起源 App</b> 的可点击原型。点<b>底部导航</b>切换直播/视频/工具/资讯；首页有 <b>V1–V6 等级人数</b>；<b>工具</b>里点"大额交易监控"和"观察钱包"能看内页；"<b>我的→登录</b>"是<b>邮箱+指纹</b>登录，能看隐私政策/用户协议。<br>（demo 演示，数据为示意）</div>

<div class="phone">
 <div class="screen">
  <div class="notch"></div>
  <div class="statusbar"><span id="clock">23:14</span><span class="r">📶 🔋 100%</span></div>

  <!-- 顶部栏 -->
  <div class="appbar">
    <div class="brand" id="abBrand"><span class="mark">起</span><span>ORIGIN 起源</span></div>
    <div class="title" id="abTitle" style="display:none"></div>
    <div class="sp"></div>
    <div class="ic" onclick="toast('暂无新通知')">🔔<span class="badge"></span></div>
    <div class="ic" onclick="go('me')">👤</div>
  </div>

  <!-- 内容 -->
  <div class="body" id="body"></div>

var LSTREAM='https://live.web3origin.com';
var lplayer=null, lhls=null, lws=null;
function initLive(){
  fetch(LSTREAM+'/live/yeliao.m3u8?_='+Date.now(),{cache:'no-store'}).then(function(r){ r.ok?liveOnline():liveOffline(); }).catch(liveOffline);
  loadReplays(); connectLiveChat();
}
function liveOnline(){var e=document.getElementById('llv');if(e)e.style.display='inline-flex';var s=document.getElementById('lstatus');if(s)s.textContent='● 直播中 · 点画面上的播放键开始收听';}
function liveOffline(){var s=document.getElementById('lstatus');if(s)s.textContent='主播暂未开播，开播后回到本页即可收听';var p=document.getElementById('lplay');if(p){var b=p.querySelector('button');if(b)b.textContent='↻';p.onclick=function(){initLive();};}}
function setupMediaSession(v){
  if(!('mediaSession' in navigator))return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:'木火夜聊 · 直播中',artist:'起源 Origin',album:'会议音频转播',artwork:[{src:'https://live.web3origin.com/cover.png',sizes:'512x512',type:'image/png'}]});
    navigator.mediaSession.setActionHandler('play',function(){v.play().catch(function(){});});
    navigator.mediaSession.setActionHandler('pause',function(){v.pause();});
    navigator.mediaSession.setActionHandler('stop',function(){cleanupLive();});
    v.addEventListener('play',function(){try{navigator.mediaSession.playbackState='playing';}catch(e){}});
    v.addEventListener('pause',function(){try{navigator.mediaSession.playbackState='paused';}catch(e){}});
  }catch(e){}
}
function startLive(){
  var v=document.getElementById('lv'); if(!v)return;
  var p=document.getElementById('lplay'); if(p)p.style.display='none';
  setupMediaSession(v);
  var FLV=LSTREAM+'/live/yeliao.flv', HLS=LSTREAM+'/live/yeliao.m3u8';
  var s=document.getElementById('lstatus'); if(s)s.textContent='● 直播中 · 连接中…';
  if(window.flvjs && flvjs.isSupported()){
    try{ lplayer=flvjs.createPlayer({type:'flv',isLive:true,url:FLV},{enableStashBuffer:false,stashInitialSize:128,liveBufferLatencyChasing:true,liveBufferLatencyMaxLatency:3.0});
      lplayer.attachMediaElement(v); lplayer.load(); v.play().catch(function(){});
      lplayer.on(flvjs.Events.ERROR,function(){try{lplayer.destroy();}catch(e){} lplayer=null; startLiveHls(v,HLS);});
    }catch(e){ startLiveHls(v,HLS); }
  } else { startLiveHls(v,HLS); }
}
function startLiveHls(v,HLS){
  if(window.Hls && Hls.isSupported()){ lhls=new Hls({liveSyncDurationCount:3,maxBufferLength:20}); lhls.loadSource(HLS); lhls.attachMedia(v); lhls.on(Hls.Events.MANIFEST_PARSED,function(){v.play().catch(function(){});}); }
  else { v.src=HLS; v.play().catch(function(){}); }
}
function loadReplays(){
  fetch(LSTREAM+'/replays/yeliao/index.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():[];}).then(function(arr){
    var box=document.getElementById('lreplays'); if(!box)return;
    if(!arr||!arr.length){box.innerHTML='<div style="color:var(--dim);font-size:12px;padding:8px">暂无回放</div>';return;}
    box.innerHTML=arr.map(function(it){var m=Math.round((it.duration||0)/60);return '<div class="nitem" onclick="playReplay(\''+it.url+'\')"><div class="tag">🎧</div><div class="nc"><div class="nt">'+escH(it.title||'回放')+'</div><div class="nm"><span>'+m+' 分钟</span></div></div></div>';}).join('');
  }).catch(function(){});
}
function playReplay(url){var a=document.getElementById('lrep');if(!a)return;a.src=url;a.style.display='block';a.play().catch(function(){});toast('播放回放');}
function connectLiveChat(){
  try{ lws=new WebSocket('wss://live.web3origin.com/chat'); }catch(e){return;}
  lws.onmessage=function(ev){var m;try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.type==='hello'){renderLiveChat(m.history||[]);setLcnt(m.n||0);}
    else if(m.type==='msg'){addLiveMsg(m);}
    else if(m.type==='count'){setLcnt(m.n);}
    else if(m.type==='blocked'){toast('含违规内容，已被屏蔽');}
  };
  lws.onclose=function(){setTimeout(function(){if(document.getElementById('lclist'))connectLiveChat();},3000);};
  lws.onerror=function(){try{lws.close();}catch(e){}};
}
function setLcnt(n){var a=document.getElementById('lcnt');if(a)a.textContent='👥 '+n+' 在线';var b=document.getElementById('lon');if(b){b.style.display='inline-block';b.textContent='👥 '+n;}}
function escH(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function addLiveMsg(m){var box=document.getElementById('lclist');if(!box)return;var at=box.scrollHeight-box.scrollTop-box.clientHeight<40;var d=document.createElement('div');d.className='cm';d.innerHTML='<b>'+escH(m.name)+'：</b>'+escH(m.text);box.appendChild(d);if(at)box.scrollTop=box.scrollHeight;}
function renderLiveChat(h){var box=document.getElementById('lclist');if(!box)return;box.innerHTML='';h.forEach(addLiveMsg);box.scrollTop=box.scrollHeight;}
function liveNick(){var n='';try{n=localStorage.getItem('yeliao_nick')||'';}catch(e){} if(!n){var A=['深夜','抄底','摸鱼','佛系','冲浪','吃瓜','躺赢','元气','硬核','月光'],B=['锦鲤','大佬','夜猫子','汤圆','喵星人','柠檬','阿源','剑客','布丁','小可爱'];n=A[Math.floor(Math.random()*A.length)]+'的'+B[Math.floor(Math.random()*B.length)]+(Math.floor(Math.random()*90)+10);try{localStorage.setItem('yeliao_nick',n);}catch(e){}} return n;}
function liveSend(){var i=document.getElementById('lcmsg');if(!i)return;var t=(i.value||'').trim();if(!t)return;if(!lws||lws.readyState!==1){toast('连接中，请稍候…');return;}lws.send(JSON.stringify({type:'msg',name:liveNick(),text:t}));i.value='';}
