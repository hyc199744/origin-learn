<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>腾讯云直播｜Web3Origin</title>
<meta name="description" content="起源腾讯云直播独立观看页：自建播放器直接拉流播放（HLS/FLV），全屏、手机横屏，绝不索要助记词、私钥或钱包密码。">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://web3origin.com/live-cloud/">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
:root{--obsidian:#050303;--gold:#D6A84B;--gold-lt:#f0d48a;--bone:#F1DFC0;--ink:#e8d9be;--soft:#b79c74;--muted:#7c6a4f;--line:#3a2313;--emerald:#1f5c3d;--emerald-lt:#3ddc8a;--card:#0c0a08;--serif:"STZhongsong","Songti SC","SimSun",Georgia,serif;--sans:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
body{background:var(--obsidian);color:var(--ink);font-family:var(--sans);font-size:16px;background-image:radial-gradient(1200px 600px at 50% -10%,rgba(122,11,18,.18),transparent 60%),radial-gradient(800px 500px at 90% 20%,rgba(31,92,61,.12),transparent 55%)}
a{color:var(--gold-lt)}
.top{border-bottom:1px solid var(--line);padding:13px 0;position:sticky;top:0;background:rgba(5,3,3,.9);backdrop-filter:blur(6px);z-index:20}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--serif);color:var(--bone);font-size:18px;text-decoration:none}
.brand b{color:var(--gold-lt)}
h1{font-family:var(--serif);color:var(--bone);font-size:clamp(20px,4vw,28px);margin:20px 0 4px}
.sub{color:var(--soft);font-size:14px;margin:0 0 14px}
.badge{display:inline-flex;align-items:center;gap:7px;background:rgba(122,11,18,.85);border:1px solid #ff8a8a;color:#ffe3e3;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;vertical-align:middle;margin-left:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 0 0 rgba(255,77,77,.7);animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,77,.6)}70%{box-shadow:0 0 0 8px rgba(255,77,77,0)}100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stage video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain;display:block}
.stage:fullscreen,.stage:-webkit-full-screen{border:0;border-radius:0}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--soft);text-align:center;padding:20px;background:repeating-linear-gradient(135deg,#0a0d0b,#0a0d0b 12px,#0c110d 12px,#0c110d 24px)}
.overlay .big{font-family:var(--serif);color:var(--bone);font-size:18px}
.spin{width:34px;height:34px;border:3px solid rgba(214,168,75,.25);border-top-color:var(--gold);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ctrls{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:9px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#141009;color:var(--bone)}
.btn:hover{border-color:var(--gold)}
.btn.p{background:linear-gradient(180deg,#2a6b47,#1c4d33);border-color:#2f7d4f;color:#eafff2}
.note{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;background:rgba(214,168,75,.05);padding:11px 13px;font-size:13px;color:var(--soft);margin:14px 0}
.note b{color:var(--bone)}
.foot{border-top:1px solid var(--line);margin-top:24px;padding:18px 0 50px;color:var(--muted);font-size:13px}
@media(max-width:600px){.stage{border-radius:10px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/">◎ <b>Web3Origin</b></a>
  <a href="/" style="font-size:13px;color:var(--soft);text-decoration:none">← 返回首页</a>
</div></header>

<main class="wrap">
  <h1 id="lcTitle">腾讯云直播<span class="badge" id="lcBadge" style="display:none"><span class="dot"></span>LIVE</span></h1>
  <p class="sub" id="lcSub">独立直播观看页 · 与原直播课堂互不影响</p>

  <div class="stage" id="lcStage">
    <div class="overlay" id="lcOverlay"><div class="big" id="lcMsg">正在连接直播…</div><div class="spin" id="lcSpin"></div></div>
  </div>

  <div class="ctrls" id="lcCtrls" style="display:none">
    <button class="btn p" id="lcSound">🔊 开启声音</button>
    <button class="btn" id="lcFs">⛶ 全屏观看</button>
    <button class="btn" id="lcReload">↻ 刷新播放器</button>
  </div>

  <div class="note">🎬 本页只提供直播观看。<b>任何人都不会通过直播向你索要助记词、私钥、钱包密码或验证码</b>，遇到就是诈骗。直播内容与第三方服务不代表投资建议。</div>

  <footer class="foot">Web3Origin — 独立的 Web3 学习与链上研究平台 · <a href="/">web3origin.com</a> · 内容仅供学习，不构成投资建议</footer>
</main>

<script src="/assets/hls.min.js"></script>
<script>
(function(){
  "use strict";
  var API="https://count.web3origin.com";
  var stage=document.getElementById("lcStage"),overlay=document.getElementById("lcOverlay"),
      msg=document.getElementById("lcMsg"),spin=document.getElementById("lcSpin"),
      ctrls=document.getElementById("lcCtrls");
  var hls=null,video=null,curUrl="",fails=0;
  // 允许 ?src= 覆盖(预览/测试用)
  var qp=new URLSearchParams(location.search),override=qp.get("src");

  function showMsg(text,withSpin){
    overlay.style.display="flex";
    msg.textContent=text;spin.style.display=withSpin?"block":"none";
    ctrls.style.display="none";
    document.getElementById("lcBadge").style.display="none";
  }
  function clearOverlay(){overlay.style.display="none";ctrls.style.display="flex";document.getElementById("lcBadge").style.display="inline-flex";}

  function destroy(){try{if(hls){hls.destroy();hls=null;}}catch(e){}if(video){try{video.pause();}catch(e){}if(video.parentNode)video.parentNode.removeChild(video);video=null;}}

  function play(url,type){
    destroy();curUrl=url;
    if(!url){showMsg("直播尚未开始 / 正在准备中",false);return;}
    var isFlv=(type==="flv")||/\.flv(\?|$)/i.test(url);
    if(isFlv && !window.flvjs){showMsg("该地址为 http-flv，本页当前只内置了 HLS 播放器；请改用 m3u8 地址，或让管理员启用 flv.js。",false);return;}
    showMsg("正在连接直播…",true);
    video=document.createElement("video");
    video.setAttribute("playsinline","");video.setAttribute("webkit-playsinline","");
    video.controls=true;video.autoplay=true;video.muted=true;
    stage.appendChild(video);
    var readied=false;
    function onReady(){if(readied)return;readied=true;fails=0;clearOverlay();}
    video.addEventListener("playing",onReady);
    video.addEventListener("loadeddata",onReady);
    video.addEventListener("error",onErr);
    if(isFlv && window.flvjs && window.flvjs.isSupported()){
      var f=window.flvjs.createPlayer({type:"flv",isLive:true,url:url});f.attachMediaElement(video);f.load();
      hls={destroy:function(){try{f.destroy();}catch(e){}}};
      var pp=video.play&&video.play();if(pp&&pp.catch)pp.catch(function(){});
    } else if(video.canPlayType("application/vnd.apple.mpegurl")){ // iOS/Safari 原生 HLS
      video.src=url;var p0=video.play&&video.play();if(p0&&p0.catch)p0.catch(function(){});
    } else if(window.Hls && window.Hls.isSupported()){
      hls=new window.Hls({liveDurationInfinity:true,enableWorker:true});
      hls.loadSource(url);hls.attachMedia(video);
      hls.on(window.Hls.Events.MANIFEST_PARSED,function(){var pp=video.play&&video.play();if(pp&&pp.catch)pp.catch(function(){});});
      hls.on(window.Hls.Events.ERROR,function(e,data){if(data&&data.fatal)onErr();});
    } else {showMsg("当前浏览器不支持该直播格式，请换 Chrome / Edge，或用 iPhone Safari。",false);return;}
    setTimeout(function(){if(video&&video.readyState<2&&!readied)onErr();},15000);
  }
  function onErr(){
    fails++;
    if(fails<=2 && curUrl){showMsg("直播信号中断，正在重连…",true);setTimeout(function(){play(curUrl);},1500);return;}
    showMsg("暂时无法连接直播信号。可能是未开播、地址过期或跨域(CORS)未开启。请稍后点「刷新播放器」重试。",false);
    ctrls.style.display="flex";
  }

  // 控制按钮
  document.getElementById("lcSound").onclick=function(){if(video){video.muted=false;var pr=video.play();if(pr&&pr.catch)pr.catch(function(){});this.style.display="none";}};
  document.getElementById("lcFs").onclick=function(){
    var el=video||stage;
    if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);return;}
    if(video&&video.webkitEnterFullscreen){try{video.webkitEnterFullscreen();return;}catch(e){}}
    var req=stage.requestFullscreen||stage.webkitRequestFullscreen;if(req)try{req.call(stage);}catch(e){}
  };
  document.getElementById("lcReload").onclick=function(){fails=0;if(curUrl)play(curUrl);else load();};

  function apply(cfg){
    if(!cfg||cfg.enabled===false||!cfg.url){showMsg("直播尚未开始 / 正在准备中",false);return;}
    if(cfg.title)document.getElementById("lcTitle").firstChild.nodeValue=cfg.title;
    if(cfg.teacher)document.getElementById("lcSub").textContent="主讲 "+cfg.teacher+" · 独立直播观看页";
    play(cfg.url,cfg.type);
  }
  function load(){
    if(override){play(override,/\.flv(\?|$)/i.test(override)?"flv":"hls");return;}
    try{fetch(API+"/livecloud/config",{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(j){apply(j&&j.config);}).catch(function(){showMsg("直播尚未开始 / 正在准备中",false);});}
    catch(e){showMsg("直播尚未开始 / 正在准备中",false);}
  }
  load();
})();
</script>
</body>
</html>
