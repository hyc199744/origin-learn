<script>
(function(){
  var SRC="https://live.web3origin.com/live/yeliao.m3u8";
  var FLV="https://live.web3origin.com/live/yeliao.flv";
  var RTC_API="https://live.web3origin.com/rtc/v1/play/";
  var RTC_URL="webrtc://live.web3origin.com/live/yeliao";
  var v=document.getElementById('v'), badge=document.getElementById('badge'),
      status=document.getElementById('status'), tip=document.getElementById('tip'),
      tipst=document.getElementById('tipst'), play=document.getElementById('play'),
      pp=document.getElementById('pp'), mute=document.getElementById('mute'),
      vol=document.getElementById('vol'), full=document.getElementById('full'),
      pill=document.getElementById('pill'),
      started=false, hls=null;

  function online(){badge.classList.add('on');pill.classList.add('on');status.textContent='● 直播中';}
  function offline(t){badge.classList.remove('on');pill.classList.remove('on');status.textContent=t||'○ 暂未开播';}

  // ==== 自定义控件(无进度条) ====
  pp.onclick=function(){ if(!started){start();return;} if(v.paused)v.play().catch(function(){}); else v.pause(); };
  v.addEventListener('play',function(){pp.textContent='⏸';});
  v.addEventListener('pause',function(){pp.textContent='▶';});
  mute.onclick=function(){ v.muted=!v.muted; mute.textContent=v.muted?'🔇':'🔊'; if(!v.muted&&v.volume===0){v.volume=1;vol.value=1;} };
  vol.oninput=function(){ v.volume=parseFloat(vol.value); v.muted=(v.volume===0); mute.textContent=v.muted?'🔇':'🔊'; };
  full.onclick=function(){ var el=document.querySelector('.stage'); if(document.fullscreenElement){document.exitFullscreen();} else if(el.requestFullscreen){el.requestFullscreen();} else if(v.webkitEnterFullscreen){v.webkitEnterFullscreen();} };

  // ==== 自动播放 + 一键开声(浏览器禁止带声自动播,先静音播再提示开声) ====
  var unmute=document.getElementById('unmute');
  function showUnmute(){ if(unmute) unmute.hidden=false; }
  function doUnmute(){ v.muted=false; mute.textContent='🔊'; if(v.volume===0){v.volume=1;vol.value=1;} if(unmute)unmute.hidden=true; v.play().catch(function(){}); }
  if(unmute) unmute.onclick=function(e){ e.stopPropagation(); doUnmute(); };
  document.querySelector('.stage').addEventListener('click',function(){ if(unmute && !unmute.hidden) doUnmute(); });
  function tryPlay(){
    v.muted=false;
    var p=v.play();
    if(p && p.catch){ p.catch(function(){ v.muted=true; mute.textContent='🔇'; v.play().then(showUnmute,showUnmute); }); }
  }

  function probe(cb){
    fetch(SRC+'?p='+Date.now(),{cache:'no-store'}).then(function(r){cb(r.ok);}).catch(function(){cb(false);});
  }
  // ==== 第一顺位:WebRTC(约1秒延迟) ====
  var rtcpc=null;
  function startRtc(){
    var pc=new RTCPeerConnection({bundlePolicy:'max-bundle'}), done=false;
    rtcpc=pc;
    try{pc.addTransceiver('audio',{direction:'recvonly'});pc.addTransceiver('video',{direction:'recvonly'});}catch(_){}
    pc.ontrack=function(e){ if(e.streams&&e.streams[0]){v.srcObject=e.streams[0];online();tryPlay();} };
    var fb=setTimeout(function(){ if(!done){done=true;fail();} },6000); // 6秒连不上→退FLV
    function fail(){ try{pc.close();}catch(_){} rtcpc=null; startFlv(); }
    pc.oniceconnectionstatechange=function(){
      var s=pc.iceConnectionState;
      if(s==='connected'||s==='completed'){done=true;clearTimeout(fb);}
      else if(s==='failed'){ if(!done){done=true;clearTimeout(fb);fail();} }
    };
    pc.createOffer().then(function(o){return pc.setLocalDescription(o).then(function(){return o;});})
     .then(function(o){ return fetch(RTC_API,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({api:RTC_API,streamurl:RTC_URL,sdp:o.sdp})}); })
     .then(function(r){return r.json();})
     .then(function(j){ if(!j||!j.sdp)throw new Error('nosdp'); return pc.setRemoteDescription(new RTCSessionDescription({type:'answer',sdp:j.sdp})); })
     .catch(function(){ if(!done){done=true;clearTimeout(fb);fail();} });
  }

  var flvp=null;
  function startFlv(){
    v.srcObject=null;
    if(!(window.flvjs && flvjs.isSupported())){ startHls(true); return; }
    flvp=flvjs.createPlayer(
      {type:'flv',isLive:true,url:FLV},
      {enableStashBuffer:false,stashInitialSize:128,
       liveBufferLatencyChasing:true,liveBufferLatencyMaxLatency:3.0,liveBufferLatencyMinRemain:0.5}
    );
    flvp.attachMediaElement(v);
    flvp.load();
    online();
    tryPlay();
    flvp.on(flvjs.Events.ERROR,function(){ // FLV失败→退回HLS
      try{flvp.destroy();}catch(_){} flvp=null; startHls(true);
    });
  }
  function startHls(fallback){
    if(window.Hls && Hls.isSupported()){
      hls=new Hls({liveSyncDurationCount:3,maxBufferLength:20});
      hls.loadSource(SRC); hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED,function(){online();tryPlay();});
      hls.on(Hls.Events.ERROR,function(e,d){
        if(d && d.fatal){
          if(d.type==='networkError'){offline('信号中断，10 秒后自动重连…');setTimeout(function(){try{hls.startLoad();}catch(_){}},10000);}
          else if(d.type==='mediaError'){try{hls.recoverMediaError();}catch(_){}}
        }
      });
    } else if(v.canPlayType('application/vnd.apple.mpegurl')){
      v.src=SRC; v.addEventListener('loadedmetadata',function(){online();tryPlay();});
    } else if(!fallback){ tip.style.display='flex'; tipst.textContent='此浏览器不支持直播，请用 Chrome 或 Safari。'; started=false; }
  }
  function start(){
    if(started) return; started=true;
    tip.style.display='none';
    // 顺位:WebRTC(约1秒)→FLV(几秒)→HLS
    if(window.RTCPeerConnection){ startRtc(); }
    else if(window.flvjs && flvjs.isSupported()){ startFlv(); }
    else { startHls(false); }
  }
  play.onclick=start;

  // ==== 进群互动:微信二维码弹层 ====
  var wxbtn=document.getElementById('wxbtn'), wxmask=document.getElementById('wxmask'),
      wxclose=document.getElementById('wxclose');
  if(wxbtn){
    wxbtn.onclick=function(){wxmask.hidden=false;};
    wxclose.onclick=function(){wxmask.hidden=true;};
    wxmask.onclick=function(e){if(e.target===wxmask)wxmask.hidden=true;};
    document.addEventListener('keydown',function(e){if(e.key==='Escape')wxmask.hidden=true;});
  }

  // 初始探测:在播就自动开播,不用点收听
  probe(function(ok){
    if(ok){ online(); tip.style.display='none'; start(); }
    else{ offline(); tipst.textContent='主播暂未开播，开播后自动播放'; play.textContent='🔄 刷新看看'; play.onclick=function(){location.reload();}; }
  });
})();
</script>
<script>
/* 公屏聊天 + 在线人数 */
(function(){
  var WS="wss://live.web3origin.com/chat";
  var list=document.getElementById('clist'), msg=document.getElementById('cmsg'),
      nick=document.getElementById('nick'), sendb=document.getElementById('csend'),
      cnt=document.getElementById('cnt'), cnt2=document.getElementById('cnt2'),
      ws=null, reconn=null;
  if(!list) return;
  // 随机有趣昵称(没设过就自动给一个,不用"游客")
  var NA=['深夜','抄底','满仓','潜水','摸鱼','佛系','月光','迷路','快乐','淡定','稳健','冲浪','吃瓜','熬夜','逆袭','链上','一夜','起源','抱团','隐形','追风','闪电','自由','幸运','躺赢','围观','低调','高冷','元气','养生','硬核','暴富','神秘','看戏','贪吃'];
  var NB=['打工人','冲浪手','观察员','小散户','老铁','侠客','夜猫子','萌新','大佬','矿工','持币人','吃瓜群众','守夜人','追梦人','幸运星','锦鲤','行者','过客','船长','舵手','书生','剑客','浪人','骑士','柠檬','土豆','布丁','汤圆','橙子','阿源','花卷','包子','气球','喵星人','程序猿','小可爱'];
  function genName(){ return NA[Math.floor(Math.random()*NA.length)]+'的'+NB[Math.floor(Math.random()*NB.length)]+(Math.random()<0.5?(Math.floor(Math.random()*90)+10):''); }
  (function(){ var sn=''; try{sn=localStorage.getItem('yeliao_nick')||'';}catch(e){} if(!sn){ sn=genName(); try{localStorage.setItem('yeliao_nick',sn);}catch(e){} } nick.value=sn; })();
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function addMsg(m){
    var atBottom=list.scrollHeight-list.scrollTop-list.clientHeight<50;
    var d=document.createElement('div'); d.className='m';
    d.innerHTML='<span class="nm">'+esc(m.name)+'：</span><span class="tx">'+esc(m.text)+'</span>';
    list.appendChild(d);
    if(atBottom) list.scrollTop=list.scrollHeight;
  }
  function sys(t){var d=document.createElement('div');d.className='sys';d.textContent=t;list.appendChild(d);list.scrollTop=list.scrollHeight;}
  function setCount(n){ if(cnt)cnt.textContent='👥 '+n+' 在线'; if(cnt2)cnt2.textContent='👥 '+n; }
  function connect(){
    try{ws=new WebSocket(WS);}catch(e){reconn=setTimeout(connect,3000);return;}
    ws.onmessage=function(ev){
      var m; try{m=JSON.parse(ev.data);}catch(e){return;}
      if(m.type==='hello'){ list.innerHTML=''; (m.history||[]).forEach(addMsg); setCount(m.n||0); if(!(m.history&&m.history.length))sys('欢迎来到木火夜聊公屏 · 文明发言'); }
      else if(m.type==='msg'){ addMsg(m); }
      else if(m.type==='count'){ setCount(m.n); }
      else if(m.type==='blocked'){ sys('⚠️ 你的消息含违规内容，已被屏蔽'); }
    };
    ws.onclose=function(){ clearTimeout(reconn); reconn=setTimeout(connect,3000); };
    ws.onerror=function(){ try{ws.close();}catch(e){} };
  }
  function myName(){
    var nm=(nick.value||'').trim();
    if(!nm){ try{nm=localStorage.getItem('yeliao_nick')||'';}catch(e){} }  // 空了先用已存的
    if(!nm){ nm=genName(); }                                               // 实在没有才新生成一个
    nick.value=nm;
    try{localStorage.setItem('yeliao_nick',nm);}catch(e){}                 // 固定下来,以后都用它
    return nm;
  }
  function send(){
    var t=(msg.value||'').trim(); if(!t) return;
    if(!ws||ws.readyState!==1){ sys('连接中，请稍候…'); return; }
    ws.send(JSON.stringify({type:'msg',name:myName(),text:t})); msg.value='';
  }
  // 用户改了昵称就即时保存
  nick.addEventListener('change',function(){ var nm=(nick.value||'').trim(); if(nm){ try{localStorage.setItem('yeliao_nick',nm);}catch(e){} } });
  sendb.onclick=send;
  msg.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();send();} });
  connect();
})();
</script>
<script>
/* 往期回放:从夜聊VPS读清单(带CORS),mp3从R2播 */
(function(){
  var IDX="https://live.web3origin.com/replays/yeliao/index.json";
  var PLAYS="https://live.web3origin.com/chat/plays";
  var HIT="https://live.web3origin.com/chat/play?f=";
  var box=document.getElementById('replays'), list=document.getElementById('repList'), au=document.getElementById('repAudio');
  if(!box) return;
  var counted={}, pcEls={};
  function fmt(s){ s=s|0; var m=(s/60)|0, ss=s%60; return m+':'+(ss<10?'0':'')+ss; }
  function setPc(file,n){ if(pcEls[file]) pcEls[file].textContent='🎧 '+(n||0)+' 次'; }
  fetch(IDX+'?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():[];}).then(function(arr){
    if(!arr||!arr.length) return;
    box.hidden=false;
    arr.forEach(function(it){
      var d=document.createElement('div'); d.className='rep-item';
      d.innerHTML='<div class="ic">▶</div><div class="info"><div class="tt"></div><div class="mt"></div></div><div class="pc">🎧 -- 次</div>';
      d.querySelector('.tt').textContent=it.title||'木火夜聊回放';
      d.querySelector('.mt').textContent=fmt(it.duration||0);
      pcEls[it.file]=d.querySelector('.pc');
      d.onclick=function(){
        var cur=list.querySelector('.rep-item.playing'); if(cur){cur.classList.remove('playing');cur.querySelector('.ic').textContent='▶';}
        d.classList.add('playing'); d.querySelector('.ic').textContent='♪';
        au.src=it.url; au.classList.add('on'); au.play().catch(function(){});
        if(!counted[it.file]){ counted[it.file]=1;   // 每次访问同一回放只计一次
          fetch(HIT+encodeURIComponent(it.file)).then(function(r){return r.json();}).then(function(x){ setPc(it.file,x.n); }).catch(function(){});
        }
      };
      list.appendChild(d);
    });
    // 拉取各回放已有播放次数
    fetch(PLAYS+'?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():{};}).then(function(pm){
      for(var f in pcEls){ setPc(f, (pm&&pm[f])||0); }
    }).catch(function(){ for(var f in pcEls){ setPc(f,0);} });
  }).catch(function(){});
})();
</script>
