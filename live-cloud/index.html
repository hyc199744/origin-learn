<script>
(function(){
  var SRC="https://live.web3origin.com/live/yeliao.m3u8";
  var v=document.getElementById('v'), badge=document.getElementById('badge'),
      status=document.getElementById('status'), tip=document.getElementById('tip'),
      tipst=document.getElementById('tipst'), play=document.getElementById('play'),
      started=false, hls=null;

  function online(){badge.classList.add('on');status.textContent='● 直播中';}
  function offline(t){badge.classList.remove('on');status.textContent=t||'○ 暂未开播';}

  function probe(cb){
    fetch(SRC+'?p='+Date.now(),{cache:'no-store'}).then(function(r){cb(r.ok);}).catch(function(){cb(false);});
  }
  function start(){
    if(started) return; started=true;
    tip.style.display='none';
    if(window.Hls && Hls.isSupported()){
      hls=new Hls({liveSyncDurationCount:3,maxBufferLength:30});
      hls.loadSource(SRC);
      hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED,function(){online();v.play().catch(function(){});});
      hls.on(Hls.Events.ERROR,function(e,d){
        if(d && d.fatal){
          if(d.type==='networkError'){offline('信号中断，10 秒后自动重连…');setTimeout(function(){try{hls.startLoad();}catch(_){}},10000);}
          else if(d.type==='mediaError'){try{hls.recoverMediaError();}catch(_){}}
        }
      });
    } else if(v.canPlayType('application/vnd.apple.mpegurl')){
      v.src=SRC; v.addEventListener('loadedmetadata',function(){online();v.play();});
    } else { tip.style.display='flex'; tipst.textContent='此浏览器不支持直播，请用 Chrome 或 Safari。'; started=false; }
  }
  play.onclick=start;

  // 初始探测
  probe(function(ok){
    if(ok){online();tipst.textContent='直播进行中，点下方按钮开始收听';}
    else{offline();tipst.textContent='主播暂未开播，开播后刷新即可收听';play.textContent='🔄 刷新看看';play.onclick=function(){location.reload();};}
  });
})();
</script>
